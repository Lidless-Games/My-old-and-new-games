(function () {
  const G = window.G;
  const CFG = G.CFG;
  const TILE = CFG.TILE;

  const CYCLE = { chandelier: 6, spark: 3, plant: 3, flask: 6 };
  const BOB_W = 48, BOB_UP = 10, BOB_DOWN = 12; // body hitbox around bob point (rope end): x +-24, y -10..+12
  const HEAR = 14 * TILE;

  function sfx(name, opts) { if (G.sfx && G.sfx.play) G.sfx.play(name, opts); }
  function beatNow() { return (G.rhythm && G.rhythm.beat) ? G.rhythm.beat() : G.time * CFG.BPM / 60; }
  function rectCircle(r, cx, cy, rad) {
    const nx = G.util.clamp(cx, r.x, r.x + r.w), ny = G.util.clamp(cy, r.y, r.y + r.h);
    return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) <= rad * rad;
  }

  class Traps {
    constructor(world, player, level) {
      this.world = world; this.player = player; this.level = level;
      this.paused = false;
      this.traps = [];
      (level.entities || []).forEach((e) => {
        if (e.type !== 'trap' || !CYCLE[e.kind]) return;
        const p = world.entPos(e);
        this.traps.push({
          kind: e.kind, x: p.x, y: p.y, offset: e.offset || 0,
          // chandelier anchors at the top of its tile row
          ay: p.y - TILE,
          phase: 0, bm: 0, danger: false, warn: false, angle: 0, contact: false, lastSwingSide: 0,
          hit: null, // {rect} or {circle:{x,y,r}} current hitbox (null = none active)
          rope: 3 * TILE,
        });
        if (e.kind === 'chandelier') {
          const t = this.traps[this.traps.length - 1];
          const col = world.toTile(t.x);
          let r = world.toTile(t.ay) + 1;
          while (r < world.rows && !world.isSolid(col, r) && !world.isOneWay(col, r)) r++;
          const floorY = r * TILE;
          const clear = CFG.CHANDELIER_CLEAR ?? 36;
          t.rope = Math.max(1.5 * TILE, floorY - clear - BOB_DOWN - t.ay);
        }
      });
      this._init();
    }

    _init() { const b = beatNow(); for (const t of this.traps) { this._evaluate(t, b); } }

    reset() { for (const t of this.traps) t.contact = false; }

    _evaluate(t, beat) {
      const len = CYCLE[t.kind];
      const bm = (((beat + t.offset) % len) + len) % len; // beats into the cycle
      t.bm = bm; t.phase = bm / len;
      t.danger = false; t.warn = false; t.hit = null;
      if (t.kind === 'chandelier') {
        const amp = (CFG.CHANDELIER_AMP_DEG ?? 22) * Math.PI / 180;
        t.angle = amp * Math.sin(t.phase * Math.PI * 2);
        const bx = t.x + Math.sin(t.angle) * t.rope, by = t.ay + Math.cos(t.angle) * t.rope;
        t.bob = { x: bx, y: by };
        t.hit = { rect: { x: bx - BOB_W / 2, y: by - BOB_UP, w: BOB_W, h: BOB_UP + BOB_DOWN } };
        t.danger = true;
      } else if (t.kind === 'spark') {
        t.danger = bm < 0.5;
        t.warn = bm >= 2;
        // arc between two coils 3 tiles apart (coils at x +-1.5 tiles), at coil top height
        if (t.danger) t.hit = { rect: { x: t.x - 1.5 * TILE, y: t.y - 2 * TILE, w: 3 * TILE, h: 1.1 * TILE } };
      } else if (t.kind === 'plant') {
        t.danger = bm >= 2 && bm < 2.5;
        t.warn = bm >= 1 && bm < 2;
        if (t.danger) t.hit = { rect: { x: t.x - 0.5 * TILE, y: t.y - 1.5 * TILE, w: TILE, h: 1.5 * TILE } };
      } else if (t.kind === 'flask') {
        t.danger = bm >= 5;
        t.warn = bm >= 4 && bm < 5;
        if (t.danger) t.hit = { circle: { x: t.x, y: t.y - 1.6 * TILE, r: 1.5 * TILE } };
      }
    }

    _overlaps(t, pr) {
      if (!t.hit) return false;
      if (t.hit.rect) return G.util.overlap(pr, t.hit.rect);
      const c = t.hit.circle; return rectCircle(pr, c.x, c.y, c.r);
    }

    update(dt) {
      if (this.paused) return;
      const beat = beatNow();
      const p = this.player;
      const hidden = p.state === 'hidden';
      const pr = p.rect();
      for (const t of this.traps) {
        const wasDanger = t.danger, prevBm = t.bm;
        this._evaluate(t, beat);
        const d = G.util.dist(p.x, p.y, t.x, t.y);
        const vol = G.util.clamp(1 - d / HEAR, 0, 1);
        if (vol > 0) {
          if (t.kind === 'chandelier') {
            // whoosh each time the bob passes the lowest point (twice per cycle)
            const crossed = (prevBm < 3 && t.bm >= 3) || t.bm < prevBm;
            if (crossed) sfx('chandelier', { vol: vol * 0.6 });
          } else if (t.danger && !wasDanger) sfx(t.kind, { vol });
        }
        const hit = !hidden && this._overlaps(t, pr);
        if (hit && !t.contact) {
          t.contact = true;
          G.events.emit('caught', { by: 'trap', kind: t.kind, x: t.x, y: t.y });
        } else if (!hit) t.contact = false;
      }
    }

    draw(ctx) {
      const art = G.art, time = G.time;
      for (const t of this.traps) {
        const isCh = t.kind === 'chandelier';
        const x = t.x, y = isCh ? t.ay : t.y;
        if (art && art.drawTrap) {
          const off = this.paused && !isCh; // switched off while Ivy is carried/runs back
          art.drawTrap(ctx, x, y, { kind: t.kind, phase: off ? 0.1 : t.phase, danger: off ? false : t.danger, warn: off ? false : t.warn, t: time, angle: t.angle, rope: t.rope });
        } else this._placeholder(ctx, t);
      }
    }

    _placeholder(ctx, t) {
      ctx.save();
      if (t.kind === 'chandelier') {
        ctx.strokeStyle = '#c9cfe0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(t.x, t.ay); ctx.lineTo(t.bob.x, t.bob.y); ctx.stroke();
        ctx.fillStyle = '#f3a03a'; ctx.beginPath(); ctx.arc(t.bob.x, t.bob.y, 14, 0, 7); ctx.fill();
      } else if (t.kind === 'spark') {
        ctx.fillStyle = '#6b2e3e';
        ctx.fillRect(t.x - 1.5 * TILE - 6, t.y - 2 * TILE, 12, 2 * TILE);
        ctx.fillRect(t.x + 1.5 * TILE - 6, t.y - 2 * TILE, 12, 2 * TILE);
        if (t.danger) { ctx.strokeStyle = '#c9e8ff'; ctx.lineWidth = 3; ctx.beginPath();
          ctx.moveTo(t.x - 1.5 * TILE, t.y - 2 * TILE); for (let i = 1; i <= 8; i++) ctx.lineTo(t.x - 1.5 * TILE + i * TILE * 3 / 8, t.y - 2 * TILE + (i % 2 ? 10 : -4)); ctx.stroke(); }
        else if (t.warn) { ctx.fillStyle = '#c9e8ff'; ctx.fillRect(t.x - 1.5 * TILE - 3, t.y - 2 * TILE - 6, 6, 6); ctx.fillRect(t.x + 1.5 * TILE - 3, t.y - 2 * TILE - 6, 6, 6); }
      } else if (t.kind === 'plant') {
        ctx.fillStyle = t.danger ? '#a3203a' : t.warn ? '#9bd35a' : '#3b5230';
        ctx.fillRect(t.x - 0.5 * TILE, t.y - (t.danger ? 1.5 : 0.8) * TILE, TILE, (t.danger ? 1.5 : 0.8) * TILE);
      } else if (t.kind === 'flask') {
        ctx.fillStyle = '#5e7d4a'; ctx.fillRect(t.x - 10, t.y - 26, 20, 26);
        if (t.danger) { ctx.fillStyle = 'rgba(155,211,90,0.5)'; ctx.beginPath(); ctx.arc(t.x, t.y - 1.6 * TILE, 1.5 * TILE, 0, 7); ctx.fill(); }
        else if (t.warn) { ctx.fillStyle = 'rgba(155,211,90,0.3)'; ctx.beginPath(); ctx.arc(t.x, t.y - 36, 10, 0, 7); ctx.fill(); }
      }
      ctx.restore();
    }
  }

  G.Traps = Traps;
})();

// ===== ghosts.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;
  const T = CFG.TILE;

  const EYE = 32;            // eye height above the ghost's tail tip
  const HOVER = 0.3 * T;     // tail floats this far above the floor
  const HEAR_PAUSE = 1.5, APPEAR_TIME = 0.8, FADE_OUT = 0.6, SUMMON_RANGE = 3;
  const LOOK_TIME = 1.2, NOTICE_TIME = 0.35, SEE_STILL = 0.2, POINT_MAX = 8;

  function sfx(name, opts) { if (G.sfx && G.sfx.play) G.sfx.play(name, opts); }

  class Ghosts {
    constructor(world, player, level) {
      this.world = world; this.player = player; this.level = level;
      this.paused = false; this.t = 0;
      this.ghosts = [];
      this.fading = [];
      this._noise = (d) => this.hearNoise(d);
      G.events.on('noise', this._noise);
      (level.entities || []).forEach((e) => {
        if (e.type !== 'ghost') return;
        const p = world.entPos(e);
        const a = (e.from == null ? e.tx : e.from), b = (e.to == null ? e.tx : e.to);
        const from = Math.min(a, b) + 0.5, to = Math.max(a, b) + 0.5;
        this.ghosts.push({
          x: p.x, y: p.y - HOVER, floorY: p.y, from: from * T, to: to * T,
          speed: e.speed || 45, view: e.view || 6,
          startX: p.x, startFacing: (e.to == null || e.to >= e.tx) ? 1 : -1,
          facing: 1, dir: 1, state: 'patrol', timer: 0, notice: 0, alert: 0, bob: Math.random() * 6, point: 0,
          appear: 1, hear: 0, summoned: false,
        });
      });
      this.reset();
    }

    // Summoned / scripted ghost. x,y in px (y = floor level under the ghost). Patrols +-3 tiles (clipped by walls),
    // starts facing AWAY from Ivy; fades in and cannot see for APPEAR_TIME so it is fair.
    add(x, y, opts) {
      opts = opts || {};
      const w = this.world, p = this.player;
      const range = opts.range == null ? SUMMON_RANGE : opts.range;
      const col = w.toTile(x), row = w.toTile(y - 8);
      let l = col, r = col;
      while (col - l < range && !w.isSolid(l - 1, row)) l--;
      while (r - col < range && !w.isSolid(r + 1, row)) r++;
      const away = (p && p.x >= x) ? -1 : 1;
      const g = {
        x, y: y - HOVER, floorY: y, from: (l + 0.5) * T, to: (r + 0.5) * T,
        speed: opts.speed || 40, view: opts.view || 6,
        startX: x, startFacing: away, facing: away, dir: away, state: 'patrol', timer: 0, notice: 0, alert: 0,
        bob: Math.random() * 6, point: 0, appear: opts.instant ? 1 : 0, hear: 0, summoned: true, born: this.t,
      };
      if (g.from === g.to) { g.state = 'look'; }
      this.ghosts.push(g);
      return g;
    }

    remove(g) {
      const i = this.ghosts.indexOf(g);
      if (i < 0) return false;
      this.ghosts.splice(i, 1);
      g.fade = 0; this.fading.push(g);
      return true;
    }

    // a noise at (x,y) with radius px: nearby ghosts turn towards it and pause patrol
    hearNoise(d) {
      if (!d) return;
      for (const g of this.ghosts) {
        if (g.state === 'point' || g.state === 'notice' || g.appear < 1) continue;
        if (Math.hypot(d.x - g.x, d.y - g.floorY) > d.radius) continue;
        this._turnTo(g, d.x);
      }
    }

    _turnTo(g, x) {
      g.state = 'hear'; g.hear = HEAR_PAUSE;
      g.facing = x >= g.x ? 1 : -1;
    }

    _hearsPlayer(g, anyDir) {
      const p = this.player;
      if (!p || p.state === 'hidden' || p.control === false) return false;
      if ((p.noise || 0) <= CFG.NOISE_SNEAK * 1.5) return false;
      const R = (CFG.GHOST_HEAR_RADIUS ?? 3.5) * T;
      return Math.abs(p.x - g.x) <= R && Math.abs((p.y - g.floorY)) <= 2.5 * T && (anyDir || (p.x - g.x) * g.facing < 0);
    }

    reset() {
      for (const g of this.ghosts) {
        g.x = g.startX; g.facing = g.startFacing; g.dir = g.startFacing;
        g.state = 'patrol'; g.timer = 0; g.notice = 0; g.alert = 0; g.point = 0; g.hear = 0; g.appear = 1;
        if (g.from === g.to) g.state = 'look';
      }
    }

    eye(g) { return { x: g.x, y: g.y - EYE }; }

    // visible length of the cone (clipped by solid tiles straight ahead)
    coneLength(g) {
      const w = this.world, e = this.eye(g), full = g.view * T;
      for (let d = 6; d <= full; d += 6) if (w.isSolid(w.toTile(e.x + g.facing * d), w.toTile(e.y))) return d - 6;
      return full;
    }

    _sees(g) {
      const p = this.player;
      if (!p || p.state === 'hidden' || p.faded || p.stillTime > SEE_STILL) return false;
      const e = this.eye(g), cx = p.x, cy = p.y - p.h / 2;
      const dx = (cx - e.x) * g.facing, L = g.view * T;
      if (dx < -8 || dx > L) return false;
      const half = 0.6 * T + (1.6 * T - 0.6 * T) * Math.max(0, dx) / L;
      if (Math.abs(cy - e.y) > half) return false;
      const w = this.world, n = Math.ceil(Math.hypot(cx - e.x, cy - e.y) / 6);
      for (let i = 1; i < n; i++) {
        const k = i / n;
        if (w.isSolid(w.toTile(e.x + (cx - e.x) * k), w.toTile(e.y + (cy - e.y) * k))) return false;
      }
      return true;
    }

    update(dt) {
      this.t += dt;
      for (const g of this.fading) g.fade += dt / FADE_OUT;
      this.fading = this.fading.filter((g) => g.fade < 1);
      for (const g of this.ghosts) {
        g.bob += dt;
        if (g.appear < 1) g.appear = Math.min(1, g.appear + dt / APPEAR_TIME);
        g.y = g.floorY - HOVER - 4 - Math.sin(g.bob * 2.1) * 4;
        if (this.paused) continue;
        const p = this.player;
        if (g.state === 'point') {
          g.point += dt;
          if (g.point > POINT_MAX) { g.state = 'patrol'; g.point = 0; g.alert = 0; }
          continue;
        }
        if (g.state === 'hear') {
          g.hear -= dt;
          if (this._hearsPlayer(g, true)) g.hear = HEAR_PAUSE; // still noisy nearby: keep listening
          if (g.appear >= 1 && this._sees(g)) { g.state = 'notice'; g.notice = 0; g.alert = 0; g.facing = p.x >= g.x ? 1 : -1; sfx('stir', { vol: 0.6 }); continue; }
          if (g.hear <= 0) { g.state = 'patrol'; g.facing = g.dir; }
          continue;
        }
        if (g.state === 'notice') {
          g.notice += dt; g.alert = Math.min(1, g.notice / NOTICE_TIME);
          if (!this._sees(g)) { g.state = 'patrol'; g.notice = 0; g.alert = 0; g.facing = g.dir; continue; }
          g.facing = p.x >= g.x ? 1 : -1;
          if (g.notice >= NOTICE_TIME) {
            g.state = 'point'; g.point = 0; g.alert = 1;
            sfx('wake');
            G.events.emit('caught', { by: 'ghost', who: 'ghost', x: g.x, y: g.y });
          }
          continue;
        }
        g.alert = Math.max(0, g.alert - dt * 2);
        if (g.state === 'patrol') {
          const target = g.dir > 0 ? g.to : g.from;
          const step = g.speed * dt;
          if (g.from === g.to || Math.abs(target - g.x) <= step) {
            g.x = target; g.state = 'look'; g.timer = 0; g.facing = g.dir;
          } else { g.x += g.dir * step; g.facing = g.dir; }
        } else if (g.state === 'look') {
          g.timer += dt;
          const tm = g.timer / LOOK_TIME;
          g.facing = tm < 0.25 ? g.dir : tm < 0.5 ? -g.dir : tm < 0.75 ? g.dir : -g.dir;
          if (g.timer >= LOOK_TIME) { g.dir = -g.dir; g.state = 'patrol'; g.facing = g.dir; }
        }
        if ((g.state === 'patrol' || g.state === 'look') && g.appear >= 1 && this._hearsPlayer(g)) this._turnTo(g, p.x);
        if ((g.state === 'patrol' || g.state === 'look' || g.state === 'hear') && g.appear >= 1 && this._sees(g)) {
          g.state = 'notice'; g.notice = 0; g.alert = 0; g.facing = p.x >= g.x ? 1 : -1;
          sfx('stir', { vol: 0.6 });
        }
      }
    }

    draw(ctx) {
      const A = G.art;
      if (!A) return;
      for (const g of this.fading) {
        ctx.save(); ctx.globalAlpha = 1 - g.fade;
        if (A.drawGhost) A.drawGhost(ctx, g.x, g.y - g.fade * 20, { facing: g.facing, state: 'patrol', t: g.bob, alert: 0 });
        ctx.restore();
      }
      for (const g of this.ghosts) {
        ctx.save(); ctx.globalAlpha = g.appear;
        const e = this.eye(g);
        if (A.drawGhostCone && g.state !== 'point') A.drawGhostCone(ctx, e.x, e.y, { facing: g.facing, length: this.coneLength(g), full: g.view * T, t: this.t, alert: g.alert });
        if (A.drawGhost) A.drawGhost(ctx, g.x, g.y, { facing: g.facing, state: g.state, t: g.bob, alert: g.alert });
        ctx.restore();
      }
    }
  }

  G.Ghosts = Ghosts;
})();

// ===== dungeon.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;
  const T = CFG.TILE;

  const LOOP = 6;                       // skeleton / rock loop in beats
  const SK_W = 20, SK_H = 50;           // skeleton hitbox
  const ROCK = 28;                      // rock hitbox size
  const REACH = T;                      // how close Ivy must be to a torch / candle
  const DARK_FADE = 0.4;                // seconds to cross-fade the darkness
  const SOLVE_DELAY = 0.6, FAIL_DELAY = 0.5, DOOR_TIME = 1.2, DOOR_PASS = 0.8, PUFF_TIME = 0.8;
  const MAX_GHOSTS = 3;

  function sfx(name, opts) { if (G.sfx && G.sfx.play) G.sfx.play(name, opts); }
  function beatNow() { return (G.rhythm && G.rhythm.beat) ? G.rhythm.beat() : G.time * CFG.BPM / 60; }
  function mod(a, n) { return ((a % n) + n) % n; }

  class Dungeon {
    constructor(world, player, level, ghosts) {
      this.world = world; this.player = player; this.level = level; this.ghosts = ghosts || null;
      this.paused = false; this.t = 0;
      this.scrollReached = false;
      this.skeletons = []; this.rocks = []; this.webs = []; this.zones = []; this.torches = [];
      this.candles = []; this.door = null; this.scroll = null; this.spawns = [];
      this.puzzle = { lit: [], right: [], state: 'idle', timer: 0, solved: false };
      this._dark = 0;
      this._summoned = [];
      const ents = level.entities || [];

      ents.forEach((e) => {
        const p = world.entPos(e);
        if (e.type === 'skeletons') {
          const w = (e.width || 4) * T;
          this.skeletons.push({
            x0: e.tx * T, w, y: p.y, offset: e.offset || 0, phase: 0, c: e.tx * T + w / 2, facing: 1,
            a: { x: 0, y: p.y }, b: { x: 0, y: p.y }, contact: false,
          });
        } else if (e.type === 'rockfall') {
          const col = e.tx;
          let r = e.ty; while (r > 0 && !world.isSolid(col, r)) r--;
          const ceilY = world.isSolid(col, r) ? (r + 1) * T : 0;
          const floorY = (e.ty + 1) * T;
          const top = ceilY + ROCK, dist = Math.max(1, floorY - top);
          const fallSec = Math.min(0.55, Math.sqrt(2 * dist / 3000));
          this.rocks.push({
            x: p.x, ceilY, floorY, offset: e.offset || 0, state: 'hang', k: 0, y: top, top,
            fallBeats: fallSec * CFG.BPM / 60, contact: false, hit: null, landed: false,
          });
        } else if (e.type === 'web') {
          this.webs.push({ x: e.tx * T, y: (e.ty + 1) * T, len: e.len || 3, torn: false, tornT: 0 });
        } else if (e.type === 'dark') {
          this.zones.push({ x: e.tx * T, y: e.ty * T, w: (e.w || 12) * T, h: (e.h || 8) * T, lit: false, torches: [] });
        } else if (e.type === 'torch') {
          this.torches.push({ x: p.x, y: p.y, zone: e.zone || 0, lit: false, litT: 0 });
        } else if (e.type === 'candles') {
          for (let i = 0; i < 4; i++) this.candles.push({ x: (e.tx + 0.5 + 1.5 * i) * T, y: p.y, lit: false, puff: 0, i });
        } else if (e.type === 'door') {
          this.door = { tx: e.tx, ty: e.ty, x: (e.tx + 1) * T, y: p.y, open: 0, opening: false, sfxDone: false };
        } else if (e.type === 'scroll') {
          this.scroll = { x: p.x, y: p.y };
        } else if (e.type === 'ghostspawn') {
          this.spawns.push({ x: p.x, y: p.y });
        }
      });
      for (const tc of this.torches) if (this.zones[tc.zone]) this.zones[tc.zone].torches.push(tc);

      // random right set: 3 of the 4 candles
      const wrong = Math.floor(Math.random() * 4);
      this.puzzle.right = [0, 1, 2, 3].filter((i) => i !== wrong);

      const d = this.door;
      world.extraSolid = (tx, ty) => this.isSolid(tx, ty);
      this.update(0, true);
    }

    // ---------- queries ----------
    isSolid(tx, ty) {
      const d = this.door;
      if (!d || d.open > DOOR_PASS) return false;
      return tx >= d.tx && tx <= d.tx + 1 && ty >= d.ty - 2 && ty <= d.ty;
    }

    _web(p) { // web under Ivy's feet, or null
      if (!p.onGround || p.onLadder) return null;
      for (const w of this.webs) if (p.x >= w.x && p.x <= w.x + w.len * T && Math.abs(p.y - w.y) < 6) return w;
      return null;
    }

    speedMul() {
      const w = this._web(this.player);
      return (w && !w.torn) ? (CFG.WEB_SLOW ?? 0.45) : 1;
    }

    _zoneAt(x, y) {
      for (const z of this.zones) if (x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h) return z;
      return null;
    }

    lightStrength(base) {

    _nearestCandle() {

      let best = null, bd = 1e9;
      for (const c of this.candles) if (!c.lit && this._near(c)) { const d = Math.abs(this.player.x - c.x); if (d < bd) { bd = d; best = c; } }
      return best;

    nearestAction() {

      if (this._nearestCandle()) return 'hint_candle';

    }

    reset() {

        pool = [far];

      }
      for (const tc of this.torches) {
        if (A.drawTorch) A.drawTorch(ctx, tc.x, tc.y, { lit: tc.lit, t });
        else this._ph(ctx, 'torch', tc);
      }
      for (const c of this.candles) {
        if (A.drawPuzzleCandle) A.drawPuzzleCandle(ctx, c.x, c.y, { lit: c.lit, t, puff: c.puff > 0 ? 1 - c.puff : 0 });
        else this._ph(ctx, 'candle', c);
      }
      if (this.door) {
        if (A.drawDoor) A.drawDoor(ctx, this.door.x, this.door.y, { open: this.door.open, t });
        else this._ph(ctx, 'door', this.door);
      }
      if (this.scroll) {
        const glow = this.door ? G.util.clamp((this.door.open - 0.3) / 0.7, 0, 1) : 0;
        if (A.drawScroll) A.drawScroll(ctx, this.scroll.x, this.scroll.y, { t, glow });
        else this._ph(ctx, 'scroll', this.scroll, glow);
      }

        }
        else this._ph(ctx, 'rock', r);
      }
      for (const s of this.skeletons) {
        if (A.drawSkeleton) {
          A.drawSkeleton(ctx, s.a.x, s.y, { t, phase: s.phase, facing: s.facing, partner: false });
          A.drawSkeleton(ctx, s.b.x, s.y, { t, phase: s.phase, facing: s.facing, partner: true });
        } else { this._ph(ctx, 'skel', s.a, 0, s); this._ph(ctx, 'skel', s.b, 0, s); }

    _ph(ctx, kind, o, glow, s) {

    return L;
  }

  // ================================================================ 5. The crypt (dungeon, part 1)
  function crypt1() {
    const F = 13, L = dg(make(105, 15, F, 2));
    // arrival
    L.deco(3, 'archway').chain(8).cobweb(1).deco(7, 'urn').hide(10, 'armor');
    // 1. dancing skeletons: wait for a gap or jump over them
    L.deco(13, 'bones').skel(16, 6, 0).chain(19).deco(24, 'skulls').hide(26, 'curtain');
    // 2. rockfall under a low vault (watch the dust)
    L.low(31, 37, 5).rock(34, 0).deco(30, 'tomb').chain(33).chain(36);
    L.hide(42, 'armor').deco(45, 'urn');
    // 3. cobweb passage, then a ghost on patrol
    L.cweb(48, 3).cobweb(47).chain(50).deco(53, 'bones');
    L.hide(55, 'curtain').ghost(59, 63, 4, 40).deco(65, 'coffin').chain(60);
    L.hide(69, 'armor');
    // 4. dark zone with two torches
    L.dark(72, 18).torch(74, 0).torch(86, 0).deco(79, 'tomb').deco(83, 'skulls').chain(81).cobweb(73);
    L.hide(91, 'curtain');
    // 5. final waltz
    L.skel(94, 5, 3).deco(93, 'urn').chain(97).deco(101, 'candelabra').deco(100, 'banner', F - 3);
    return finish(L, {
      id: 'crypt1', nameKey: 'lvl_crypt1', theme: 'crypt', introKey: 'intro_crypt1',
      start: { tx: 6, ty: F - 1 }, exit: { tx: 102, ty: F - 1 },
    });
  }

  // ================================================================ 6. The scroll chamber (dungeon, part 2)
  function crypt2() {
    const W = 122, F = 13, L = dg(make(W, 15, F, 2));
    L.deco(3, 'archway').chain(8).cobweb(1).deco(7, 'urn').hide(10, 'armor');
    // skeleton ballroom: two pairs, out of step
    L.deco(12, 'bones').skel(14, 5, 0).chain(17).hide(22, 'curtain').deco(24, 'skulls');
    L.skel(26, 6, 3).chain(29).deco(33, 'bones').hide(34, 'armor');
    // two stones under a low vault
    L.low(38, 46, 5).rock(40, 0).rock(44, 2).chain(42).deco(49, 'urn').hide(52, 'curtain');
    // webs with a ghost between them
    L.cweb(56, 3).cobweb(55).ghost(62, 66, 4, 40).hide(60, 'armor').deco(68, 'coffin').hide(70, 'curtain');
    L.cweb(73, 3).chain(74).deco(76, 'skulls');
    // dark zone: web, stone, two torches
    L.hide(77, 'armor').dark(79, 19).torch(81, 0).torch(96, 0).deco(84, 'tomb').cobweb(80);
    L.cweb(87, 2).low(89, 93, 5).rock(91, 4).chain(90).deco(94, 'bones');
    L.hide(99, 'curtain');
    // candle room
    L.deco(101, 'bones').chain(103).chain(108).deco(115, 'banner', F - 3).hide(110, 'curtain');
    L.ents.push({ type: 'candles', tx: 103, ty: F - 1 });
    L.ents.push({ type: 'door', tx: 113, ty: F - 1 });
    L.ents.push({ type: 'scroll', tx: 117, ty: F - 1 });
    [20, 32, 48, 67, 83, 95, 102, 107].forEach((x) => L.spawn(x));
    L.deco(100, 'candelabra').deco(119, 'candelabra');
    return finish(L, {
      id: 'crypt2', nameKey: 'lvl_crypt2', theme: 'crypt', introKey: 'intro_crypt2',
      start: { tx: 6, ty: F - 1 }, exit: { tx: W + 8, ty: F - 1 }, // unreachable: the level ends at the scroll
    });
  }

  G.LEVELS = [floor1(), floor2(), floor3(), floor4(), crypt1(), crypt2()];
})();

// ===== ui.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;
  const PAL = CFG.PAL;
  const W = CFG.VIEW_W, H = CFG.VIEW_H;
  const FONT = 'Georgia, serif';

  function T(k, v) { return G.t(k, v); }
  function sfx(name) { if (G.sfx && G.sfx.play) { try { G.sfx.play(name); } catch (e) {} } }
  function hasArt(fn) { return !!(G.art && typeof G.art[fn] === 'function'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function musicOn() { return G.save.get('music', true) !== false; }
  function setMusic(on) {
    G.save.set('music', !!on);
    if (G.rhythm && G.rhythm.setMusicEnabled) G.rhythm.setMusicEnabled(!!on);
  }
  function startGame(i) { if (G.game && G.game.start) G.game.start(i); }
  function toLogical(e) {
    const r = G.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- title / main menu ----------
  const MAIN_Y0 = 270, MAIN_STEP = 50;
  let page = 'main';   // 'main' | 'controls'
  let sel = 0;
  let rects = [];      // hit rects of the last drawn frame: {x,y,w,h,index}

  function items() {
    if (page === 'controls') return [{ id: 'back' }];
    const list = [{ id: 'new' }];
    if (G.save.get('progress', 0) > 0) list.push({ id: 'continue' });
    list.push({ id: 'lang' }, { id: 'music' }, { id: 'controls' });
    return list;
  }
  function label(id) {
    switch (id) {
      case 'new': return T('menu_new');
      case 'continue': return T('menu_continue');
      case 'lang': return T('menu_lang') + ': ' + T('lang_name');
      case 'music': return T('menu_music') + ': ' + T(musicOn() ? 'on' : 'off');
      case 'controls': return T('menu_controls');
      case 'back': return T('menu_back');
    }
    return id;
  }
  function activate(id) {
    switch (id) {
      case 'new': sfx('ui_ok'); startGame(0); break;
      case 'continue': sfx('ui_ok'); startGame(G.save.get('progress', 0)); break;
      case 'lang': sfx('ui_ok'); G.i18n.setLang(G.i18n.lang === 'hu' ? 'en' : 'hu'); break;
      case 'music': sfx('ui_ok'); setMusic(!musicOn()); break;
      case 'controls': sfx('ui_ok'); page = 'controls'; sel = 0; break;
      case 'back': {
        sfx('ui_ok');
        page = 'main';
        const idx = items().findIndex((it) => it.id === 'controls');
        sel = idx < 0 ? 0 : idx;
        break;
      }
    }
  }

  function onPointerDown(e) {
    const p = toLogical(e);
    if (page === 'controls') { activate('back'); return; }
    const hit = rects.find((r) => inRect(p, r));
    if (!hit) return;
    sel = hit.index;
    activate(items()[hit.index].id);
  }
  function onPointerMove(e) {
    const p = toLogical(e);
    const hit = rects.find((r) => inRect(p, r));
    if (hit && page === 'main') sel = hit.index;
  }

  function drawDecor(ctx) {
    if (hasArt('drawIvy')) {
      ctx.save();
      ctx.translate(165, 500);
      ctx.scale(1.8, 1.8);
      G.art.drawIvy(ctx, 0, 0, { state: 'idle', facing: 1, t: G.time, speed: 0 });
      ctx.restore();
    }
    if (hasArt('drawCrow')) {
      G.art.drawCrow(ctx, 800, 300, { t: G.time, heads: 2, scale: 1.5 });
    }
  }

  const MenuScene = {
    enter() {
      rects = [];
      sel = 0;
      page = 'main';
      if (G.canvas) {
        G.canvas.addEventListener('pointerdown', onPointerDown);
        G.canvas.addEventListener('pointermove', onPointerMove);
      }
      if (G.rhythm) {
        if (G.rhythm.setMusicEnabled) G.rhythm.setMusicEnabled(musicOn());
        if (G.rhythm.startMusic) G.rhythm.startMusic('menu');
      }
    },
    exit() {
      if (G.canvas) {
        G.canvas.removeEventListener('pointerdown', onPointerDown);
        G.canvas.removeEventListener('pointermove', onPointerMove);
      }
    },
    update() {
      const list = items();
      if (sel >= list.length) sel = list.length - 1;
      if (sel < 0) sel = 0;
      const n = list.length;
      if (G.input.pressed('up')) { sel = (sel + n - 1) % n; sfx('ui_move'); }
      if (G.input.pressed('down')) { sel = (sel + 1) % n; sfx('ui_move'); }
      const id = list[sel].id;
      if (page === 'controls') {
        if (G.input.pressed('confirm') || G.input.pressed('action') || G.input.pressed('back')) activate('back');
        return;
      }
      if ((G.input.pressed('left') || G.input.pressed('right')) && (id === 'lang' || id === 'music')) {
        activate(id);
      } else if (G.input.pressed('confirm') || G.input.pressed('action')) {
        activate(id);
      }
    },
    draw(ctx) {
      ctx.fillStyle = PAL.plum;
      ctx.fillRect(0, 0, W, H);
      if (hasArt('drawBackground')) {
        G.art.drawBackground(ctx, { x: 0, y: 0 }, 'hall', G.time);
      } else {
        const g = ctx.createRadialGradient(W * 0.75, 110, 20, W * 0.5, H * 0.5, W * 0.7);
        g.addColorStop(0, PAL.plumLight);
        g.addColorStop(1, PAL.plumDeep);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.fillStyle = 'rgba(23,19,30,0.55)';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      if (page === 'main') drawDecor(ctx);

      // title
      ctx.shadowColor = PAL.bordeaux;
      ctx.shadowBlur = 14;
      ctx.font = 'bold 64px ' + FONT;
      ctx.fillStyle = PAL.cream;
      ctx.fillText(T('title'), W / 2, 150);
      ctx.shadowBlur = 0;
      ctx.font = 'italic 24px ' + FONT;
      ctx.fillStyle = PAL.moon;
      ctx.fillText(T('subtitle'), W / 2, 192);
      ctx.save();
      ctx.font = '13px ' + FONT; ctx.fillStyle = PAL.moonDim; ctx.globalAlpha = 0.8;
      ctx.fillText('© 2026 Lidless · CC BY-NC 4.0', W / 2, 528);
      ctx.restore();

      rects = [];
      if (page === 'controls') {
        ctx.font = '20px ' + FONT;
        ctx.fillStyle = PAL.cream;
        for (let i = 1; i <= 6; i++) {
          ctx.fillText(T('controls_' + i), W / 2, 248 + (i - 1) * 36);
        }
      }

      const list = items();
      const y0 = page === 'controls' ? 470 : MAIN_Y0;
      list.forEach((it, i) => {
        const y = y0 + i * MAIN_STEP;
        const r = { x: W / 2 - 200, y: y - 30, w: 400, h: 42, index: i };
        rects.push(r);
        const isSel = i === sel;
        if (isSel) {
          ctx.fillStyle = 'rgba(107,46,62,0.7)';
          roundRect(ctx, r.x, r.y, r.w, r.h, 10);
          ctx.fill();
        }
        ctx.font = (isSel ? 'bold ' : '') + '26px ' + FONT;
        ctx.fillStyle = isSel ? PAL.amberLight : PAL.cream;
        ctx.fillText((isSel ? '› ' : '') + label(it.id) + (isSel ? ' ‹' : ''), W / 2, y);
      });
      ctx.restore();
    }
  };
  G.ui = G.ui || {};
  G.ui.MenuScene = MenuScene;

  // ---------- HUD (screen space) ----------
  function drawEye(ctx, cx, cy, a) {
    const hw = 22, hh = 12;
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy);
    ctx.quadraticCurveTo(cx, cy - hh * 2, cx + hw, cy);
    ctx.quadraticCurveTo(cx, cy + hh * 2, cx - hw, cy);
    ctx.closePath();
    ctx.fillStyle = 'rgba(23,19,30,0.72)';
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = a > 0.6 ? PAL.bordeauxLight : PAL.moon;
    ctx.beginPath();
    ctx.arc(cx, cy, 3 + a * 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
    ctx.fillStyle = PAL.ink;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy);
    ctx.quadraticCurveTo(cx, cy - hh * 2, cx + hw, cy);
    ctx.quadraticCurveTo(cx, cy + hh * 2, cx - hw, cy);
    ctx.closePath();
    ctx.strokeStyle = PAL.moonDim;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  G.ui.drawHUD = function (ctx, opts) {
    opts = opts || {};
    ctx.save();
    ctx.textBaseline = 'middle';
    if (opts.levelName) {
      ctx.textAlign = 'left';
      ctx.font = '16px ' + FONT;
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = PAL.cream;
      ctx.fillText(T(opts.levelName), 20, 26);
      ctx.shadowBlur = 0;
    }
    drawEye(ctx, W - 40, 30, clamp(opts.alert || 0, 0, 1));
    if (opts.hint) {
      const text = T(opts.hint);
      ctx.font = '18px ' + FONT;
      const pw = ctx.measureText(text).width + 32, ph = 34;
      const px = (W - pw) / 2, py = H - 22 - ph;
      ctx.fillStyle = 'rgba(23,19,30,0.72)';
      roundRect(ctx, px, py, pw, ph, 12);
      ctx.fill();
      ctx.textAlign = 'center';
      ctx.fillStyle = PAL.cream;
      ctx.fillText(text, W / 2, py + ph / 2 + 1);
    }
    ctx.restore();
  };

  // ---------- pause overlay ----------
  const PAUSE_RECTS_Y = [280, 350];
  const PauseOverlay = {
    sel: 0,
    active: false,   // pointer clicks count only while active (set by reset())
    _click: -1,
    _rects: [],
    _listening: false,

    // Call when the pause opens.
    reset() { this.sel = 0; this.active = true; this._click = -1; },

    _ensureListeners() {
      if (this._listening || !G.canvas) return;
      this._listening = true;
      G.canvas.addEventListener('pointerdown', (e) => {
        if (!PauseOverlay.active) return;
        const p = toLogical(e);
        const hit = PauseOverlay._rects.find((r) => inRect(p, r));
        if (hit) { PauseOverlay._click = hit.index; PauseOverlay.sel = hit.index; }
      });
      G.canvas.addEventListener('pointermove', (e) => {
        if (!PauseOverlay.active) return;
        const p = toLogical(e);
        const hit = PauseOverlay._rects.find((r) => inRect(p, r));
        if (hit) PauseOverlay.sel = hit.index;
      });
    },

    _finish(result) { this.active = false; this._click = -1; return result; },

    update(dt) {
      this._ensureListeners();
      if (G.input.pressed('pause') || G.input.pressed('back')) return this._finish('resume');
      if (G.input.pressed('up')) { this.sel = (this.sel + 1) % 2; sfx('ui_move'); }
      if (G.input.pressed('down')) { this.sel = (this.sel + 1) % 2; sfx('ui_move'); }
      let choice = -1;
      if (this._click >= 0) { choice = this._click; this._click = -1; }
      else if (G.input.pressed('confirm') || G.input.pressed('action')) choice = this.sel;
      if (choice === 0) { sfx('ui_ok'); return this._finish('resume'); }
      if (choice === 1) { sfx('ui_ok'); return this._finish('menu'); }
      return null;
    },

    draw(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(14,11,18,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 44px ' + FONT;
      ctx.fillStyle = PAL.cream;
      ctx.fillText(T('pause_title'), W / 2, 190);
      const keys = ['pause_resume', 'pause_menu'];
      this._rects = [];
      keys.forEach((k, i) => {
        const y = PAUSE_RECTS_Y[i];
        const r = { x: W / 2 - 170, y: y - 28, w: 340, h: 56, index: i };
        this._rects.push(r);
        const isSel = i === this.sel;
        if (isSel) {
          ctx.fillStyle = 'rgba(107,46,62,0.8)';
          roundRect(ctx, r.x, r.y, r.w, r.h, 10);
          ctx.fill();
        }
        ctx.font = (isSel ? 'bold ' : '') + '28px ' + FONT;
        ctx.fillStyle = isSel ? PAL.amberLight : PAL.cream;
        ctx.fillText((isSel ? '› ' : '') + T(k) + (isSel ? ' ‹' : ''), W / 2, y);
      });
      ctx.restore();
    }
  };
  G.ui.PauseOverlay = PauseOverlay;
})();

// ===== game.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG, T = CFG.TILE;
  const U = G.util;
  const t = (k, v) => (G.t ? G.t(k, v) : k);
  const sfx = (n, o) => { if (G.sfx) G.sfx.play(n, o); };

  function screenText(ctx, lines, y0, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = CFG.PAL.cream; ctx.textAlign = 'center';
    ctx.font = size + 'px Georgia, serif';
    lines.forEach((l, i) => ctx.fillText(l, CFG.VIEW_W / 2, y0 + i * size * 1.5));
    ctx.restore();
  }

  // ---------------- Story (opening) ----------------
  class StoryScene {
    constructor(onDone) { this.onDone = onDone; this.page = 0; this.tt = 0; }
    enter() { if (G.rhythm) G.rhythm.startMusic('menu'); }
    update(dt) {
      this.tt += dt;
      if (this.tt > 0.4 && (G.input.pressed('confirm') || G.input.pressed('action') || G.input.pressed('jump'))) {
        sfx('ui_ok'); this.page++; this.tt = 0;
        if (this.page >= 5) this.onDone();
      }
      if (G.input.pressed('back')) this.onDone();
    }
    draw(ctx) {
      const cam = { x: 0, y: 0 };
      if (G.art) G.art.drawBackground(ctx, cam, 'bedroom', G.time);
      const floorY = 430;
      ctx.fillStyle = CFG.PAL.woodDark; ctx.fillRect(0, floorY, CFG.VIEW_W, CFG.VIEW_H - floorY);
      if (G.art) {
        G.art.drawDeco(ctx, 230, floorY, { kind: 'bed_ivy', t: G.time });
        G.art.drawDeco(ctx, 650, floorY, { kind: 'perch', t: G.time });
        G.art.drawDeco(ctx, 480, floorY - 150, { kind: 'window', t: G.time });
        G.art.drawIvy(ctx, 560, floorY, { state: 'idle', facing: 1, t: G.time, speed: 0 });
        if (this.page < 5) G.art.drawBubble(ctx, 560, floorY - 58, t('story_' + (this.page + 1)), { who: 'ivy' });
        G.art.drawLight(ctx, 566, floorY - 40, G.time, 0.55);
      }
      screenText(ctx, [t('press_any')], 515, 14, 0.5 + 0.3 * Math.sin(G.time * 3));
    }
  }

  // ---------------- End of M1 ----------------
  class EndScene {
    constructor() { this.tt = 0; }
    enter() { sfx('win'); }
    update(dt) {
      this.tt += dt;
      if (this.tt > 1.5 && (G.input.pressed('confirm') || G.input.pressed('action') || G.input.pressed('back'))) G.scenes.set(G.ui.MenuScene);
    }
    draw(ctx) {
      // after the scroll: Ivy floats in the teleport vortex, on her way to the boarding school
      ctx.fillStyle = CFG.PAL.plumDeep; ctx.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);
      const cx = CFG.VIEW_W / 2, cy = 330;
      if (G.art) {
        if (G.art.drawVortex) G.art.drawVortex(ctx, cx, cy, { k: 1, t: G.time });
        G.art.drawIvy(ctx, cx, cy + 25 + Math.sin(G.time * 2) * 6, { state: 'fall', facing: 1, t: G.time, speed: 0 });
        G.art.drawCrow(ctx, cx + 300, 250 + Math.sin(G.time * 1.6) * 10, { t: G.time, heads: 2, scale: 1.1, flap: 1 });
      }
      const a = U.clamp(this.tt / 1.5, 0, 1);
      screenText(ctx, [t('m2_end_1')], 120, 22, a);
      screenText(ctx, [t('m2_end_2')], 175, 30, U.clamp((this.tt - 1.5) / 1.2, 0, 1));
      if (this.tt > 2.5) screenText(ctx, [t('m1_end_3')], 515, 14, 0.5 + 0.3 * Math.sin(G.time * 3));
    }
  }

  // ---------------- Play ----------------
  class PlayScene {
    constructor(index) { this.index = index; this.level = G.LEVELS[index]; }
    enter() {
      G.events.clear();
      const L = this.level;
      this.world = new G.World(L);
      const sp = this.world.entPos(L.start);
      this.player = new G.Player(this.world, sp.x, sp.y);
      this.stealth = new G.Stealth(this.world, this.player, L);
      this.traps = new G.Traps(this.world, this.player, L);
      this.ghosts = G.Ghosts ? new G.Ghosts(this.world, this.player, L) : null;
      const hasDungeon = (L.entities || []).some((e) => ['skeletons', 'rockfall', 'web', 'dark', 'torch', 'candles', 'door', 'scroll'].includes(e.type));
      this.dungeon = G.Dungeon && hasDungeon ? new G.Dungeon(this.world, this.player, L, this.ghosts) : null;
      if (this.dungeon) this.player.speedMul = () => (this.dungeon.speedMul ? this.dungeon.speedMul() : 1);
      this.hasScroll = (L.entities || []).some((e) => e.type === 'scroll');
      this.deco = (L.entities || []).filter((e) => e.type === 'deco').map((e) => {
        const p = this.world.entPos(e);
        if (e.kind === 'cobweb') { p.x = e.tx * T; p.y = e.ty * T; }
        return { kind: e.kind, x: p.x, y: p.y };
      });
      const ex = this.world.entPos(L.exit);
      this.door = { x: ex.x, y: ex.y, rect: { x: ex.x - T * 0.6, y: ex.y - T * 2.2, w: T * 1.2, h: T * 2.2 } };
      this.mode = 'intro'; this.tt = 0; this.levelT = 0; this.playStart = null; this.bubbles = []; this.toast = null; this.paused = null;
      this.elapsed = 0;
      this.player.control = false;
      G.events.on('caught', (d) => this.beginCaught(d));
      G.events.on('door_open', () => { this.toast = { text: t('door_open'), tt: 2.5 }; sfx('door'); });
      G.events.on('ghost_summoned', () => { const p = this.player; this.say(p.x, p.y - 56, t('ivy_wrong_candles'), 'ivy', 3); this.bubbles[0].follow = true; });
      G.events.on('checkpoint', (d) => { this.toast = { text: t('checkpoint'), tt: 2 }; this.trail = [{ x: d.x, y: d.y, st: 'idle' }]; });
      this.trail = [{ x: sp.x, y: sp.y, st: 'idle' }];
      G.camera.x = U.clamp(sp.x - CFG.VIEW_W / 2, 0, Math.max(0, this.world.wpx - CFG.VIEW_W));
      G.camera.y = U.clamp(sp.y - CFG.VIEW_H * 0.6, 0, Math.max(0, this.world.hpx - CFG.VIEW_H));
      if (G.rhythm) G.rhythm.startMusic('castle');
      window.__game = this;
    }
    say(x, y, text, who, dur) { this.bubbles = [{ x, y, text, who, tt: dur || 2.5 }]; }

    // Caught sequence: npc line -> Ivy falls flat -> spider descends -> drags her to the checkpoint
    // -> spider climbs away while Ivy gets up, bored -> one deadpan line, play resumes.
    beginCaught(d) {
      if (this.mode !== 'play') return;
      this.caughtCount = (this.caughtCount || 0) + 1;
      this.mode = 'caught'; this.tt = 0;
      this.stealth.paused = true; this.traps.paused = d.by !== 'trap'; if (this.ghosts) this.ghosts.paused = true; if (this.dungeon) this.dungeon.paused = true;
      const p = this.player;
      p.control = false;
      sfx('caught');
      const isTrap = d.by === 'trap';
      if (!isTrap) {
        sfx('wake'); setTimeout(() => sfx('door'), 450); setTimeout(() => sfx('slippers'), 800);
        this.say(d.x, d.y - 70, t('caught_' + (d.by === 'walker' ? (d.who || 'butler') : d.who)), 'npc', CFG.CAUGHT_FREEZE);
      } else this.bubbles = [];
      const cp = this.stealth.checkpoint;
      const dir = cp.x >= p.x ? 1 : -1;
      const dist = Math.abs(cp.x - p.x) + Math.abs(cp.y - p.y);
      // trap = "death": lie down, spider drags her back. Spotted = just run back to the hiding spot.
      this.cs = {
        kind: isTrap ? 'death' : 'run',
        line: isTrap ? t('caught_trap_' + d.kind) : t('ivy_caught_' + U.randInt(1, 8)),
        t1: isTrap ? 0.35 : CFG.CAUGHT_FREEZE,            // end of npc phase
        from: { x: p.x, y: p.y }, cp: { x: cp.x, y: cp.y }, dir,
      };
      this.buildPath(this.cs, p, cp);
      this.cs.drag = U.clamp(this.cs.len / CFG.DRAG_SPEED, 1.2, CFG.DRAG_MAX);
      this.cs.run = U.clamp(this.cs.len / CFG.RUN_BACK_SPEED, 1.2, 8);
      const c = this.cs;
      c.trap = d.kind;
      if (c.kind === 'run') { c.t4 = c.t1 + c.run; c.t5 = c.t4; }
      else { c.landed = false; c.t1 = Infinity; } // death: first drop to the ground, then the death effect, then lie down
      c.ivy = { x: p.x, y: p.y, state: 'frozen', k: 0, drag: false, facing: p.facing };
      c.spider = null;
    }

    updateCaught(dt) {
      this.tt += dt;
      const p = this.player, c = this.cs, tt = this.tt, ivy = c.ivy;
      const headX = () => ivy.x + c.dir * 24;
      if (!this.traps.paused) { // after a trap death the trap finishes its move, then switches off
        if (tt < CFG.TRAP_OFF_DELAY) this.traps.update(dt); else this.traps.paused = true;
      }
      if (c.kind === 'death' && !c.landed) { // killed in mid-air: fall until she lands on something
        p.update(dt); ivy.x = p.x; ivy.y = p.y; ivy.state = p.onGround ? 'frozen' : 'fall'; ivy.facing = p.facing;
        if (p.onGround || tt > 2 || p.y > this.world.hpx) {
          c.landed = true; p.vx = 0; p.vy = 0;
          const cp = this.stealth.checkpoint;
          this.buildPath(c, p, cp);
          c.drag = U.clamp(c.len / CFG.DRAG_SPEED, 1.2, CFG.DRAG_MAX);
          c.fx0 = tt;
          c.t1 = tt + CFG.DEATH_FX_T;             // death effect (shock, green gas, bonk...)
          c.t2 = c.t1 + CFG.CAUGHT_FALL;          // lies down
          c.t3 = c.t2 + CFG.SPIDER_DESCEND;       // spider arrived
          c.t4 = c.t3 + c.drag;                   // dragged to checkpoint
          c.t5 = c.t4 + CFG.GETUP_TIME;           // up again
          if (c.trap === 'spark') sfx('spark'); else if (c.trap === 'flask') sfx('flask'); else sfx('land');
        }
        return;
      }
      if (tt < c.t1) { ivy.state = 'frozen'; p.state = 'frozen'; return; }
      if (c.kind === 'run' && tt < c.t4) { // comic dash back to the hiding spot
        if (!c.dragStarted) { c.dragStarted = true; sfx('whoosh'); this.toast = { text: t('run_back'), tt: c.run }; }
        const k = (tt - c.t1) / c.run, e = k * k * (3 - 2 * k);
        const q = this.samplePath(c, e * c.len);
        const air = q.st === 'jump' || q.st === 'fall', climb = q.st === 'climb';
        ivy.x = q.x; ivy.y = q.y - (air || climb || q.st === 'sneak' ? 0 : Math.abs(Math.sin(tt * 9)) * 6);
        ivy.state = climb ? 'climb' : q.st === 'sneak' ? 'sneak' : q.st === 'jump' ? 'fall' : q.st === 'fall' ? 'jump' : 'walk';
        if (q.dir) ivy.facing = q.dir;
        p.setPos(ivy.x, ivy.y); p.facing = ivy.facing; p.state = ivy.state;
        if (p.t !== undefined) p.t += dt * 2.5;
        return;
      }
      if (tt < c.t2) {
        if (ivy.state !== 'down') { sfx('land'); ivy.state = 'down'; ivy.facing = -c.dir; }
        return;
      }
      if (tt < c.t3) { // spider descends on its thread from above the screen to Ivy's head
        const k = U.easeOutCubic((tt - c.t2) / (c.t3 - c.t2));
        const top = G.camera.y - 20;
        c.spider = { x: headX() + c.dir * 10, y: U.lerp(top, ivy.y - 10, k), mode: 'hang', anchorY: top };
        return;
      }
      if (tt < c.t4) { // drag along the floor
        if (!c.dragStarted) { c.dragStarted = true; sfx('whoosh', { vol: 0.5 }); this.toast = { text: t('run_back'), tt: c.drag }; }
        const k = (tt - c.t3) / (c.t4 - c.t3);
        const e = k * k * (3 - 2 * k);
        const q = this.samplePath(c, e * c.len);
        ivy.x = q.x; ivy.y = q.y;
        if (q.dir) { c.dir = q.dir; ivy.facing = -q.dir; }
        ivy.drag = true;
        c.spider = { x: headX() + c.dir * 30, y: ivy.y - 7, mode: 'pull', anchorY: null };
        p.setPos(ivy.x, ivy.y);
        return;
      }
      if (!c.arrived) {
        c.arrived = true; ivy.drag = false; ivy.x = c.cp.x; ivy.y = c.cp.y; p.setPos(c.cp.x, c.cp.y);
        this.stealth.resetAlerts(); if (this.traps.reset) this.traps.reset(); if (this.ghosts && this.ghosts.reset) this.ghosts.reset(); if (this.dungeon && this.dungeon.reset) this.dungeon.reset();
        sfx('checkpoint', { vol: 0.5 });
      }
      if (c.kind === 'death' && tt < c.t5) { // spider climbs up and away, Ivy gets up slowly
        const k = (tt - c.t4) / (c.t5 - c.t4);
        ivy.state = 'getup'; ivy.k = U.clamp(k * 1.15, 0, 1);
        const top = G.camera.y - 30;
        c.spider = { x: headX() + c.dir * 18, y: U.lerp(ivy.y - 8, top, U.easeOutCubic(k)), mode: 'hang', anchorY: top, climbing: true };
        return;
      }
      // done
      c.spider = null;
      p.facing = ivy.facing || p.facing;
      p.state = 'idle'; p.control = true; p.vx = 0; p.crouched = false; G.input.reset();
      this.stealth.paused = false; this.traps.paused = false; if (this.ghosts) this.ghosts.paused = false; if (this.dungeon) this.dungeon.paused = false;
      this.mode = 'play';
      this.say(p.x, p.y - 56, c.line, 'ivy', 2.6);
      this.cs = null;
    }

    // first ghost in sight: Ivy reminds the player that ghosts can't see her while she stands still
    ghostTip(p) {
      if (G.game._ghostTipDone || this.mode !== 'play' || !this.ghosts || !this.ghosts.ghosts) return;
      if (this.ghosts.ghosts.some((g) => Math.abs(g.x - p.x) < ((g.view || 6) + 4) * T && Math.abs(g.y - p.y) < 3 * T)) {
        G.game._ghostTipDone = true;
        this.say(p.x, p.y - 56, t('ivy_ghost_tip'), 'ivy', 4.5); this.bubbles[0].follow = true;
      }
    }

    // path back to the checkpoint = breadcrumb trail reversed (falls back to a straight line)
    buildPath(c, p, cp) {
      const raw = [{ x: p.x, y: p.y, st: 'walk' }].concat(this.trail.slice().reverse());
      // remove loops: whenever the route passes a spot it also passes later (closer to the checkpoint), skip ahead
      const CELL = 18, key = (q) => Math.floor(q.x / CELL) + ',' + Math.floor(q.y / CELL), lastIdx = new Map();
      raw.forEach((q, i) => lastIdx.set(key(q), i));
      const pts = []; let i = 0;
      while (i < raw.length) {
        pts.push(raw[i]);
        const cx = Math.floor(raw[i].x / CELL), cy = Math.floor(raw[i].y / CELL);
        let j = i;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const v = lastIdx.get((cx + dx) + ',' + (cy + dy)); if (v > j) j = v; }
        i = j > i ? j : i + 1;
      }
      const last = pts[pts.length - 1];
      if (Math.abs(last.x - cp.x) + Math.abs(last.y - cp.y) > 8) pts.push({ x: cp.x, y: cp.y, st: 'walk' });
      if (c.kind === 'death') { // the spider drags her along the floor: ignore jump arcs
        const air = (q) => q.st === 'jump' || q.st === 'fall';
        for (let a = 0; a < pts.length; a++) {
          if (!air(pts[a])) continue;
          let b = a; while (b < pts.length && air(pts[b])) b++;
          const y0 = a > 0 ? pts[a - 1].y : pts[a].y, y1 = b < pts.length ? pts[b].y : y0;
          const x0 = a > 0 ? pts[a - 1].x : pts[a].x, x1 = b < pts.length ? pts[b].x : x0;
          for (let k = a; k < b; k++) {
            const f = Math.abs(x1 - x0) > 1 ? (pts[k].x - x0) / (x1 - x0) : (k - a + 1) / (b - a + 1);
            pts[k] = { x: pts[k].x, y: U.lerp(y0, y1, U.clamp(f, 0, 1)), st: 'walk' };
          }
          a = b;
        }
      }
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
      c.path = pts; c.cum = cum; c.len = Math.max(1, cum[cum.length - 1]); c.seg = 1;
    }
    samplePath(c, s) {
      const P = c.path, C = c.cum;
      while (c.seg < P.length - 1 && C[c.seg] < s) c.seg++;
      const i = c.seg, a = P[i - 1], b = P[i];
      const k = C[i] > C[i - 1] ? U.clamp((s - C[i - 1]) / (C[i] - C[i - 1]), 0, 1) : 1;
      // look a little ahead for a stable facing
      let dir = 0;
      for (let j = i; j < Math.min(P.length, i + 6); j++) { const dx = P[j].x - P[i - 1].x; if (Math.abs(dx) > 2) { dir = Math.sign(dx); break; } }
      return { x: U.lerp(a.x, b.x, k), y: U.lerp(a.y, b.y, k), st: b.st, dir };
    }

    drawCreakMarks(ctx, cam) { // make creaky boards readable: lighter warped planks + little creak lines
      const w = this.world;
      if (!this._creaks) {
        this._creaks = [];
        for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) if (w.isCreaky(x, y)) this._creaks.push([x, y]);
      }
      ctx.save();
      for (const [x, y] of this._creaks) {
        const px = x * T, py = y * T;
        if (px < cam.x - T || px > cam.x + CFG.VIEW_W) continue;
        ctx.fillStyle = 'rgba(247,200,115,0.32)'; ctx.fillRect(px + 1, py, T - 2, 9);
        ctx.strokeStyle = 'rgba(247,200,115,0.95)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        const wob = Math.sin(G.time * 3 + x) * 1.5;
        ctx.beginPath();
        ctx.moveTo(px + 6, py - 4 + wob); ctx.lineTo(px + 11, py - 12 + wob);
        ctx.moveTo(px + 18, py - 5 - wob); ctx.lineTo(px + 18, py - 14 - wob);
        ctx.moveTo(px + 30, py - 4 + wob); ctx.lineTo(px + 25, py - 12 + wob);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Ivy during a death, with a little effect per trap: shock (shake + lightning), gas (turns green), bonk/bite (dizzy stars)
    drawDeathIvy(ctx, c, ivy, opts) {
      const A = G.art, tt = this.tt;
      const fxK = c.fx0 == null ? 0 : U.clamp((tt - c.fx0) / CFG.DEATH_FX_T, 0, 1); // 0..1 during the effect
      const inFx = c.landed && tt < c.t1;
      let x = ivy.x, y = ivy.y;
      if (inFx && (c.trap === 'spark' || c.trap === 'plant')) { x += (Math.random() - 0.5) * 5; y += (Math.random() - 0.5) * 2; }
      // green tint for gas: grows during the effect, slowly fades while she is carried back
      let green = 0;
      if (c.trap === 'flask') green = !c.landed ? 0.2 : tt < c.t1 ? 0.2 + 0.4 * fxK : U.clamp(0.6 - (tt - c.t1) * 0.12, 0, 0.6);
      let flash = inFx && c.trap === 'spark' ? (Math.sin(tt * 40) > 0.3 ? 0.42 : 0.1) : 0;
      if (green > 0.01 || flash > 0.01) {
        const o = this._fxCanvas || (this._fxCanvas = document.createElement('canvas'));
        o.width = 160; o.height = 140;
        const oc = o.getContext('2d');
        oc.clearRect(0, 0, 160, 140);
        A.drawIvy(oc, 80, 120, opts);
        oc.globalCompositeOperation = 'source-atop';
        if (green > 0) { oc.fillStyle = 'rgba(120,210,70,' + green.toFixed(2) + ')'; oc.fillRect(0, 0, 160, 140); }
        if (flash > 0) { oc.fillStyle = 'rgba(200,235,255,' + flash.toFixed(2) + ')'; oc.fillRect(0, 0, 160, 140); }
        oc.globalCompositeOperation = 'source-over';
        ctx.drawImage(o, x - 80, y - 120);
      } else A.drawIvy(ctx, x, y, opts);
      if (!inFx) return;
      const top = y - 50;
      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (c.trap === 'spark') { // lightning zig-zags crawling over her
        for (let k = 0; k < 3; k++) {
          let px = x + U.rand(-16, 16), py = top + U.rand(-6, 6);
          ctx.beginPath(); ctx.moveTo(px, py);
          for (let i = 0; i < 5; i++) { px += U.rand(-10, 10); py += U.rand(6, 12); ctx.lineTo(px, py); }
          ctx.strokeStyle = 'rgba(150,215,255,0.9)'; ctx.lineWidth = 3.2; ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
        }
      } else if (c.trap === 'flask') { // green bubbles drifting up
        for (let k = 0; k < 6; k++) {
          const ph = (tt * 0.9 + k / 6) % 1;
          ctx.globalAlpha = 1 - ph;
          ctx.fillStyle = '#9bd35a';
          ctx.beginPath(); ctx.arc(x + Math.sin(k * 2.3 + tt * 3) * 14, top + 10 - ph * 40, 2.5 + (k % 3), 0, Math.PI * 2); ctx.fill();
        }
      } else { // chandelier bonk / plant bite: dizzy stars around her head
        for (let k = 0; k < 3; k++) {
          const a = tt * 5 + (k * Math.PI * 2) / 3;
          const sx = x + Math.cos(a) * 16, sy = top - 4 + Math.sin(a) * 5;
          ctx.fillStyle = '#f7c873';
          ctx.beginPath();
          for (let i = 0; i < 10; i++) { const r = i % 2 ? 2.2 : 5, b = (i * Math.PI) / 5 - Math.PI / 2; ctx.lineTo(sx + Math.cos(b) * r, sy + Math.sin(b) * r); }
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.restore();
    }

    drawCaught(ctx) {
      const c = this.cs; if (!c) return false;
      const ivy = c.ivy, A = G.art;
      if (c.kind === 'run') return false; // normal player draw
      const opts = { state: ivy.state, facing: ivy.facing, t: G.time, speed: 0, k: ivy.k, drag: ivy.drag };
      this.drawDeathIvy(ctx, c, ivy, opts);
      const s = c.spider;
      if (s && A.drawSpider) {
        if (s.mode === 'pull') A.drawThread(ctx, s.x, s.y, ivy.x + c.dir * 24, ivy.y - 6, { t: G.time, taut: true });
        else if (s.anchorY != null) A.drawThread(ctx, s.x, s.anchorY, s.x, s.y - 6, { t: G.time, taut: true });
        A.drawSpider(ctx, s.x, s.y, { t: G.time, mode: s.mode, facing: c.dir, scale: 1.7 });
      }
      return true;
    }


    update(dt) {
      if (this.paused) {
        const r = this.paused.update(dt);
        if (r === 'resume') this.paused = null;
        else if (r === 'menu') { this.paused = null; G.scenes.set(G.ui.MenuScene); }
        return;
      }
      if (G.input.pressed('pause') && this.mode === 'play' && G.ui.PauseOverlay) {
        this.paused = (typeof G.ui.PauseOverlay === 'function') ? new G.ui.PauseOverlay() : G.ui.PauseOverlay;
        if (this.paused.enter) this.paused.enter();
        if (this.paused.reset) this.paused.reset();
        return;
      }
      this.tt += dt; this.levelT += dt;
      const p = this.player;
      this.bubbles.forEach((b) => { if (b.follow) { b.x = p.x; b.y = p.y - 56; } });
      this.ghostTip(p);
      if (this.playStart != null && !this._introSaid && this.levelT > this.playStart + 0.45) { // Ivy's opening line, after the title card
        this._introSaid = true;
        this.say(p.x, p.y - 56, t(this.level.introKey), 'ivy', 5); this.bubbles[0].follow = true;
      }
      if (this.mode === 'intro') {
        p.update(dt);
        if (this.tt > 2.2 || (this.tt > 0.6 && G.input.anyPressed())) { this.mode = 'play'; p.control = true; this.playStart = this.levelT; }
      } else if (this.mode === 'play') {
        this.elapsed += dt;
        p.update(dt);
        if (p.state !== 'hidden') { // breadcrumb trail since the last hiding spot: run-backs retrace it
          const last = this.trail[this.trail.length - 1];
          if (Math.abs(last.x - p.x) + Math.abs(last.y - p.y) > 5) { this.trail.push({ x: p.x, y: p.y, st: p.onLadder ? 'climb' : (p.crouched ? 'sneak' : p.state) }); if (this.trail.length > 6000) this.trail.splice(1, 1000); }
        }
        this.stealth.update(dt);
        this.traps.update(dt);
        if (this.ghosts) this.ghosts.update(dt);
        if (this.dungeon) {
          this.dungeon.update(dt);
          if (this.dungeon.scrollReached && this.mode === 'play') { this.mode = 'scroll'; this.tt = 0; p.control = false; sfx('win'); }
        }
        if (p.y > this.world.hpx + 200) this.beginCaught({ by: 'trap', kind: 'chandelier', x: p.x, y: p.y });
        if (!this.hasScroll && this.mode === 'play' && p.state !== 'hidden' && U.overlap(p.rect(), this.door.rect)) {
          this.mode = 'done'; this.tt = 0; p.control = false; sfx('win');
          G.save.set('progress', Math.max(G.save.get('progress', 0), Math.min(this.index + 1, G.LEVELS.length - 1)));
        }
      } else if (this.mode === 'caught') {
        this.updateCaught(dt);
      } else if (this.mode === 'scroll') { // Ivy unrolls the scroll, a vortex swallows her
        p.update(dt);
        if (this.tt > 0.2 && !this._scrollSaid) { this._scrollSaid = true; this.say(p.x, p.y - 56, t('scroll_read'), 'ivy', 2.6); this.bubbles[0].follow = true; }
        if (this.tt > 2.6 && !this._whoosh) { this._whoosh = true; sfx('whoosh'); }
        if (this.tt > 5.2) {
          G.save.set('progress', Math.max(G.save.get('progress', 0), this.index));
          G.scenes.set(new EndScene());
        }
      } else if (this.mode === 'done') {
        p.update(dt);
        if (this.tt > 2.0) G.game.nextLevel(this.index);
      }
      this.stealthTick = (this.stealthTick || 0) + dt;
      this.bubbles.forEach((b) => (b.tt -= dt)); this.bubbles = this.bubbles.filter((b) => b.tt > 0);
      if (this.toast) { this.toast.tt -= dt; if (this.toast.tt <= 0) this.toast = null; }
      this.updateCamera(dt);
    }

    updateCamera(dt) {
      const p = this.player, cam = G.camera;
      const tx = U.clamp(p.x - CFG.VIEW_W / 2 + p.facing * 60, 0, Math.max(0, this.world.wpx - CFG.VIEW_W));
      const ty = U.clamp(p.y - CFG.VIEW_H * 0.62, 0, Math.max(0, this.world.hpx - CFG.VIEW_H));
      const k = this.mode === 'caught' ? 6 : 5;
      cam.x += (tx - cam.x) * Math.min(1, k * dt);
      cam.y += (ty - cam.y) * Math.min(1, k * dt);
    }

    hint() {
      const p = this.player;
      if (this.mode !== 'play') return '';
      if (p.state === 'hidden') return t('hint_unhide');
      if (this.stealth.nearestHide()) return t('hint_hide');
      if (this.dungeon && this.dungeon.nearestAction) { const k = this.dungeon.nearestAction(); if (k) return t(k); }
      if (this.dungeon) {
        const D = this.dungeon;
        if (D.webs.some((w) => !w.torn && p.x > w.x - 3 * T && p.x < w.x + (w.len + 1) * T && Math.abs(p.y - w.y) < T)) return t('hint_web');
        if (D.skeletons.some((s) => Math.abs((s.c != null ? s.c : s.a.x) - p.x) < 5 * T && Math.abs(s.y - p.y) < T)) return t('hint_skeleton');
      }
      if (U.dist(p.x, p.y, this.door.x, this.door.y) < T * 3) return t('hint_exit');
      const w = this.world, fy = w.toTile(p.y + 1);
      for (let k = 0; k <= 3; k++) if (w.isCreaky(w.toTile(p.x + p.facing * k * T), fy)) return t('hint_creak');
      if (this.ghosts && this.ghosts.ghosts && !p.faded && this.ghosts.ghosts.some((g) => Math.abs(g.x - p.x) < ((g.view || 6) + 2) * T && Math.abs(g.y - p.y) < 2 * T && (p.x - g.x) * g.facing > 0)) return t('hint_ghost');
      if (!p.crouched && this.traps.traps && this.traps.traps.some((tr) => tr.kind === 'chandelier' && (tr.x - p.x) * p.facing > -T && Math.abs(tr.x - p.x) < 5 * T && tr.y < p.y)) return t('hint_chandelier');
      if (!p.crouched && this.stealth.sleepers.some((s) => U.dist(p.x, p.y, s.x, s.y) < s.radius * 1.5)) return t('hint_sleeper');
      if (this.index === 0 && this.elapsed < 7) return t('hint_sneak');
      return '';
    }

    draw(ctx) {
      const cam = { x: Math.round(G.camera.x), y: Math.round(G.camera.y) };
      const theme = this.level.theme;
      G.art.drawBackground(ctx, cam, theme, G.time);
      ctx.save();
      ctx.translate(-cam.x, -cam.y);
      G.art.drawTiles(ctx, this.world, cam, theme);
      this.drawCreakMarks(ctx, cam);
      this.deco.forEach((d) => {
        if (d.x < cam.x - 300 || d.x > cam.x + CFG.VIEW_W + 300) return;
        G.art.drawDeco(ctx, d.x, d.y, { kind: d.kind, t: G.time });
      });
      G.art.drawDeco(ctx, this.door.x, this.door.y, { kind: 'stairs_down', t: G.time });
      this.traps.draw(ctx);
      this.stealth.draw(ctx);
      if (this.dungeon) this.dungeon.draw(ctx);
      if (this.ghosts) this.ghosts.draw(ctx);
      if (!(this.mode === 'caught' && this.drawCaught(ctx)) && this.player.state !== 'hidden') this.player.draw(ctx);
      ctx.restore();
      const p = this.player;
      let strength = { bedroom: 0.72, greenhouse: 0.6, lab: 0.68, hall: 0.7, crypt: 0.76 }[theme] ?? 0.7;
      if (this.dungeon && this.dungeon.lightStrength) strength = this.dungeon.lightStrength(strength);
      G.art.drawLight(ctx, p.x - cam.x, p.y - 40 - cam.y, G.time, p.state === 'hidden' ? strength + 0.1 : strength);
      // bubbles above the light
      ctx.save(); ctx.translate(-cam.x, -cam.y);
      this.bubbles.forEach((b) => G.art.drawBubble(ctx, b.x, b.y, b.text, { who: b.who }));
      ctx.restore();
      if (this.mode === 'scroll' && G.art.drawVortex) {
        const k = U.clamp((this.tt - 1.2) / 3, 0, 1);
        ctx.save(); ctx.translate(-cam.x, -cam.y); G.art.drawVortex(ctx, p.x, p.y - 30, { k, t: G.time }); ctx.restore();
        const wf = U.clamp((this.tt - 3.8) / 1.2, 0, 1);
        if (wf > 0) { ctx.fillStyle = 'rgba(245,238,225,' + wf.toFixed(2) + ')'; ctx.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H); }
      }
      G.ui.drawHUD(ctx, { alert: this.stealth.maxAlert(), hint: this.hint(), levelName: t(this.level.nameKey) });
      if (this.toast) screenText(ctx, [this.toast.text], 90, 18, U.clamp(this.toast.tt * 2, 0, 1));
      const cardEnd = this.playStart == null ? 99 : this.playStart + 0.4; // the title card fades once play starts
      if ((this.mode === 'intro' || this.mode === 'play') && this.levelT < cardEnd) {
        const a = Math.min(U.clamp(this.levelT * 3, 0, 1), this.playStart == null ? 1 : U.clamp((cardEnd - this.levelT) / 0.4, 0, 1));
        if (a > 0) G.art.drawCard(ctx, t(this.level.nameKey), '', a);
      }
      if (this.mode === 'done') G.art.drawCard(ctx, t('level_done'), t(this.level.nameKey), U.clamp(this.tt * 2, 0, 1));
      if (this.paused) this.paused.draw(ctx);
    }
  }

  G.game = {
    PlayScene, StoryScene, EndScene,
    start(i, opts) {
      i = U.clamp(i | 0, 0, G.LEVELS.length - 1);
      const go = () => G.scenes.set(new PlayScene(i));
      if (i === 0 && !(opts && opts.skipStory)) G.scenes.set(new StoryScene(go));
      else go();
    },
    nextLevel(i) {
      if (i + 1 < G.LEVELS.length) G.scenes.set(new PlayScene(i + 1));
      else G.scenes.set(new EndScene());
    },
  };
})();

// ===== main.js =====
(function () {
  const G = window.G;
  function boot() {
    G.initCanvas();
    const q = new URLSearchParams(location.search);
    if (q.has('level')) G.game.start(parseInt(q.get('level'), 10) || 0, { skipStory: true });
    else G.scenes.set(G.ui.MenuScene);
    G.startLoop();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script></body></html>
