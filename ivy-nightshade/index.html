window.G = window.G || {};
window.G.CFG = {
  VIEW_W: 960, VIEW_H: 540, TILE: 36,

  WALK_SPEED: 170, SNEAK_SPEED: 70, CLIMB_SPEED: 110,

  // alert

    stone: '#4a4256', stoneDark: '#352f40', stoneLight: '#5d5469', wood: '#5a3b2e', woodDark: '#3f281f', woodLight: '#7a5240',
    green: '#5e7d4a', greenDark: '#3b5230', poison: '#9bd35a', cream: '#efe6d0', red: '#a3203a'
  }

// ===== core.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;

  // ---------- util ----------
  G.util = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
    overlap: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
    dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
    easeOutCubic: (t) => 1 - Math.pow(1 - t, 3),
  };

  // ---------- events ----------
  const handlers = {};
  G.events = {
    on(n, fn) { (handlers[n] = handlers[n] || []).push(fn); },
    off(n, fn) { if (handlers[n]) handlers[n] = handlers[n].filter((f) => f !== fn); },
    emit(n, d) { (handlers[n] || []).slice().forEach((fn) => { try { fn(d); } catch (e) { console.error(e); } }); },
    clear() { for (const k in handlers) delete handlers[k]; },
  };

  // ---------- save ----------
  G.save = {
    get(k, def) { try { const v = localStorage.getItem('ivy_' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem('ivy_' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- input ----------
  const KEYMAP = {
    ArrowLeft: ['left'], KeyA: ['left'], ArrowRight: ['right'], KeyD: ['right'],
    ArrowUp: ['up', 'jump'], KeyW: ['up', 'jump'], ArrowDown: ['down'], KeyS: ['down'],
    Space: ['jump', 'confirm'], ShiftLeft: ['sneak'], ShiftRight: ['sneak'],
    KeyE: ['action'], Enter: ['action', 'confirm'], NumpadEnter: ['action', 'confirm'],
    Escape: ['pause', 'back'], KeyP: ['pause'], Backspace: ['back'],
  };
  const held = {}, prevHeld = {}, keyCount = {};
  let anyPress = false, anyPressFrame = false;
  const virtual = {}; // mobile buttons set virtual[action] = true/false
  function setKey(code, on) {
    const acts = KEYMAP[code]; if (!acts) return false;
    acts.forEach((a) => { keyCount[a] = (keyCount[a] || 0) + (on ? 1 : -1); if (keyCount[a] < 0) keyCount[a] = 0; });
    return true;
  }
  const physical = {};
  window.addEventListener('keydown', (e) => {
    if (e.repeat) { if (KEYMAP[e.code]) e.preventDefault(); return; }
    if (!physical[e.code]) { physical[e.code] = true; if (setKey(e.code, true)) e.preventDefault(); }
    anyPress = true;
    if (G.rhythm && G.rhythm.unlock) G.rhythm.unlock();
  });
  window.addEventListener('keyup', (e) => { if (physical[e.code]) { physical[e.code] = false; setKey(e.code, false); } });
  function resetKeys() { for (const k in physical) physical[k] = false; for (const a in keyCount) keyCount[a] = 0; }
  window.addEventListener('blur', resetKeys);
  document.addEventListener('visibilitychange', () => { if (document.hidden) resetKeys(); });
  window.addEventListener('pagehide', resetKeys);
  ['pointerdown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => { anyPress = true; if (G.rhythm && G.rhythm.unlock) G.rhythm.unlock(); }, { passive: true }));

  const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'sneak', 'action', 'pause', 'confirm', 'back'];
  G.input = {
    virtual,
    down: (a) => !!held[a],
    pressed: (a) => !!held[a] && !prevHeld[a],
    released: (a) => !held[a] && !!prevHeld[a],
    anyPressed: () => anyPressFrame,
    // forget every held key (a lost keyup can never leave Ivy walking on her own); a key still held must be pressed again
    reset() { resetKeys(); for (const a of ACTIONS) { held[a] = false; prevHeld[a] = false; } },
    _tick() { // called once per fixed update, before scene update
      ACTIONS.forEach((a) => { prevHeld[a] = held[a]; held[a] = (keyCount[a] || 0) > 0 || !!virtual[a]; });
      anyPressFrame = anyPress; anyPress = false;
    },
  };

  // ---------- world ----------
  class World {
    constructor(level) {
      this.level = level;
      this.grid = level.grid.map((r) => r.replace(/\./g, ' '));
      this.rows = this.grid.length;
      this.cols = Math.max(...this.grid.map((r) => r.length));
      this.wpx = this.cols * CFG.TILE; this.hpx = this.rows * CFG.TILE;
      this.creak = new Set();
      (level.entities || []).forEach((e) => {
        if (e.type === 'creak') for (let i = 0; i < (e.len || 1); i++) this.creak.add((e.tx + i) + ',' + e.ty);
      });
    }
    tile(tx, ty) {
      if (tx < 0 || ty < 0 || tx >= this.cols || ty >= this.rows) return '#';
      return this.grid[ty][tx] || ' ';
    }
    isSolid(tx, ty) { const c = this.tile(tx, ty); return c === '#' || c === '=' || c === '~' || (this.extraSolid ? !!this.extraSolid(tx, ty) : false); }
    isOneWay(tx, ty) { return this.tile(tx, ty) === '-'; }
    isLadder(tx, ty) { return this.tile(tx, ty) === 'H'; }
    isCreaky(tx, ty) { return this.tile(tx, ty) === '~' || this.creak.has(tx + ',' + ty); }
    toTile(px) { return Math.floor(px / CFG.TILE); }
    entPos(e) { return { x: (e.tx + 0.5) * CFG.TILE, y: (e.ty + 1) * CFG.TILE }; }
  }
  G.World = World;

  // ---------- scenes ----------
  G.scenes = {
    current: null,
    set(s) { if (this.current && typeof this.current.exit === 'function') this.current.exit(); this.current = s; if (s && s.enter) s.enter(); },
  };
  G.camera = { x: 0, y: 0 };
  G.time = 0; G.dt = 1 / 60;

  // ---------- canvas & loop ----------
  G.initCanvas = function () {
    const c = document.getElementById('game');
    G.canvas = c; G.ctx = c.getContext('2d');
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const s = Math.min(window.innerWidth / CFG.VIEW_W, window.innerHeight / CFG.VIEW_H);
      c.style.width = Math.floor(CFG.VIEW_W * s) + 'px';
      c.style.height = Math.floor(CFG.VIEW_H * s) + 'px';
      c.width = Math.floor(CFG.VIEW_W * s * dpr); c.height = Math.floor(CFG.VIEW_H * s * dpr);
      G.scale = (c.width / CFG.VIEW_W);
    }
    window.addEventListener('resize', resize); resize();
  };
  G.startLoop = function () {
    let last = performance.now(), acc = 0;
    function frame(now) {
      acc += Math.min(0.1, (now - last) / 1000); last = now;
      while (acc >= G.dt) {
        G.input._tick();
        G.time += G.dt;
        if (G.scenes.current) G.scenes.current.update(G.dt);
        acc -= G.dt;
      }
      const ctx = G.ctx;
      ctx.setTransform(G.scale, 0, 0, G.scale, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);
      if (G.scenes.current) { ctx.save(); G.scenes.current.draw(ctx); ctx.restore(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
})();

// ===== rhythm.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;

  const BPM = CFG.BPM || 108;
  const SPB = 60 / BPM;            // seconds per beat
  const LOOKAHEAD = 0.1;           // schedule this far ahead (s)
  const TICK_MS = 25;

  // ---------- state ----------
  let ctx = null;
  let master = null, comp = null, musicGain = null, songBus = null, sfxBus = null, echoIn = null, noiseBuf = null;
  let audioSync = false;           // clock currently driven by AudioContext
  let aOff = 0;                    // ctx.currentTime - clockSeconds
  const pT0 = { v: performance.now() }; // perf clock origin (ms): clockSeconds = (now - v)/1000
  let musicEnabled = !!G.save.get('music', true);
  let wantedSong = null;           // requested song name (or null)
  let playingSong = null;          // song actually being scheduled
  let timer = null;
  let nextN = 0;                   // next absolute beat index to schedule
  const debug = { notes: 0, beats: 0, sfx: 0, sfxErrors: 0, sfxNoop: 0 };

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ---------- clock ----------
  function perfClock() { return (performance.now() - pT0.v) / 1000; }
  function syncClock() {
    if (!ctx) return;
    const running = ctx.state === 'running';
    if (running && !audioSync) {
      aOff = ctx.currentTime - perfClock();   // seamless: clock value unchanged at switch
      audioSync = true;
    } else if (!running && audioSync) {
      const last = ctx.currentTime - aOff;    // freeze-continuity: perf clock continues from here
      pT0.v = performance.now() - last * 1000;

    }
  }
  function clockSec() {
    syncClock();

  }
  function beat() { return clockSec() / SPB; }

  // ---------- audio graph ----------
  function buildGraph() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 8;
    comp.attack.value = 0.004; comp.release.value = 0.2;

    limiter.threshold.value = -4; limiter.knee.value = 0; limiter.ratio.value = 20;
    limiter.attack.value = 0.001; limiter.release.value = 0.08;
    master.connect(comp); comp.connect(limiter); limiter.connect(ctx.destination);

    musicGain = ctx.createGain(); musicGain.gain.value = musicEnabled ? CFG.MUSIC_VOL : 0;
    songBus = ctx.createGain(); songBus.gain.value = 1;
    songBus.connect(musicGain); musicGain.connect(master);

    sfxBus = ctx.createGain(); sfxBus.gain.value = CFG.SFX_VOL;
    sfxBus.connect(master);

    const delay = ctx.createDelay(1.5); delay.delayTime.value = SPB * 1.5;

    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const wet = ctx.createGain(); wet.gain.value = 0.5;

    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    ctx.onstatechange = syncClock;
    return true;
  }

  // ---------- voice helpers ----------
  // tone: {type,f,f2,t,dur,vol,a,lp,q,wob:{rate,cents},dest}

    g.gain.linearRampToValueAtTime(o.vol, o.t + a);

      const lg = ctx.createGain(); lg.gain.value = o.wob.cents;

  }

  function noise(o) {

  // ---------- SFX ----------
  const SFX = {
    step(t, v) {

    creak(t, v) {

    land(t, v) {

    jump(t, v) {

    },
    snore(t, v) {

      noise({ t: t + 0.65, dur: 0.8, vol: 0.24 * v, a: 0.2, type: 'lowpass', f: 380, f2: 140, q: 0.8 });
      tone({ t: t + 0.65, dur: 0.7, vol: 0.05 * v, a: 0.15, f: 62, f2: 52, type: 'sawtooth', lp: 160, wob: { rate: 28, cents: 80 } });

    stir(t, v) {

      tone({ t, dur: 0.55, vol: 0.1 * v, a: 0.08, f: 224, f2: 184, type: 'triangle', lp: 700 });
    },
    wake(t, v) {

      tone({ t: t + 0.16, dur: 0.34, vol: 0.22 * v, a: 0.03, f: 230, f2: 460, type: 'sawtooth', lp: 1100, q: 3 });
      noise({ t, dur: 0.12, vol: 0.05 * v, type: 'bandpass', f: 1500, q: 1 });
    },
    door(t, v) {
      noise({ t, dur: 0.85, vol: 0.15 * v, a: 0.2, type: 'bandpass', f: 220, f2: 900, q: 10 });
      tone({ t, dur: 0.85, vol: 0.07 * v, a: 0.2, f: 90, f2: 150, type: 'sawtooth', lp: 600, wob: { rate: 18, cents: 70 } });
      tone({ t: t + 0.7, dur: 0.1, vol: 0.18 * v, f: 140, f2: 80 });
    },
    slippers(t, v) {
      noise({ t, dur: 0.13, vol: 0.13 * v, a: 0.03, type: 'bandpass', f: 1800, f2: 1000, q: 0.8 });
      noise({ t: t + 0.24, dur: 0.13, vol: 0.11 * v, a: 0.03, type: 'bandpass', f: 1700, f2: 900, q: 0.8 });
    },
    hide(t, v) {
      tone({ t, dur: 0.12, vol: 0.3 * v, f: 170, f2: 80, type: 'triangle' });
      noise({ t, dur: 0.05, vol: 0.25 * v, type: 'bandpass', f: 900, q: 1.5 });
      tone({ t: t + 0.09, dur: 0.07, vol: 0.12 * v, f: 130, f2: 90, type: 'triangle' });

    checkpoint(t, v) {

    },
    plant(t, v) {

      tone({ t: t + 0.07, dur: 0.3, vol: 0.18 * v, f: 990, type: 'triangle' });
      tone({ t: t + 0.07, dur: 0.15, vol: 0.05 * v, f: 1980 });

  const CH = {
    Dm: { r: 38, v: [62, 65, 69] },
    Gm: { r: 43, v: [62, 67, 70] },
    Bb: { r: 46, v: [62, 65, 70] },
    F:  { r: 41, v: [60, 65, 69] },
    A:  { r: 45, v: [61, 64, 69] },
  };

  // melody per bar: [beatOffset, midi, durBeats]
  const MEL = [
    [[1, 77, 1], [2, 81, 1]],
    [[0, 82, 1.5], [2, 81, 1]],
    [[0, 79, 1], [1, 77, 1], [2, 74, 1]],
    [[0, 77, 2.5]],
    [[1, 82, 1], [2, 79, 1]],
    [[0, 81, 1], [1, 77, 1], [2, 72, 1]],
    [[0, 76, 1], [1, 73, 1], [2, 69, 1]],
    [[0, 74, 3]],
    [[0, 81, 1], [1, 84, 1], [2, 82, 1]],
    [[0, 82, 1.5], [2, 79, 1]],
    [[0, 86, 1], [1, 82, 1], [2, 79, 1]],
    [[0, 84, 1], [1, 81, 1], [2, 77, 1]],
    [[1, 79, 0.5], [1.5, 81, 0.5], [2, 82, 1]],
    [[0, 81, 1.5], [2, 77, 1]],
    [[0, 85, 1], [1, 81, 1], [2, 76, 1]],
    [[1, 76, 1], [2, 73, 1]],
  ];

  function cello(t, midi, beats, vol, slow) {
    const dur = beats * SPB;
    const att = slow ? 0.28 : 0.11;
    const f = mtof(midi);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2;
    lp.frequency.setValueAtTime(260, t);
    lp.frequency.linearRampToValueAtTime(slow ? 620 : 900, t + att + 0.15);
    lp.frequency.linearRampToValueAtTime(420, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + att);
    g.gain.setValueAtTime(vol * 0.85, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f; o1.detune.value = -4;
    const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 5;
    const m1 = ctx.createGain(); m1.gain.value = 0.55; const m2 = ctx.createGain(); m2.gain.value = 0.9;
    o1.connect(m1); o2.connect(m2); m1.connect(lp); m2.connect(lp); lp.connect(g); g.connect(songBus);

    const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(9, t + dur * 0.6);

  function pluck(t, midi, vol, len) {

      }

      if (bb === 0) {
        cello(t - 0.05, ch.r, 2.8, 0.13, true);

  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  // ---------- public API ----------
  G.rhythm = {
    unlock() {

        if (!ctx) { if (!buildGraph()) return; }

    startMusic(name) {

      if (ctx && ctx.state === 'running') { if (!timer) startTimer(); }
    },
    stopMusic() {
      wantedSong = null;
      if (ctx) {
        const now = ctx.currentTime;
        songBus.gain.cancelScheduledValues(now);
        songBus.gain.setValueAtTime(songBus.gain.value, now);
        songBus.gain.linearRampToValueAtTime(0.0001, now + 0.2);

      playingSong = null;
    },
    setMusicEnabled(on) {
      musicEnabled = !!on;
      G.save.set('music', musicEnabled);

    },
    isMusicEnabled() { return musicEnabled; },
    beat,
    beatPhase() { const b = beat(); return b - Math.floor(b); },
    barBeat() { return ((Math.floor(beat()) % 3) + 3) % 3; },
    nearBeat(win) {
      const w = win === undefined ? CFG.BEAT_WINDOW : win;
      const d = this.beatPhase() * SPB;
      return d <= w || (SPB - d) <= w;
    },
    state() { return ctx ? ctx.state : 'locked'; },
    audioClockActive() { syncClock(); return audioSync; },
    _debug: debug,
    _ctx() { return ctx; },
  };
})();

      c.strokeStyle = 'rgba(70,40,55,0.85)'; c.lineWidth = 0.95; c.stroke();
      // nose dot
      c.beginPath(); c.arc(fx + 0.4, headY + 3.0, 0.45, 0, TAU); c.fillStyle = 'rgba(150,110,110,0.5)'; c.fill();
    } else {
      c.beginPath(); c.moveTo(-5.5, headY - 8); c.quadraticCurveTo(-1, headY - 10.4, 4, headY - 9);
      c.strokeStyle = 'rgba(150,140,190,0.4)'; c.lineWidth = 1.1; c.stroke();
      line(c, 0, headY - 7, 0, headY + 1, 'rgba(0,0,0,0.5)', 0.8);
    }
    if (sneaking) c.restore();
    c.restore(); // lean
    c.restore();
  }

  // ---------------------------------------------------------------- IVY: lying / getting up (posed figure)
  const ss = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  const lerp = (a, b, u) => a + (b - a) * u;
  function rot2(a, x, y) { const s = sin(a), k = cos(a); return [x * k - y * s, x * s + y * k]; }

  // world-space braid chain with gravity + floor clamp (frame: y=0 floor)
  function braidW(c, ax, ay, a0, o) {
    const n = 6, L = 3.9, pts = [[ax, ay]];
    let px = ax, py = ay;
    for (let i = 0; i < n; i++) {
      const k = (i + 1) / n;
      const a = a0 + o.sway * sin(o.t * o.sf - i * 0.55 + o.phase) * k + (o.curl || 0) * k;
      px += cos(a) * L; py += sin(a) * L;
      if (py > -2.2) py = -2.2;
      pts.push([px, py]);
    }
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[i + 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      ell(c, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, L * 0.78, 2.75 - (i / n) * 0.7, ang);
      fs(c, '#100c15', 0.8, 0.5);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
      c.strokeStyle = 'rgba(120,110,150,0.32)'; c.lineWidth = 0.8; c.stroke();
    }
    const e = pts[n], pa = pts[n - 1];
    c.save(); c.translate(e[0], e[1]); c.rotate(Math.atan2(e[1] - pa[1], e[0] - pa[0]) - PI / 2);
    ell(c, -2.6, 0.6, 2.8, 1.7, -0.5); fs(c, P.bordeauxLight, 0.7, 0.5);
    ell(c, 2.6, 0.6, 2.8, 1.7, 0.5); fs(c, P.bordeauxLight, 0.7, 0.5);
    ell(c, 0, 0.5, 1.3, 1.3); fs(c, P.bordeaux, 0.6, 0.5);
    c.beginPath(); c.moveTo(-0.8, 1.6); c.quadraticCurveTo(0, 5.5, 0.8, 1.6); c.fillStyle = '#100c15'; c.fill();
    c.restore();
  }

  function legIK(c, hx, hy, fx, fy, w) {
    const S = 7.7;
    let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy);
    if (d > 2 * S - 0.2) { fx = hx + dx / d * (2 * S - 0.2); fy = hy + dy / d * (2 * S - 0.2); dx = fx - hx; dy = fy - hy; d = 2 * S - 0.2; }
    const hgt = Math.max(0.9, Math.sqrt(Math.max(0, S * S - d * d / 4)));
    let nx = -dy / d, ny = dx / d;
    if (nx * 0.5 - ny < 0) { nx = -nx; ny = -ny; } // knee bends forward/up
    const kx = (hx + fx) / 2 + nx * hgt, ky = (hy + fy) / 2 + ny * hgt;
    limb(c, hx, hy, fx, fy, w, '#1a1620', kx, ky);
    // quadratic control -> actual curve passes about halfway to control; fine for a cartoon
    ell(c, fx + 1.2, fy - 0.4, 3.9, 2.2, 0); fs(c, '#2c2030', 0.8, 0.55);
    c.beginPath(); c.moveTo(fx - 1, fy - 1.7); c.quadraticCurveTo(fx + 1.5, fy - 2.5, fx + 3.5, fy - 1.5);
    c.strokeStyle = 'rgba(200,190,220,0.22)'; c.lineWidth = 0.7; c.stroke();
  }

  function faceHead(c, headY, t, lid, fx) { // head at (0,headY) in current frame; lid 1 = closed
    ell(c, 0, headY, 8.2, 8.7); fs(c, P.skin, 1.1, 0.6);
    c.beginPath();
    c.moveTo(-8.7, headY + 3.4);
    c.bezierCurveTo(-10, headY - 7, -5, headY - 11.2, 0, headY - 10.6);
    c.bezierCurveTo(6, headY - 11.2, 10, headY - 6, 8.7, headY + 3.4);
    c.bezierCurveTo(8.6, headY - 0.2, 7.6, headY - 2.4, 6.2, headY - 3.4);
    c.bezierCurveTo(3.6, headY - 3.4, 1, headY - 4.8, -1.6, headY - 5.4);
    c.bezierCurveTo(-4, headY - 4, -7.4, headY - 2.6, -8.7, headY + 3.4);
    fs(c, '#17121d', 1, 0.6);
    c.beginPath(); c.moveTo(-5.5, headY - 8); c.quadraticCurveTo(-1, headY - 10.6, 4, headY - 9.2);
    c.strokeStyle = 'rgba(150,140,190,0.4)'; c.lineWidth = 1.1; c.stroke();
    const bl = max(lid, blink(t) * (1 - lid));
    for (let i = -1; i <= 1; i += 2) {
      const ex = i * 3.5 + fx, ey = headY + 0.4;
      c.beginPath(); c.arc(ex, ey + 1.4, 2.3, 0.2, PI - 0.2); c.strokeStyle = 'rgba(110,80,120,0.2)'; c.lineWidth = 0.8; c.stroke();
      if (bl < 0.97) {
        ell(c, ex, ey, 2.4, 2.3); c.fillStyle = '#fbf8f2'; c.fill();
        c.beginPath(); c.arc(ex + fx * 0.25, ey + 0.5, 1.35, 0, TAU); c.fillStyle = '#2a1c2c'; c.fill();
        c.save(); c.beginPath(); c.ellipse(ex, ey, 2.5, 2.4, 0, 0, TAU); c.clip();
        c.fillStyle = '#f0e8de'; c.fillRect(ex - 3, ey - 3, 6, 3.2 + bl * 2.6);
        c.restore();
      }
      c.beginPath(); c.moveTo(ex - 2.7, ey + 0.2 + bl * 2.4); c.lineTo(ex + 2.7, ey + 0.2 + bl * 2.4);
      c.strokeStyle = ink(0.85); c.lineWidth = 1.1; c.stroke();
      c.beginPath(); c.moveTo(ex - 2.4, ey - 3.0 + bl * 0.6); c.lineTo(ex + 2.4, ey - 3.5 + (i > 0 ? 0.3 : 0) + bl * 0.6);
      c.strokeStyle = 'rgba(30,22,36,0.55)'; c.lineWidth = 0.7; c.stroke();
      ell(c, ex + i * 1.2, ey + 3.6, 1.8, 1.0); c.fillStyle = 'rgba(176,86,100,0.16)'; c.fill();
    }
    c.beginPath(); c.moveTo(fx - 1.9, headY + 5.2); c.lineTo(fx + 1.9, headY + 5.2);
    c.strokeStyle = 'rgba(70,40,55,0.85)'; c.lineWidth = 0.95; c.stroke();
    c.beginPath(); c.arc(fx + 0.4, headY + 3.0, 0.45, 0, TAU); c.fillStyle = 'rgba(150,110,110,0.5)'; c.fill();
  }

  // p: {t, hx, hy, ang, sq, headRel, lid, feet:[[x,y],[x,y]], reach, candle:{x,y}, hold, lit, trail, wob, dust}
  function ivyFigure(c, p) {
    const t = p.t, ang = p.ang, sq = p.sq;
    const shY = -21, waistY = -12, hemY = 2.5, headY = -28.6;
    const W = (x, y) => { const r = rot2(ang, x, y); return [p.hx + r[0], p.hy + r[1]]; };           // torso-local -> frame
    const Lc = (x, y) => { const dx = x - p.hx, dy = y - p.hy, k = cos(ang), s = sin(ang); return [dx * k + dy * s, -dx * s + dy * k]; };
    const lying = clamp(-ang / 1.2, 0, 1);

    // floor shadow
    c.fillStyle = 'rgba(10,6,16,0.28)'; ell(c, p.hx + (p.feet[0][0] - p.hx) * 0.3 - 4 * lying, 0.5, 11 + 14 * lying, 2.4); c.fill();

    // dust (drag)
    if (p.dust) {
      for (let i = 0; i < 4; i++) {
        const u = ((p.t * 1.6 + i / 4) % 1), fx = p.feet[0][0] + 3 + u * 9 + i * 1.5;
        ell(c, fx, -1.5 - u * 5 - i * 0.6, 1.7 + u * 3, 1.3 + u * 2.2);
        c.fillStyle = 'rgba(210,200,190,' + (0.38 * (1 - u)) + ')'; c.fill();
      }
    }

    // far braid
    const hd = W(0, headY);
    const spread = p.trail ? 0.1 : 0;
    const bo = { t, sway: 0.06 + (p.trail ? 0.14 : 0) + 0.12 * (1 - lying), sf: p.trail ? 9 : 2.5, phase: 0, curl: 0 };
    const aStandFar = PI / 2 + ang * 0.9 + 0.1, aStandNear = PI / 2 + ang * 0.9 - 0.1;
    const aFar = p.trail ? 0.18 : lerp(aStandFar, PI - 0.22, lying), aNear = p.trail ? 0.38 : lerp(aStandNear, 0.42, lying);
    { const a = W(-7.4, headY + 2.8); braidW(c, a[0], a[1], aFar, bo); }

    // legs (behind dress)
    for (let i = -1; i <= 1; i += 2) {
      const o = W(i * 2.7 * sq, 0), fo = p.feet[i > 0 ? 0 : 1];
      legIK(c, o[0], o[1], fo[0], fo[1], 3.4);
    }

    // torso frame
    c.save(); c.translate(p.hx, p.hy); c.rotate(ang);
    // back arm
    {
      const bx = -8.5 * (0.4 + 0.6 * sq), by = waistY + 5 + (p.wob || 0);
      limb(c, -4.6 * sq, shY + 1.8, bx, by, 3.5, '#211b2b', (-4.6 * sq + bx) / 2 - 1, (shY + by) / 2 + 1);
      ell(c, bx, by, 2.1, 2.1); fs(c, P.skin, 0.6, 0.5);
    }
    // dress (squashed sideways while lying so it stays low)
    c.save(); c.scale(sq, 1);
    const d = p.trail ? 3 : 0;
    c.beginPath();
    c.moveTo(-5.4, shY);
    c.quadraticCurveTo(-6.2, waistY - 3, -4.4, waistY);
    c.bezierCurveTo(-8, waistY + 3, -11, hemY - 5, -12.2 + d, hemY);
    c.quadraticCurveTo(-6 + d, hemY + 2.4, 0 + d, hemY + 0.5);
    c.quadraticCurveTo(6 + d, hemY + 2.4, 12.2 + d, hemY);
    c.bezierCurveTo(11, hemY - 5, 8, waistY + 3, 4.4, waistY);
    c.quadraticCurveTo(6.2, waistY - 3, 5.4, shY);
    c.quadraticCurveTo(0, shY - 2.4, -5.4, shY);
    fs(c, '#231c2d', 1.2 / max(sq, 0.5), 0.6);
    c.strokeStyle = 'rgba(140,125,175,0.22)'; c.lineWidth = 0.8; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-3.5, waistY + 3); c.quadraticCurveTo(-6, (waistY + hemY) / 2, -7 + d, hemY - 1); c.stroke();
    c.beginPath(); c.moveTo(3.5, waistY + 3); c.quadraticCurveTo(6, (waistY + hemY) / 2, 7.5 + d, hemY - 1); c.stroke();
    c.beginPath(); c.moveTo(0, waistY + 3); c.quadraticCurveTo(0.5, (waistY + hemY) / 2, d * 0.8, hemY - 0.5); c.stroke();
    c.beginPath(); c.moveTo(-4.6, waistY - 0.4); c.quadraticCurveTo(0, waistY + 1.4, 4.6, waistY - 0.4);
    c.strokeStyle = P.bordeaux; c.lineWidth = 1.7; c.stroke();
    c.beginPath(); c.moveTo(-12 + d, hemY - 0.6); c.quadraticCurveTo(-6 + d, hemY + 1.6, d, hemY - 0.1); c.quadraticCurveTo(6 + d, hemY + 1.6, 12 + d, hemY - 0.6);
    c.strokeStyle = 'rgba(142,66,86,0.55)'; c.lineWidth = 0.9; c.stroke();
    rr(c, -2, shY - 3.5, 4, 5, 1.5); fs(c, '#e6dccf', 0.6, 0.4);
    c.beginPath(); c.moveTo(0.4, shY + 0.8); c.quadraticCurveTo(-3.4, shY - 2.2, -6.4, shY - 1.2);
    c.quadraticCurveTo(-6.2, shY + 2.5, -5.2, shY + 5.8); c.quadraticCurveTo(-2, shY + 3.6, 0.4, shY + 0.8);
    fs(c, '#f7f2ea', 0.9, 0.55);
    c.beginPath(); c.moveTo(-0.4, shY + 0.8); c.quadraticCurveTo(3.4, shY - 2.2, 6.4, shY - 1.2);
    c.quadraticCurveTo(6.2, shY + 2.5, 5.2, shY + 5.8); c.quadraticCurveTo(2, shY + 3.6, -0.4, shY + 0.8);
    fs(c, '#fbf7f0', 0.9, 0.55);
    ell(c, 0, shY + 1.6, 1.3, 1.3); fs(c, P.bordeauxLight, 0.5, 0.5);
    c.restore();

    // front arm (+ reach to the candle)
    const rest = [8.8 * (0.4 + 0.6 * sq) + (1 - sq) * 2, waistY + 3];
    let hand = rest, candW = null;
    const cd = p.candle;
    if (cd) {
      const holdL = [10.5, waistY + 1];
      const holdW = W(holdL[0], holdL[1]);
      const hold = ss(p.hold || 0);
      candW = [lerp(cd.x, holdW[0], hold), lerp(cd.y, holdW[1], hold)];
      const rl = Lc(candW[0], candW[1]);
      hand = [lerp(rest[0], rl[0], ss(p.reach || 0)), lerp(rest[1], rl[1], ss(p.reach || 0))];
    }
    limb(c, 4.6 * sq, shY + 1.8, hand[0], hand[1], 3.5, '#2a2236', (4.6 * sq + hand[0]) / 2 + 1, (shY + hand[1]) / 2 + 1.5);
    c.restore(); // torso frame

    // head (frame coords, so the face can tilt on its own)
    const near = W(7.4, headY + 2.8);
    c.save(); c.translate(hd[0], hd[1]); c.rotate(ang + (p.headRel || 0)); c.translate(0, -headY);
    // (head drawn at its own origin: translate trick keeps headY centre at hd)
    faceHead(c, headY, t, p.lid, 1.5 * (1 - lying));
    c.restore();

    // near braid over the dress
    bo.phase = 1.3;
    braidW(c, near[0], near[1], aNear, bo);

    // candle (upright when held, lying on the floor otherwise)
    if (cd) {
      const hold = ss(p.hold || 0), lit = p.lit || 0;
      const a = lerp(PI / 2, ang * 0, hold);
      c.save(); c.translate(candW[0], candW[1]); c.rotate(a);
      candle(c, 0, 1.5 * (1 - hold), t, lit);
      c.restore();
      if (lit < 0.99) { const tip = rot2(a, 0, -8.6 + 1.5 * (1 - hold)); smokeWisp(c, candW[0] + tip[0], candW[1] + tip[1], t, (1 - lit) * (1 - 0.7 * hold) * (p.smoke == null ? 1 : p.smoke)); }
      // hand over the candle holder
      const hw = W(hand[0], hand[1]);
      if (hold > 0.02 || (p.reach || 0) > 0.5) { ell(c, hw[0], hw[1], 2.2, 2.2); fs(c, P.skin, 0.6, 0.5); }
    }
    if (!cd || (p.reach || 0) <= 0.5 && (p.hold || 0) <= 0.02) { const hw = W(hand[0], hand[1]); ell(c, hw[0], hw[1], 2.2, 2.2); fs(c, P.skin, 0.6, 0.5); }
  }

  function ivyDown(c, x, y, o) {
    const f = o.facing < 0 ? -1 : 1, t = o.t || 0, drag = !!o.drag;
    c.save(); c.translate(x, y); c.scale(f, 1);
    const wob = drag ? sin(t * 14) * 0.6 : 0;
    ivyFigure(c, {
      t, hx: 4 + (drag ? 1 : 0), hy: -6 + wob * 0.3, ang: -PI / 2 + 0.1, sq: 0.5, headRel: 0.9, lid: 1,
      feet: [[23, drag ? -4.5 + wob : -3], [20.5, drag ? -7 : -6.5]], candle: { x: 14, y: -3.5 }, reach: 0, hold: 0, lit: 0,
      trail: drag, dust: drag, wob: 0
    });
    c.restore();
  }

  function ivyGetup(c, x, y, o) {
    const f = o.facing < 0 ? -1 : 1, t = o.t || 0;
    const k = clamp(o.k == null ? 0 : o.k, 0, 1);
    const s1 = ss(k / 0.5), s2 = ss((k - 0.5) / 0.5);
    const hold = ss((k - 0.58) / 0.28);
    // slow, grumpy yawn-sag between sitting and rising
    const sag = sin(clamp((k - 0.35) / 0.3, 0, 1) * PI) * 0.12;
    const ang = (k < 0.5 ? lerp(-PI / 2 + 0.1, 0.22, s1) : lerp(0.22, 0.0, s2)) + sag * (k < 0.5 ? 1 : 0) + (k > 0.5 ? 0.05 * sin(s2 * PI) : 0);
    const hx = k < 0.5 ? lerp(4, -1, s1) : lerp(-1, 0, s2);
    const hy = k < 0.5 ? lerp(-6, -3.5, s1) : lerp(-3.5, -15, s2);
    const feetL = [[23, -3], [20.5, -6.5]], feetS = [[21, -1.5], [17.5, -4]], feetU = [[2.7, 0], [-2.7, 0]];
    const feet = [0, 1].map(i => {
      if (k < 0.5) return [lerp(feetL[i][0], feetS[i][0], s1), lerp(feetL[i][1], feetS[i][1], s1)];
      // feet slide in, with a small lift
      const lift = sin(s2 * PI) * 2.2 * (i ? 1 : 0.6);
      return [lerp(feetS[i][0], feetU[i][0], s2), lerp(feetS[i][1], feetU[i][1], s2) - lift];
    });
    c.save(); c.translate(x, y); c.scale(f, 1);
    ivyFigure(c, {
      t, hx, hy, ang, sq: lerp(0.5, 1, s1), headRel: lerp(0.9, 0.12, s1) * (1 - s2) + (k > 0.5 ? 0 : 0), lid: 1 - ss((k - 0.12) / 0.32),
      feet, candle: { x: 14, y: -3.5 }, reach: ss((k - 0.42) / 0.16) * (1 - hold), hold,
      lit: ss((k - 0.86) / 0.1), smoke: 1, wob: 0
    });
    c.restore();
  }

  // ---------------------------------------------------------------- Ivy's spider companion + silk thread
  function drawThread(c, x1, y1, x2, y2, o) {
    o = o || {};
    const t = o.t || 0, len = Math.hypot(x2 - x1, y2 - y1);
    const sag = o.taut ? 0.6 * sin(t * 30) : min(26, len * 0.14) + sin(t * 1.6) * 1.2;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag * 1.9;
    c.save(); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(mx, my, x2, y2);
    c.strokeStyle = 'rgba(190,200,230,0.18)'; c.lineWidth = 3.2; c.stroke();
    c.strokeStyle = 'rgba(232,236,248,0.9)'; c.lineWidth = 1.05; c.stroke();
    // a travelling glint
    const u = (t * 0.5) % 1, v = 1 - u;
    const gx = v * v * x1 + 2 * u * v * mx + u * u * x2, gy = v * v * y1 + 2 * u * v * my + u * u * y2;
    c.beginPath(); c.arc(gx, gy, 1.3, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
    c.restore();
  }

  function drawSpider(c, x, y, o) {
    o = o || {};
    const t = o.t || 0, mode = o.mode || 'hang', f = o.facing < 0 ? -1 : 1, sc = o.scale || 1;
    let ph = t * 12, bob = 0, tilt = 0, eyeLook = 0.5 * f;
    if (mode === 'hang') { bob = sin(t * 2.2) * 0.8; tilt = sin(t * 1.3) * 0.05; }
    else if (mode === 'walk') { bob = -abs(sin(ph)) * 1.0; tilt = sin(ph) * 0.04; }
    else { tilt = f * 0.38; bob = sin(t * 20) * 0.25; eyeLook = -f * 0.8; } // pull: leaning back, looking at the thread
    c.save(); c.translate(x, y + bob); c.scale(sc, sc); c.rotate(tilt);
    // legs
    const KDX = [7, 9.5, 9.5, 7.5], KDY = [-8, -4.5, -0.5, 2.5], FDX = [11, 14, 14, 11], FDY = [-1, 4.5, 8, 10.5];
    c.lineCap = 'round'; c.lineJoin = 'round';
    for (let s = -1; s <= 1; s += 2) {
      for (let j = 0; j < 4; j++) {
        const bx = s * 3.5, by = -1.5 + j * 1.6;
        let kx = s * KDX[j], ky = KDY[j], fx = s * FDX[j], fy = FDY[j];
        const pp = ph + j * 1.6 + (s > 0 ? 0 : PI);
        if (mode === 'hang') {
          const w = sin(t * 3 + j * 0.9 + (s > 0 ? 0 : 1.3));
          fx += s * w * 1.0; fy += cos(t * 3 + j * 0.9) * 1.8; ky += w * 0.8;
        } else if (mode === 'walk') {
          fx += sin(pp) * 3.2; fy = FDY[j] - max(0, cos(pp)) * 3.2 + 1.5; kx += sin(pp) * 1.6; ky += -max(0, cos(pp)) * 2.2 + 0.5;
        } else {
          fx = s * (FDX[j] + 2.5); fy = FDY[j] + 2.5; kx = s * (KDX[j] + 1.5); ky = KDY[j] + 1;
          if (s === -f && j === 0) { fx = -f * 15; fy = -9 + sin(t * 20) * 0.8; kx = -f * 9; ky = -9; } // front leg hauling the silk
          if (s === -f && j === 1) { fx = -f * 15; fy = -2; kx = -f * 10; ky = -6; }
        }
        for (let k = 0; k < 2; k++) {
          c.beginPath(); c.moveTo(bx, by); c.lineTo(kx, ky); c.lineTo(fx, fy);
          c.strokeStyle = k === 0 ? ink(0.5) : '#1d1726'; c.lineWidth = k === 0 ? 2.4 : 1.2; c.stroke();
        }
        ell(c, kx, ky, 0.9, 0.9); c.fillStyle = '#2d2438'; c.fill();
      }
    }
    // body: abdomen (round) + head bump

      ell(c, -14 + i * 3.6 + hh(i, 4) * 2, -5 - hh(i, 2) * 6, 1.5 + hh(i, 3), 1.2 + hh(i, 3) * 0.6);
      c.fillStyle = 'rgba(' + (230 + fl * 25 | 0) + ',' + (110 + fl * 80 | 0) + ',40,' + (0.5 + fl * 0.5) + ')'; c.fill();
    }
    // tiny flame lick
    c.save(); c.globalAlpha = 0.85; flame(c, -2, -9, 1.5, t, 2); flame(c, 8, -9, 1.0, t + 1, 4); c.restore();
    // rising sparks
    for (let i = 0; i < 3; i++) { const u = (t * 0.5 + i / 3) % 1; c.beginPath(); c.arc(-6 + i * 6 + sin(u * 8 + i) * 3, -14 - u * 34, 0.9, 0, TAU); c.fillStyle = 'rgba(247,200,115,' + (1 - u) + ')'; c.fill(); }
    if (occ) peekEyes(c, 2, -36, t, 4, 1);
    // hearth stone
    rr(c, -42, -4, 84, 6, 2); fs(c, P.stone, 1.1, 0.55);
  }

  function drawCurtain(c, o) {
    const t = o.t || 0, occ = o.occupied;
    c.fillStyle = 'rgba(10,6,16,0.25)'; ell(c, 0, 1, 30, 3); c.fill();
    const sw = sin(t * 1.1) * 0.8;
    // rod
    line(c, -32, -102, 32, -102, '#8a6a3a', 3.2);
    for (const s of [-1, 1]) { ell(c, s * 33, -102, 3.8, 3.8); fs(c, P.amberLight, 0.9, 0.55); }
    // two curtain halves
    const gap = occ ? 7 : 0.5;
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(s * 30, -100);
      c.lineTo(s * gap, -100);
      c.bezierCurveTo(s * (gap + 3) + sw, -66, s * (gap - 1), -34, s * (gap + 5) + sw * 0.5, -2);
      c.lineTo(s * 33, -2 + 0);
      c.bezierCurveTo(s * 35 + sw, -40, s * 32, -70, s * 30, -100); c.closePath();
      fs(c, s < 0 ? P.bordeaux : '#7a3547', 1.3, 0.6);
      c.strokeStyle = 'rgba(30,8,18,0.35)'; c.lineWidth = 1.2;
      for (let i = 1; i < 4; i++) { const xx = s * (gap + i * (30 - gap) / 4); c.beginPath(); c.moveTo(xx, -98); c.bezierCurveTo(xx + sw, -60, xx - 1, -30, xx + s * 2 + sw * 0.5, -2); c.stroke(); }
      c.strokeStyle = 'rgba(255,190,200,0.15)'; c.lineWidth = 1.4;
      const xx = s * (gap + 5); c.beginPath(); c.moveTo(xx, -96); c.bezierCurveTo(xx + sw, -60, xx, -30, xx + s * 2, -4); c.stroke();
      // hem band
      c.beginPath(); c.moveTo(s * (gap + 5), -3); c.lineTo(s * 33, -3); c.strokeStyle = P.amberLight; c.lineWidth = 1.2; c.globalAlpha = 0.5; c.stroke(); c.globalAlpha = 1;
    }
    if (occ) {
      // dark gap fill behind (drawn after halves, thin strip)
      c.beginPath(); c.moveTo(-gap + 0.6, -98); c.bezierCurveTo(-gap + 2, -66, -gap, -34, -gap + 1, -4); c.lineTo(gap - 1, -4); c.bezierCurveTo(gap, -34, gap - 2, -66, gap - 0.6, -98); c.closePath();
      c.fillStyle = '#0d0912'; c.fill();
      peekEyes(c, 0, -52, t, 2.6, 1);
    } else {
      c.beginPath(); c.moveTo(0, -98); c.bezierCurveTo(sw, -60, -1, -30, 0, -3); c.strokeStyle = ink(0.4); c.lineWidth = 1; c.stroke();
    }
    c.beginPath(); c.moveTo(-30, -62); c.quadraticCurveTo(-34, -56, -30, -50); c.strokeStyle = P.amberLight; c.lineWidth = 1.6; c.stroke();
  }

  function drawHideSpot(c, x, y, o) {
    o = o || {};
    c.save(); c.translate(x, y);
    const k = o.kind || 'wardrobe';
    if (k === 'armor') drawArmor(c, o, true); else if (k === 'fireplace') drawFireplace(c, o);
    else if (k === 'curtain') drawCurtain(c, o); else drawWardrobe(c, o);
    c.restore();
  }

  // ---------------------------------------------------------------- traps
  function jag(c, x1, y1, x2, y2, seed, amp, n) {
    c.beginPath(); c.moveTo(x1, y1);
    for (let i = 1; i < n; i++) {
      const u = i / n;
      c.lineTo(x1 + (x2 - x1) * u + (hh(seed, i) - 0.5) * amp, y1 + (y2 - y1) * u + (hh(seed + 7, i) - 0.5) * amp * 1.4);
    }
    c.lineTo(x2, y2);
  }

  function drawChandelier(c, x, y, o) {
    const t = o.t || 0, ang = (o.angle != null) ? o.angle : sin((o.phase || 0) * TAU) * 70 * PI / 180;
    const L = o.rope != null ? o.rope : 3 * TILE;
    c.save(); c.translate(x, y);
    // ceiling mount
    rr(c, -9, -4, 18, 8, 3); fs(c, '#2c2536', 1.2, 0.6);
    ell(c, 0, 4, 4, 3); fs(c, '#8a6a3a', 1, 0.55);
    // chain from the anchor to the bob; bob = anchor + (sin a * L, cos a * L)
    c.save(); c.rotate(-ang);
    const n = Math.max(4, Math.round((L - 14) / 7.5));
    for (let i = 0; i < n; i++) {
      const yy = 4 + (i + 0.5) * (L - 14) / n;
      ell(c, 0, yy, i % 2 ? 1.2 : 2.3, 3.2); c.strokeStyle = ink(0.55); c.lineWidth = 2.3; c.stroke();
      ell(c, 0, yy, i % 2 ? 1.2 : 2.3, 3.2); c.strokeStyle = '#a58a58'; c.lineWidth = 1.1; c.stroke();
    }
    c.restore();
    const bx = sin(ang) * L, by = cos(ang) * L;
    c.translate(bx, by);
    if (o.danger || o.warn) glow(c, 0, 0, o.danger ? 52 : 44, 0.28 + 0.1 * sin(t * 16), 'red');
    glow(c, 0, -2, 50, 0.14, 'amber');
    // body ~44 x 22, centred on the bob (hangs from the chain: tilts only a little)
    const tilt = -ang * 0.45;
    c.rotate(tilt); c.scale(0.7, 0.7); c.translate(0, -3);
    // hook down to body
    line(c, 0, -2, 0, 0, '#a58a58', 1.4);
    ell(c, 0, -2, 4.5, 4.5); fs(c, '#8a6a3a', 1.1, 0.6);
    c.beginPath(); c.moveTo(-5, 0); c.bezierCurveTo(-18, 6, -30, 6, -31, -2); c.moveTo(5, 0); c.bezierCurveTo(18, 6, 30, 6, 31, -2);
    c.moveTo(-3, 0); c.bezierCurveTo(-8, 10, -16, 12, -17, 5); c.moveTo(3, 0); c.bezierCurveTo(8, 10, 16, 12, 17, 5); c.moveTo(0, 2); c.lineTo(0, 12);
    c.strokeStyle = ink(0.7); c.lineWidth = 5.4; c.lineCap = 'round'; c.stroke();
    c.strokeStyle = '#6a5a4a'; c.lineWidth = 3.6; c.stroke();
    const cand = [[-31, -2], [31, -2], [-17, 5], [17, 5], [0, -3]];
    for (let i = 0; i < 5; i++) {
      const cx = cand[i][0], cy = cand[i][1];
      ell(c, cx, cy + 1, 4.4, 1.6); fs(c, '#8a6a3a', 0.9, 0.5);
      rr(c, cx - 1.9, cy - 8, 3.8, 8.5, 1); fs(c, P.cream, 0.9, 0.5);
      c.save(); c.translate(cx, cy - 8); c.rotate(-tilt);
      flame(c, 0, 0, (o.warn ? 1.25 : 1) * 1.3, t, i * 1.3);
      glow(c, 0, -5, 16, 0.3, 'amber');
      c.restore();
    }
    for (let i = -2; i <= 2; i++) {
      const cx = i * 9, cy = 8 + (abs(i) === 1 ? 4 : abs(i) === 2 ? 0 : 7);
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + 1.8, cy + 4); c.lineTo(cx, cy + 7 + sin(t * 3 + i) * 0.4); c.lineTo(cx - 1.8, cy + 4); c.closePath();
      fs(c, 'rgba(201,207,224,0.8)', 0.8, 0.5);
    }
    c.restore();
  }

  function drawSpark(c, x, y, o) {
    const t = o.t || 0, span = o.span || 3 * TILE, danger = o.danger, warn = o.warn;
    const H = 58, tx = [-span / 2, span / 2];
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(10,6,16,0.28)'; for (const px of tx) { ell(c, px, 1, 14, 2.6); c.fill(); }
    for (let k = 0; k < 2; k++) {
      const px = tx[k];
      // base
      rr(c, px - 11, -10, 22, 11, 3); fs(c, '#3f4553', 1.3, 0.6);
      ell(c, px - 6, -5, 1.2, 1.2); c.fillStyle = '#8d93a8'; c.fill(); ell(c, px + 6, -5, 1.2, 1.2); c.fill();
      // coil rings narrowing upward
      c.beginPath(); c.moveTo(px - 7, -10); c.lineTo(px + 7, -10); c.lineTo(px + 3.6, -H + 8); c.lineTo(px - 3.6, -H + 8); c.closePath(); fs(c, '#6b4a35', 1.2, 0.6);
      for (let i = 0; i < 6; i++) {
        const u = i / 5, yy = -14 - u * (H - 28), w = 7 - u * 3.4;
        c.beginPath(); c.moveTo(px - w, yy); c.quadraticCurveTo(px, yy + 3, px + w, yy); c.strokeStyle = '#d29b5e'; c.lineWidth = 2.2; c.stroke();
        c.beginPath(); c.moveTo(px - w + 1, yy - 0.8); c.quadraticCurveTo(px, yy + 1.6, px + w - 1, yy - 0.8); c.strokeStyle = 'rgba(255,230,190,0.4)'; c.lineWidth = 0.8; c.stroke();
      }
      // top orb
      const on = danger ? 1 : warn ? 0.6 + 0.4 * sin(t * 30) : 0.25 + 0.1 * sin(t * 3 + k);
      glow(c, px, -H + 2, danger ? 34 : 20, 0.3 + on * 0.5, 'blue');
      ell(c, px, -H + 2, 7, 7); fs(c, '#a07a3a', 1.2, 0.6);
      ell(c, px - 2, -H, 2.4, 2); c.fillStyle = 'rgba(255,240,200,0.7)'; c.fill();
    }
    const ax1 = tx[0], ax2 = tx[1], ay = -H + 2;
    const seed = Math.floor(t * 22);
    if (danger) {
      for (let k = 0; k < 3; k++) {
        const s2 = seed * 3 + k;
        jag(c, ax1 + 6, ay, ax2 - 6, ay, s2, 22, 14);
        c.strokeStyle = 'rgba(160,190,255,' + (k ? 0.25 : 0.4) + ')'; c.lineWidth = k ? 4 : 7; c.lineJoin = 'round'; c.stroke();
        jag(c, ax1 + 6, ay, ax2 - 6, ay, s2, 22, 14);
        c.strokeStyle = k ? 'rgba(220,235,255,0.7)' : '#fff'; c.lineWidth = k ? 1 : 1.8; c.stroke();
      }
      glow(c, 0, ay, span * 0.55, 0.18, 'blue');
    } else if (warn) {
      for (let k = 0; k < 2; k++) {
        const px = tx[k], dir = k ? -1 : 1;
        for (let i = 0; i < 3; i++) {
          if (hh(seed, i + k * 5) < 0.45) continue;
          const an = -PI / 2 + dir * (0.4 + hh(seed + 3, i) * 1.2);
          const l = 9 + hh(seed + 5, i) * 11;
          jag(c, px, ay, px + cos(an) * l, ay + sin(an) * l, seed + i * 11 + k, 7, 4);
          c.strokeStyle = 'rgba(210,225,255,0.9)'; c.lineWidth = 1.2; c.stroke();
        }
      }
    }
    c.restore();
  }

  function drawPlant(c, x, y, o) {
    const t = o.t || 0, danger = o.danger, warn = o.warn;
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(10,6,16,0.28)'; ell(c, 0, 1, 20, 3); c.fill();
    const sway = sin(t * 1.6) * 1.5;
    // pot
    c.beginPath(); c.moveTo(-13, -16); c.lineTo(13, -16); c.lineTo(10, 0); c.lineTo(-10, 0); c.closePath(); fs(c, '#8a4a3a', 1.3, 0.6);
    rr(c, -15, -20, 30, 6, 2.5); fs(c, '#a65d4a', 1.2, 0.6);
    c.beginPath(); c.moveTo(-8, -12); c.lineTo(-6.5, -3); c.strokeStyle = 'rgba(255,200,170,0.25)'; c.lineWidth = 1.6; c.stroke();
    // leaves at base
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 3, -20); c.bezierCurveTo(s * 18, -24, s * 26, -14, s * 22, -8); c.bezierCurveTo(s * 14, -14, s * 8, -16, s * 3, -20); fs(c, P.green, 1, 0.55); }
    // stem
    c.beginPath(); c.moveTo(0, -20); c.bezierCurveTo(-4 + sway, -30, 4 + sway, -34, sway, -40);
    c.strokeStyle = ink(0.55); c.lineWidth = 5.4; c.lineCap = 'round'; c.stroke(); c.strokeStyle = P.green; c.lineWidth = 3.6; c.stroke();
    // head: two lobes hinged at bottom
    const open = danger ? 0.05 : warn ? 1.0 : 0.5 + sin(t * 2) * 0.05;
    const hx = sway, hy = -40;
    c.save(); c.translate(hx, hy);
    if (danger) c.scale(1 + 0.05 * sin(t * 40), 1);
    for (const s of [-1, 1]) {
      c.save(); c.rotate(s * (open + 0.05));
      const Lh = 30, W = 15;
      c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(s * -2, -8, s * W * 0.2, -Lh * 0.7, s * W * 0.6, -Lh); c.bezierCurveTo(s * W * 1.5, -Lh * 0.8, s * W * 1.6, -Lh * 0.2, 0, 0);
      c.closePath();
      // outer is green, inner is bordeaux when open (draw inner first as same path)
      fs(c, open > 0.3 ? '#a63a52' : P.green, 1.4, 0.6);
      // teeth along outer edge
      if (open > 0.3) {
        c.save(); c.clip();
        c.fillStyle = 'rgba(255,120,150,0.28)'; ell(c, s * 8, -14, 5, 11, s * 0.1); c.fill();
        c.restore();
      }
      const teeth = 6;
      for (let i = 0; i < teeth; i++) {
        const u = (i + 0.5) / teeth; const px = s * W * (0.6 + 0.95 * Math.sin(u * PI) * 0.0) , py = -u * Lh;
        const bx = s * (W * 1.5 * Math.sin(u * PI * 0.8) * 0.82 + 1.5), by = -Lh * (0.12 + u * 0.82);
        c.beginPath(); c.moveTo(bx, by - 2); c.lineTo(bx - s * 4.2, by); c.lineTo(bx, by + 2); c.closePath(); fs(c, '#f4eedd', 0.6, 0.5);
      }
      c.strokeStyle = 'rgba(30,50,25,0.45)'; c.lineWidth = 1; c.beginPath(); c.moveTo(s * 1, -3); c.quadraticCurveTo(s * 5, -Lh * 0.5, s * 9, -Lh * 0.9); c.stroke();
      c.restore();
    }
    // spots when closed / eyes? tiny glinting mean eyes when warn
    if (warn) { ell(c, 0, -12, 1.4, 1.4); c.fillStyle = P.amberLight; c.fill(); }
    c.restore();
    if (danger) { // chomp marks
      c.strokeStyle = 'rgba(239,230,208,0.85)'; c.lineWidth = 1.4;
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 18, -66); c.lineTo(s * 25, -72); c.moveTo(s * 20, -58); c.lineTo(s * 28, -60); c.stroke(); }
    }
    c.restore();
  }

  function drawFlask(c, x, y, o) {
    const t = o.t || 0, danger = o.danger, warn = o.warn;
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(10,6,16,0.28)'; ell(c, 0, 1, 16, 2.6); c.fill();
    // stand: tripod
    for (const s of [-1, 1]) line(c, s * 12, -1, s * 7, -9, '#3f4553', 2.4);
    rr(c, -13, -11, 26, 3, 1.5); fs(c, '#6a6f84', 1, 0.55);
    const wob = warn ? sin(t * 40) * 0.6 : 0;
    c.save(); c.translate(wob, 0);
    // glass flask
    c.beginPath(); c.moveTo(-3.6, -44); c.lineTo(-3.6, -32); c.bezierCurveTo(-5, -26, -14, -22, -14, -17); c.bezierCurveTo(-14, -9, -8, -8, 0, -8); c.bezierCurveTo(8, -8, 14, -9, 14, -17); c.bezierCurveTo(14, -22, 5, -26, 3.6, -32); c.lineTo(3.6, -44); c.closePath();
    fs(c, 'rgba(201,207,224,0.28)', 1.4, 0.6);
    // liquid
    c.save(); c.clip();
    c.beginPath(); c.moveTo(-16, -22 + sin(t * 3) * 0.8); c.quadraticCurveTo(-7, -25 + sin(t * 3 + 1) * 1, 0, -22); c.quadraticCurveTo(7, -19 + sin(t * 3) * 1, 16, -22 + sin(t * 3 + 2) * 0.8); c.lineTo(16, -6); c.lineTo(-16, -6); c.closePath();
    c.fillStyle = 'rgba(120,185,70,0.88)'; c.fill();
    glow(c, 0, -14, 22, danger ? 0.5 : warn ? 0.4 : 0.25, 'green');
    c.restore();
    // bubbles
    const nb = warn || danger ? 6 : 3;
    for (let i = 0; i < nb; i++) {
      const u = (t * (warn ? 1.3 : 0.6) + hh(i, 9)) % 1;
      c.beginPath(); c.arc(-6 + hh(i, 1) * 12 + sin(u * 8 + i) * 1.2, -10 - u * 12, 0.9 + hh(i, 2) * 1.3, 0, TAU);
      c.strokeStyle = 'rgba(225,255,190,0.85)'; c.lineWidth = 0.8; c.stroke();
    }
    // highlight
    c.beginPath(); c.moveTo(-9, -20); c.quadraticCurveTo(-11, -15, -8, -12); c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 1.6; c.stroke();
    // cork
    if (!danger) { rr(c, -4.4, -49 + (warn ? sin(t * 40) * 0.8 : 0), 8.8, 7, 2); fs(c, '#b08a5a', 1, 0.55); }
    c.restore();
    // puff
    if (danger) {
      for (let i = 0; i < 6; i++) {
        const u = ((t * 1.6) + i / 6) % 1;
        const r = 5 + u * 14 + hh(i, 3) * 4;
        ell(c, sin(i * 2.3) * 6 * u + sin(t * 3 + i) * 2, -46 - u * 40, r, r * 0.85);
        c.fillStyle = 'rgba(' + (126 + (i % 2) * 20) + ',' + (190 + (i % 3) * 10) + ',70,' + (0.55 * (1 - u * 0.8)) + ')'; c.fill();
        c.strokeStyle = 'rgba(40,70,25,' + 0.25 * (1 - u) + ')'; c.lineWidth = 1; c.stroke();
      }
    }
    c.restore();
  }

  function drawTrap(c, x, y, o) {
    o = o || {};
    const k = o.kind;
    if (k === 'chandelier') drawChandelier(c, x, y, o);
    else if (k === 'spark') drawSpark(c, x, y, o);
    else if (k === 'plant') drawPlant(c, x, y, o);
    else if (k === 'flask') drawFlask(c, x, y, o);
  }

  // ---------------------------------------------------------------- tiles
  const THEMES = {
    bedroom: { stone: ['#4a4256', '#524a5f', '#433b4f'], mortar: '#1f1a27', hi: '#6a6078', accent: '#6b2e3e' },
    greenhouse: { stone: ['#3f4a4a', '#465251', '#394443'], mortar: '#171f1d', hi: '#617068', accent: '#5e7d4a' },
    lab: { stone: ['#3e4558', '#454d61', '#383f50'], mortar: '#141823', hi: '#6a7690', accent: '#4aa0a0' },
    hall: { stone: ['#4f4752', '#58505b', '#48404b'], mortar: '#201a22', hi: '#756a7c', accent: '#8e4256' },
  };
  const SCALE = 2;
  const tileCache = {};
  function mk(w, h) { const s = document.createElement('canvas'); s.width = w * SCALE; s.height = h * SCALE; const c = s.getContext('2d'); c.scale(SCALE, SCALE); return [s, c]; }

  function block(c, x0, y0, x1, y1, seed, col, hi, top) {
    const j = (i) => (hh(seed, i) - 0.5);
    const r = 3.2;
    c.beginPath();
    c.moveTo(x0 + r + j(1), y0 + 0.2 + j(2) * 0.8);
    c.quadraticCurveTo((x0 + x1) / 2, y0 + j(3) * 1.6, x1 - r + j(4), y0 + j(5) * 0.8);
    c.quadraticCurveTo(x1 + j(6) * 0.8, y0 + j(7) * 0.8, x1 + j(8) * 0.6, y0 + r + j(9));
    c.quadraticCurveTo(x1 + j(10) * 1.6, (y0 + y1) / 2, x1 + j(11) * 0.6, y1 - r + j(12));
    c.quadraticCurveTo(x1 + j(13) * 0.8, y1 + j(14) * 0.8, x1 - r + j(15), y1 + j(16) * 0.6);
    c.quadraticCurveTo((x0 + x1) / 2, y1 + j(17) * 1.6, x0 + r + j(18), y1 + j(19) * 0.6);
    c.quadraticCurveTo(x0 + j(20) * 0.8, y1 + j(21) * 0.8, x0 + j(22) * 0.6, y1 - r + j(23));
    c.quadraticCurveTo(x0 + j(24) * 1.6, (y0 + y1) / 2, x0 + j(25) * 0.6, y0 + r + j(26));
    c.quadraticCurveTo(x0 + j(27) * 0.8, y0 + j(28) * 0.8, x0 + r + j(1), y0 + 0.2 + j(2) * 0.8);
    c.closePath();
    c.fillStyle = col; c.fill();
    c.save(); c.clip();
    // highlight band on top, shade at bottom
    c.fillStyle = top ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.06)'; c.fillRect(x0 - 2, y0 - 1, x1 - x0 + 4, 3.5);
    c.fillStyle = 'rgba(10,6,16,0.2)'; c.fillRect(x0 - 2, y1 - 3, x1 - x0 + 4, 4);
    // speckles

  // ---------------------------------------------------------------- light
  let lightCv = null, lightCx = null;

    l.clearRect(0, 0, VW, VH);

    l.fillRect(0, 0, VW, VH);
    const fl = 1 + 0.03 * sin(t * 9) + 0.02 * sin(t * 17.3) + 0.012 * sin(t * 29);

  // ---------------------------------------------------------------- speech bubble
  const wrapCache = new Map();
  function wrapText(c, text, maxW) {
    const key = text + '|' + maxW;
    let r = wrapCache.get(key); if (r) return r;
    const words = String(text).split(/\s+/); const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (c.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    let mw = 0; for (const ln of lines) mw = max(mw, c.measureText(ln).width);
    r = { lines, w: mw };
    if (wrapCache.size > 80) wrapCache.clear();
    wrapCache.set(key, r); return r;
  }
  function drawBubble(c, x, y, text, o) {
    o = o || {};

    c.save();
    c.font = '15px ' + FONT;
    const wr = wrapText(c, text, 260), lines = wr.lines;
    const lh = 19, px = 12, py = 9;
    const w = max(34, Math.ceil(wr.w) + px * 2), h = lines.length * lh + py * 2;
    const bx = Math.round(x - w / 2), by = Math.round(y - 24 - h);
    let fill = '#efe6d0', stroke = 'rgba(20,16,24,0.7)', tcol = ink(0.92);
    if (who === 'npc') fill = '#dde2ee';
    const ghost = who === 'ghost';
    if (ghost) { fill = 'rgba(226,238,255,0.9)'; stroke = 'rgba(150,175,220,0.85)'; tcol = '#33406a'; }
    const gt = G.time || 0;
    const wob = (i) => ghost ? sin(gt * 3 + i * 1.3) * 1.5 : 0;
    // body path
    const r = 12;
    const tipx = x, tipy = y - 3;
    const tx0 = clamp(x - 6, bx + r, bx + w - r - 12);
    c.beginPath();
    c.moveTo(bx + r, by + wob(0));
    c.quadraticCurveTo(bx + w / 2, by - 1 + wob(1), bx + w - r, by + wob(2));
    c.quadraticCurveTo(bx + w + wob(3), by, bx + w + wob(3), by + r);
    c.lineTo(bx + w + wob(4), by + h - r);
    c.quadraticCurveTo(bx + w, by + h, bx + w - r, by + h + wob(5));
    c.lineTo(tx0 + 12, by + h);
    c.quadraticCurveTo(tx0 + 8, by + h + 8, tipx, tipy);
    c.quadraticCurveTo(tx0 + 2, by + h + 6, tx0, by + h);
    c.lineTo(bx + r, by + h + wob(6));
    c.quadraticCurveTo(bx, by + h, bx + wob(7), by + h - r);
    c.lineTo(bx + wob(8), by + r);
    c.quadraticCurveTo(bx, by, bx + r, by + wob(0));
    c.closePath();
    c.fillStyle = 'rgba(10,6,16,0.25)'; c.save(); c.translate(1.5, 2.5); c.fill(); c.restore();
    c.fillStyle = fill; c.fill();
    c.strokeStyle = stroke; c.lineWidth = 1.5; c.lineJoin = 'round'; c.stroke();
    if (!ghost) { // inner hairline for the storybook feel
      c.save(); c.globalAlpha = 0.18; c.strokeStyle = P.bordeaux; c.lineWidth = 1; rr(c, bx + 3, by + 3, w - 6, h - 6, r - 3); c.stroke(); c.restore();
    }
    c.fillStyle = tcol; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let i = 0; i < lines.length; i++) c.fillText(lines[i], bx + px, by + py + lh * (i + 0.5) + 0.5 + (ghost ? sin(gt * 3 + i) * 0.8 : 0));
    c.restore();
  }

    c.beginPath(); c.ellipse(-15, -22 + sin(t * 2.6) * 1, 4, 6, 0.5, 0, TAU); c.fill(); c.stroke();

  function rockBlob(c, r, seed) {
    const n = 9, p = [];

    c.closePath();
  }

    c.strokeStyle = 'rgba(10,6,16,0.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-r * 0.1, -r * 0.5); c.lineTo(r * 0.05, -r * 0.1); c.lineTo(-r * 0.25, r * 0.2); c.lineTo(-r * 0.2, r * 0.55); c.stroke();
    c.fillStyle = '#4a6a47'; ell(c, -r * 0.5, -r * 0.6, r * 0.3, r * 0.12, -0.5); c.fill();
    c.restore();

  }
  // drawRock: 'warn' => x,y = CEILING anchor (top centre; a stone bulges out of the ceiling, dust trickles).

  // ================================================================ web
  // x,y = left end of the patch on the floor; spans len tiles; ~1.2 tiles high.
  function drawWeb(c, x, y, o) {
    o = o || {};
    const len = o.len || 3, torn = !!o.torn, t = o.t || 0, N = len * 2, SP = TILE / 2, H = TILE * 1.2;
    c.save(); c.translate(x, y);
    const top = (j) => ({ x: j * SP + sin(t * 1.4 + j * 1.3) * 0.8, y: -H * (0.78 + 0.22 * (j % 2 ? 0 : 1)) + sin(t * 1.7 + j) * 0.9 });

    }

    const strand = (a, b, al) => { c.strokeStyle = 'rgba(225,235,248,' + al + ')'; c.lineWidth = 1; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); };

      strand([j * SP, 0], [p.x, p.y], 0.55);

    }

      c.strokeStyle = 'rgba(225,235,248,' + (0.7 - lvl * 0.15) + ')'; c.lineWidth = 1.05;
      for (let j = 0; j < N; j++) {
        if (gone(j) || gone(j + 1)) continue;
        const a = top(j), b = top(j + 1), ax = a.x, ay = a.y * lvl, bx = b.x, by = b.y * lvl;
        c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + 4 + lvl * 2, bx, by); c.stroke();

    _onPassable() { // standing on a one-way / ladder top only (no solid)
      const w = this.world, r = this._supportRow(), cs = this._cols();
      let one = false;
      for (let c = cs[0]; c <= cs[1]; c++) {
        if (w.isSolid(c, r)) return false;
        if (w.isOneWay(c, r) || this._ladderTop(c, r)) one = true;
      }
      return one;
    }

    // ---------- collision moves ----------
    _moveX(dx) {
      if (!dx) return;
      const w = this.world;
      this.x += dx;
      const r0 = w.toTile(this.y - this.h + EPS), r1 = w.toTile(this.y - EPS);
      if (dx > 0) {
        const c = w.toTile(this.x + this.w / 2 - EPS);
        for (let r = r0; r <= r1; r++) if (w.isSolid(c, r)) { this.x = c * T - this.w / 2; this.vx = 0; break; }
      } else {
        const c = w.toTile(this.x - this.w / 2);
        for (let r = r0; r <= r1; r++) if (w.isSolid(c, r)) { this.x = (c + 1) * T + this.w / 2; this.vx = 0; break; }
      }
    }

    _moveY(dy, climbing) {
      if (!dy) return;
      const w = this.world;
      const prevY = this.y;
      this.y += dy;
      const cs = this._cols();
      if (dy > 0) {
        const r = w.toTile(this.y - EPS);
        let land = false;
        for (let c = cs[0]; c <= cs[1] && !land; c++) {
          if (w.isSolid(c, r)) land = true;
          else if (!climbing && this._drop <= 0 && prevY <= r * T + 1e-3 &&
                   (w.isOneWay(c, r) || this._ladderTop(c, r))) land = true;
        }
        if (land) {
          this.y = r * T;
          this._impact = Math.max(this._impact, this.vy);
          this.vy = 0; this.onGround = true;
        }
      } else {
        const r = w.toTile(this.y - this.h);
        for (let c = cs[0]; c <= cs[1]; c++) {
          if (w.isSolid(c, r)) { this.y = (r + 1) * T + this.h; this.vy = 0; break; }
        }
      }
    }

    _physics(dt, climbing) {
      const n = Math.max(1, Math.ceil(Math.max(Math.abs(this.vx), Math.abs(this.vy)) * dt / 10));
      const h = dt / n;
      for (let i = 0; i < n; i++) {
        this._moveX(this.vx * h);
        const vy0 = this.vy;
        this._moveY(vy0 * h, climbing);
        if (this.vy === 0 && vy0 > 0) { /* landed; stop remaining sub-steps of downward motion */ }
      }
    }

    _emitJump() {
      G.events.emit('jump', { x: this.x, y: this.y });
      if (G.sfx) G.sfx.play('jump');
    }

    // ---------- main update ----------
    update(dt) {
      this.t += dt;
      this.noise = 0;
      if (this.state === 'hidden') { this.vx = 0; this.vy = 0; this.speed = 0; this.stillTime = 0; this.faded = false; this.fadeAlpha = 1; return; }

      const ctl = this.control, inp = G.input;
      const left = ctl && inp.down('left'), right = ctl && inp.down('right');
      const up = ctl && inp.down('up'), down = ctl && inp.down('down');
      const sneakHeld = ctl && inp.down('sneak');
      const jumpHeld = ctl && inp.down('jump');
      const jumpPressed = ctl && inp.pressed('jump');
      const dir = (right ? 1 : 0) - (left ? 1 : 0);
      if (dir) this.facing = dir;

      // crouch: sneaking on the ground shrinks the hitbox (bottom fixed); stay crouched while a ceiling is overhead
      const STAND_H = 50, CROUCH_H = CFG.CROUCH_H ?? 32;
      if (sneakHeld && this.onGround && !this.onLadder) this.crouched = true;
      else if (this.crouched && this._roomToStand(STAND_H, CROUCH_H)) this.crouched = false;
      this.h = this.crouched ? CROUCH_H : STAND_H;
      const sneakEff = sneakHeld || this.crouched;

      this._drop -= dt; this._grabCd -= dt;
      this._impact = 0;
      const wasGround = this.onGround;
      const wasClimb = this.onLadder;
      let jumpedNow = false;

      if (this.onLadder) {
        this._updateClimb(dt, { left, right, up, down, jumpPressed, dir });
      } else {
        // timers
        if (jumpPressed) this._buf = JUMP_BUF; else this._buf -= dt;
        if (wasGround) this._coyote = COYOTE; else this._coyote -= dt;

        // drop through one-way
        let dropped = false;
        if (jumpPressed && down && wasGround && this._onPassable()) {
          this._drop = 0.15; this.vy = 120; this.onGround = false; this._coyote = 0; this._buf = 0; dropped = true;
        }

        // grab ladder
        if (!dropped && this._grabCd <= 0 && (up || down)) {
          let col = null;
          if (up) col = this._bodyLadderCol();
          if (col === null && down && wasGround) col = this._belowLadderCol();
          if (col !== null) {
            this.onLadder = true; this._ladCol = col; this.vx = 0; this.vy = 0;
            this._buf = 0; this._coyote = 0; this._jumping = false; this.onGround = false;
          }
        }

        if (this.onLadder) {
          this._updateClimb(dt, { left, right, up, down, jumpPressed: false, dir });
        } else {
          // horizontal
          const maxV = ((sneakEff && wasGround) ? CFG.SNEAK_SPEED : CFG.WALK_SPEED) * (this.speedMul ? this.speedMul() : 1); // full air control: sneak-jumps clear creaky boards
          const target = dir * maxV;
          const grounded = wasGround;
          const acc = dir === 0 ? GROUND_DECEL : (grounded ? GROUND_ACCEL : AIR_ACCEL);
          this.vx = approach(this.vx, target, (grounded ? acc : (dir ? AIR_ACCEL : 600)) * dt);

          // jump
          if (!dropped && this._buf > 0 && this._coyote > 0) {
            this.vy = -CFG.JUMP_V; this._jumping = true; this._buf = 0; this._coyote = 0;
            this.onGround = false; jumpedNow = true; this._emitJump();
          }
          // variable jump height
          if (this._jumping) {
            if (this.vy >= 0) this._jumping = false;
            else if (!jumpHeld) { this.vy = Math.max(this.vy, -CFG.JUMP_V * CUT_V); this._jumping = false; }
          }

          this.vy = Math.min(this.vy + CFG.GRAVITY * dt, CFG.MAX_FALL);
          this.onGround = false;
          this._physics(dt, false);
          if (this.onGround) this._jumping = false;
        }
      }

      // landing
      let landNoise = 0;
      if (this.onGround && !wasGround && !wasClimb && !jumpedNow && this._impact >= LAND_MIN_SPEED) {
        landNoise = G.util.clamp(this._impact / CFG.LAND_NOISE_DIV, 0.3, 1);
        G.events.emit('land', { x: this.x, y: this.y, noise: landNoise });
        if (G.sfx) G.sfx.play('land');
      }

      // state
      const moving = this.onGround && !this.onLadder && dir !== 0 && Math.abs(this.vx) > 20;
      if (!ctl) this.state = 'frozen';
      else if (this.onLadder) this.state = 'climb';
      else if (!this.onGround) this.state = this.vy < 0 ? 'jump' : 'fall';
      else if (sneakEff) this.state = 'sneak';
      else this.state = moving ? 'walk' : 'idle';
      this.speed = this.onLadder ? Math.abs(this.vy) : Math.abs(this.vx);

      // noise + footsteps
      let creaky = false;
      if (this.onGround && !this.onLadder) creaky = this.world.isCreaky(this.world.toTile(this.x), this._supportRow());
      let n = 0;
      if (this.onLadder) {
        if (this.vy !== 0) n = CFG.NOISE_CLIMB;
      } else if (moving) {
        n = sneakEff ? CFG.NOISE_SNEAK : CFG.NOISE_WALK;
        if (creaky) n = Math.min(1, n * CFG.CREAK_MULT);
      }
      this.noise = Math.max(n, landNoise);

      // stillness: motionless on ground/ladder with no movement input -> fades (ghosts cannot see her)
      const keyMove = left || right || up || down || jumpPressed || jumpHeld;
      const still = ctl && !keyMove && (this.onGround || this.onLadder) && Math.abs(this.vx) < 1 && Math.abs(this.vy) < 1 && !jumpedNow;
      this.stillTime = still ? this.stillTime + dt : 0;
      this.faded = this.stillTime >= (CFG.STILL_FADE ?? 0.5);
      this.fadeAlpha = approach(this.fadeAlpha, this.faded ? 0.4 : 1, dt * 2.4);

      const interval = sneakEff ? STRIDE_SNEAK : STRIDE_WALK;
      if (moving) {
        this._stride += dt;
        if (this._stride >= interval) {
          this._stride -= interval;
          G.events.emit('step', { x: this.x, y: this.y, creaky, sneak: !!sneakEff });
          if (G.sfx) G.sfx.play(creaky ? 'creak' : 'step', sneakEff ? { vol: 0.5 } : undefined);
        }
      } else {
        this._stride = interval * 0.6;
      }
    }

    _updateClimb(dt, k) {
      const w = this.world;
      this.vx = 0;
      let vdir = (k.down ? 1 : 0) - (k.up ? 1 : 0);
      this.vy = vdir * CFG.CLIMB_SPEED;
      this.onGround = false;

      // jump off
      if (k.jumpPressed && !k.up) {
        this.onLadder = false; this._grabCd = 0.25;
        this.vy = -CFG.JUMP_V * 0.75; this.vx = k.dir * CFG.WALK_SPEED * 0.8;
        this._jumping = true; this._coyote = 0; this._buf = 0;
        this._emitJump();
        return;
      }

      // snap to ladder centre
      const cx = (this._ladCol + 0.5) * T;
      const sx = G.util.clamp(cx - this.x, -260 * dt, 260 * dt);
      this._moveX(sx);

      this._physics(dt, true);
      if (this.onGround) { // reached solid floor going down
        this.onLadder = false; this.vy = 0; this._grabCd = 0.15;
        return;
      }

      // step off sideways when at a landing handled above; otherwise check ladder continuity
      const c = this._ladCol;
      const r0 = w.toTile(this.y - this.h + 1), r1 = w.toTile(this.y - 1);
      let stay = false;
      for (let r = r0; r <= r1; r++) if (this._ladderish(c, r)) { stay = true; break; }
      if (!stay && this._ladderish(c, w.toTile(this.y + 1))) stay = true;

      if (this.vy < 0 && !this._ladderish(c, w.toTile(this.y - 1))) {
        // climbed past the top: stand on top if a ladder tile is right below
        const rb = w.toTile(this.y + 18);
        if (this._ladderish(c, rb) && !this._ladderish(c, rb - 1)) {
          this.y = rb * T; this.vy = 0; this.onGround = true; this.onLadder = false; this._grabCd = 0.15;
          return;
        }
      }
      if (!stay) { this.onLadder = false; this.vy = 0; this._grabCd = 0.15; }
    }

    draw(ctx) {
      if (this.state === 'hidden') return;
      if (G.art && G.art.drawIvy) {
        ctx.save();
        ctx.globalAlpha *= this.fadeAlpha;
        G.art.drawIvy(ctx, this.x, this.y, { state: this.state, facing: this.facing, t: this.t, speed: this.speed });
        ctx.restore();
        return;
      }
      // placeholder
      const x = this.x - this.w / 2, y = this.y - this.h, w = this.w, h = this.h;
      ctx.save();
      ctx.fillStyle = '#141018';
      const r = 6;
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.fill();
      ctx.fillStyle = '#f2ece4';
      ctx.beginPath(); ctx.ellipse(this.x + this.facing * 2, y + 12, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f3a03a';
      ctx.fillRect(this.x + this.facing * 10 - 2, y + 24, 4, 4);
      ctx.restore();
    }
  }

  G.Player = Player;
})();

// ===== stealth.js =====
(function () {
  const G = window.G;
  const CFG = G.CFG;
  const TILE = CFG.TILE;

  const HIDE_W = 1.6 * TILE, HIDE_H = 2.5 * TILE;
  const WALKER_W = 22, WALKER_H = 54;
  const SNORE_RANGE = 10 * TILE;

  function sfx(name, opts) { if (G.sfx && G.sfx.play) G.sfx.play(name, opts); }
  function nearBeatMult() {
    return (G.rhythm && G.rhythm.nearBeat && G.rhythm.nearBeat()) ? CFG.BEAT_BONUS : 1;
  }
  function beatSec() { return 60 / CFG.BPM; }

  class Stealth {
    constructor(world, player, level) {
      this.world = world; this.player = player; this.level = level;
      this.paused = false;
      this.sleepers = []; this.walkers = []; this.hides = [];
      const start = level.start || { tx: 1, ty: 1 };
      this.checkpoint = { x: (start.tx + 0.5) * TILE, y: (start.ty + 1) * TILE };
      this.hiddenIn = null;
      this.t = 0;
      (level.entities || []).forEach((e) => {
        const p = world.entPos(e);
        if (e.type === 'sleeper') {
          this.sleepers.push({
            x: p.x, y: p.y, who: e.who, radius: (e.radius || 5) * TILE,
            alert: 0, state: 'sleep', stirred: false, caught: false,
            snoreT: Math.random() * 3 * beatSec(),
          });
        } else if (e.type === 'walker') {
          const from = (e.from + 0.5) * TILE, to = (e.to + 0.5) * TILE;
          this.walkers.push({
            x: p.x, y: p.y, who: e.who || 'butler', from: Math.min(from, to), to: Math.max(from, to),
            speed: e.speed || 40, facing: to >= p.x ? 1 : -1, alert: 0, state: 'walk',
            startX: p.x, startFacing: to >= p.x ? 1 : -1, pause: 0, caught: false, stirred: false,
            slipT: Math.random() * 1.5,
          });
        } else if (e.type === 'hide') {
          this.hides.push({ x: p.x, y: p.y, kind: e.kind, occupied: false, w: HIDE_W, h: HIDE_H });
        }
      });
    }

    hideRect(h) { return { x: h.x - h.w / 2, y: h.y - h.h, w: h.w, h: h.h }; }
    walkerRect(w) { return { x: w.x - WALKER_W / 2, y: w.y - WALKER_H, w: WALKER_W, h: WALKER_H }; }
    playerHidden() { return this.player.state === 'hidden'; }

    nearestHide() {
      const pr = this.player.rect();
      for (const h of this.hides) if (G.util.overlap(pr, this.hideRect(h))) return h;
      return null;
    }

    maxAlert() {
      let m = 0;
      for (const s of this.sleepers) if (s.alert > m) m = s.alert;
      for (const w of this.walkers) if (w.alert > m) m = w.alert;
      return m;
    }

    resetAlerts() {
      for (const s of this.sleepers) { s.alert = 0; s.state = 'sleep'; s.stirred = false; s.caught = false; }
      for (const w of this.walkers) {
        w.alert = 0; w.state = 'walk'; w.x = w.startX; w.facing = w.startFacing; w.pause = 0;
        w.caught = false; w.stirred = false;
      }
      if (this.hiddenIn) { this.hiddenIn.occupied = false; this.hiddenIn = null; }
    }

    _unhide() {
      if (this.hiddenIn) this.hiddenIn.occupied = false;
      this.hiddenIn = null;
      if (this.player.state === 'hidden' && this.player.unhide) this.player.unhide();
    }

    _handleHide() {
      const p = this.player, inp = G.input;
      if (this.hiddenIn && p.state !== 'hidden') this.hiddenIn.occupied = false, this.hiddenIn = null;
      if (p.state === 'hidden') {
        if (inp.pressed('left') || inp.pressed('right') || inp.pressed('jump') || inp.pressed('up')) this._unhide();
        return;
      }
      if (p.control === false) return;
      if (!(inp.pressed('down') || inp.pressed('action')) || !p.onGround) return;
      const spot = this.nearestHide();
      if (!spot || spot.occupied) return;
      spot.occupied = true; this.hiddenIn = spot;
      p.hide(spot);
      p.setPos(spot.x, p.y);
      if (p.state !== 'hidden') p.state = 'hidden';
      G.events.emit('hide', { x: spot.x, y: spot.y });
      sfx('hide');
      if (spot.x !== this.checkpoint.x || spot.y !== this.checkpoint.y) {
        this.checkpoint = { x: spot.x, y: spot.y };
        G.events.emit('checkpoint', { x: spot.x, y: spot.y });
        sfx('checkpoint');
      }
    }

    // shared alert dynamics; returns true if just reached 1
    _alert(o, dist, radius, noise, hidden, dt) {
      if (o.state === 'awake') return false;
      if (!hidden && dist <= radius && noise > 0) {
        o.alert += noise * CFG.ALERT_GAIN * nearBeatMult() * G.util.clamp(1.15 - dist / radius, 0.2, 1.15) * dt;
      }
      o.alert -= CFG.ALERT_DECAY * dt; // always settles back when Ivy is quiet
      o.alert = G.util.clamp(o.alert, 0, 1);
      if (o.alert > CFG.STIR_AT) {
        if (!o.stirred) { o.stirred = true; G.events.emit('stir', { who: o.who, x: o.x, y: o.y }); sfx('stir'); }
        o.state = o.state === 'walk' ? 'walk' : 'stir';
      } else {
        if (o.alert < CFG.STIR_AT * 0.5) o.stirred = false;
        if (o.state === 'stir') o.state = 'sleep';
      }
      if (o.alert >= 1) { o.alert = 1; return true; }
      return false;
    }

    update(dt) {
      if (this.paused) return;
      this.t += dt;
      const p = this.player;
      this._handleHide();
      const hidden = this.playerHidden();
      const noise = hidden ? 0 : (p.noise || 0);
      const pcx = p.x, pcy = p.y - p.h / 2;

      // hard rules: near a sleeper Ivy may only sneak; touching a creaky board nearby wakes them at once
      const walking = !hidden && p.onGround && !p.crouched && !p.onLadder && Math.abs(p.vx) > CFG.SNEAK_SPEED * 1.3;
      const onCreak = !hidden && p.onGround && this.world.isCreaky(this.world.toTile(p.x), this.world.toTile(p.y + 1));
      if (onCreak && !this._creakSfx) { sfx('creak'); }
      this._creakSfx = onCreak;

      // sleepers
      for (const s of this.sleepers) {
        const d = G.util.dist(pcx, pcy, s.x, s.y - TILE * 0.8);
        if (!s.caught && s.state !== 'awake') {
          if (onCreak && d <= s.radius * CFG.CREAK_WAKE_MULT) s.alert = 1.5;
          else if (walking && d <= s.radius) s.alert += CFG.WALK_WAKE_RATE * dt;
        }
        if ((this._alert(s, d, s.radius, noise, hidden, dt) || (s.alert >= 1 && s.state !== 'awake')) && !s.caught) {
          s.state = 'awake'; s.caught = true;
          G.events.emit('caught', { by: 'sleeper', who: s.who, x: s.x, y: s.y });
        }
        // snoring: every ~3 beats, only when near
        s.snoreT -= dt;
        if (s.snoreT <= 0) {
          s.snoreT += 3 * beatSec();
          if (s.state !== 'awake' && d < SNORE_RANGE) {
            sfx('snore', { vol: G.util.clamp(1 - d / SNORE_RANGE, 0.1, 1) * 0.8 });
          }
        }
      }

      // walkers
      const pr = p.rect();
      for (const w of this.walkers) {
        if (w.state !== 'awake') {
          if (w.pause > 0) w.pause -= dt;
          else {
            w.x += w.facing * w.speed * dt;
            if (w.x >= w.to) { w.x = w.to; w.facing = -1; w.pause = 0.8; }
            else if (w.x <= w.from) { w.x = w.from; w.facing = 1; w.pause = 0.8; }
          }
          w.slipT -= dt;
          if (w.slipT <= 0) {
            w.slipT = G.util.rand(1.2, 2.2);
            const d = G.util.dist(pcx, pcy, w.x, w.y);
            if (d < SNORE_RANGE * 1.2 && w.pause <= 0) sfx('slippers', { vol: G.util.clamp(1 - d / (SNORE_RANGE * 1.2), 0.1, 1) });
          }
        }
        const d = G.util.dist(pcx, pcy, w.x, w.y - TILE * 0.8);
        const reached = this._alert(w, d, CFG.WALKER_HEAR_RADIUS * TILE, noise, hidden, dt);
        let hit = false;
        if (!hidden && !w.caught && G.util.overlap(pr, this.walkerRect(w))) hit = true;
        if ((reached || hit) && !w.caught) {
          w.caught = true; w.state = 'awake'; if (reached) w.alert = 1;
          G.events.emit('caught', { by: 'walker', who: w.who, x: w.x, y: w.y });
        }
      }
    }

    draw(ctx) {
      const art = G.art, t = G.time;
      for (const h of this.hides) {
        if (art && art.drawHideSpot) art.drawHideSpot(ctx, h.x, h.y, { kind: h.kind, occupied: h.occupied, t });
        else {
          ctx.fillStyle = h.occupied ? '#6b2e3e' : '#5a3b2e';
          ctx.fillRect(h.x - h.w / 2, h.y - h.h, h.w, h.h);
          if (h.occupied) { ctx.fillStyle = '#f2ece4'; ctx.fillRect(h.x - 8, h.y - h.h + 30, 4, 4); ctx.fillRect(h.x + 4, h.y - h.h + 30, 4, 4); }
        }
      }
      for (const s of this.sleepers) {
        if (art && art.drawSleeper) art.drawSleeper(ctx, s.x, s.y, { who: s.who, state: s.state, alert: s.alert, t });
        else {
          ctx.fillStyle = s.state === 'awake' ? '#a3203a' : s.state === 'stir' ? '#f3a03a' : '#3a3247';
          ctx.fillRect(s.x - 2 * TILE, s.y - TILE, 4 * TILE, TILE);
        }
        if (art && art.drawZzz) art.drawZzz(ctx, s.x, s.y - 2 * TILE, { t, alert: s.alert });
        else if (s.state !== 'awake') { ctx.fillStyle = '#c9cfe0'; ctx.font = '16px serif'; ctx.fillText('Zzz', s.x, s.y - 1.5 * TILE - s.alert * 10); }
      }
      for (const w of this.walkers) {
        if (art && art.drawWalker) art.drawWalker(ctx, w.x, w.y, { who: w.who, facing: w.facing, t, alert: w.alert });
        else {
          ctx.fillStyle = '#efe6d0';
          ctx.fillRect(w.x - WALKER_W / 2, w.y - WALKER_H, WALKER_W, WALKER_H);
          ctx.fillStyle = '#a3203a'; ctx.fillRect(w.x + w.facing * 8 - 3, w.y - WALKER_H + 12, 6, 4);
        }
        if (w.alert > 0.8 && art && art.drawZzz) art.drawZzz(ctx, w.x, w.y - WALKER_H - 10, { t, alert: w.alert });
      }
    }
  }

  G.Stealth = Stealth;
