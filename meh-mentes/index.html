<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Méh-mentés</title>
<style>
html,body{margin:0;height:100%;background:#1d3b2a;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;position:fixed;left:0;top:0;width:100%}
#mm-stage{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#mm-touch{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5;font-family:"Baloo 2","Fredoka","Comic Sans MS","Trebuchet MS",sans-serif}
#mm-touch *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
#mm-pad{position:absolute;pointer-events:auto}
#mm-pad-disc,#mm-pad-knob{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;will-change:transform}
#mm-pad-disc{background:radial-gradient(circle,rgba(255,255,255,.42) 0%,rgba(255,255,255,.3) 60%,rgba(255,255,255,.2) 100%);
  border:5px solid rgba(255,255,255,.92);box-shadow:0 0 0 3px #1d2b4a,0 4px 10px rgba(0,0,0,.35),inset 0 0 14px rgba(255,255,255,.35);opacity:.85}
#mm-pad-knob{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd21f 70%,#f0a500);border:3px solid #1d2b4a;box-shadow:0 3px 6px rgba(0,0,0,.4);opacity:.95}
.mm-overlay #mm-pad-disc{opacity:.5}.mm-overlay #mm-pad-knob{opacity:.7}
#mm-pad.active #mm-pad-disc{opacity:1}.mm-overlay #mm-pad.active #mm-pad-disc{opacity:.8}
#mm-btns{position:absolute;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column}
.mm-overlay #mm-btns{flex-direction:row;justify-content:flex-end}
.mm-btn{position:absolute;pointer-events:auto;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.28));border:3px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 2px #1d2b4a,0 3px 6px rgba(0,0,0,.35);transition:opacity .15s,transform .08s}
#mm-btns .mm-btn{position:relative}
.mm-btn.small{width:44px;height:44px;background:rgba(255,255,255,.22)}
.mm-btn svg{fill:#fff;stroke:#1d2b4a;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;overflow:visible;pointer-events:none}
.mm-btn svg .arc{fill:none;stroke:#fff;stroke-width:2.4;paint-order:stroke}
.mm-btn svg .slash{display:none;stroke:#ff5a5a;stroke-width:3}
.mm-btn.off{opacity:.5}.mm-btn.off svg .slash{display:block}
.mm-btn.dim{opacity:.4}
.mm-btn.press{transform:scale(.9)}
.mm-overlay .mm-btn{opacity:.85}.mm-overlay .mm-btn.off{opacity:.5}.mm-overlay .mm-btn.dim{opacity:.4}
#mm-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 16px 6px 10px;border-radius:999px;
  background:rgba(18,32,58,.88);border:2px solid #ffd21f;color:#ffd21f;font-weight:bold;font-size:18px;line-height:1.1;white-space:nowrap;pointer-events:none;z-index:6;
  text-shadow:0 2px 0 #1d2b4a;animation:mmhint .4s ease-out}
#mm-hint .phone{animation:mmrot 2.4s ease-in-out infinite}
#mm-inapp{position:absolute;display:none;align-items:center;gap:4px;padding:2px 0 2px 10px;border-radius:12px;background:rgba(18,32,58,.9);border:2px solid #ffd21f;
  color:#fff;font-size:11px;line-height:1.2;font-weight:bold;pointer-events:none;z-index:7;box-sizing:border-box}
#mm-inapp .txt{flex:1}
#mm-inapp .x{pointer-events:auto;flex:none;margin:-8px 0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#ffd21f;cursor:pointer}
@keyframes mmhint{from{opacity:0}to{opacity:1}}
@keyframes mmrot{0%,15%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="mm-stage"><canvas id="game" tabindex="0"></canvas></div>
<div id="mm-err" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#7a1020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px;white-space:pre-wrap;-webkit-user-select:text;user-select:text"></div>
<script>
// Diagnostics: show script errors on the page instead of a silent blank screen
(function () {
  var shown = 0;
  function show(msg) {
    if (shown++ > 2) return;
    var el = document.getElementById('mm-err'); if (!el) return;
    el.style.display = 'block';
    el.textContent += (el.textContent ? '\n' : 'Hiba történt – kérlek, küldd el ezt a szöveget:\n') + msg;
  }
  window.addEventListener('error', function (e) {
    show((e.message || 'ismeretlen hiba') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
})();
</script>
<script>
// ===== config.js =====
// Méh-mentés — shared constants and event bus
var MM = window.MM = window.MM || {};

MM.CFG = {
  W: 960, H: 720,
  PLAY: { x0: 30, y0: 80, x1: 930, y1: 700 },
  HUD_H: 60,

  LIVES: 5,
  PLAYER_SPEED: 150,          // px / s
  SPEED_FACTOR: 1.5,          // 'speed' boost
  SLOW_FACTOR: 0.5,           // 'slow' boost on spiders
  SPIDER_SPEED: { slow: 78, fast: 114 },
  SPIDER_RANDOM: { slow: 0.35, fast: 0.15 },  // chance of a random turn at a node
  SPIDER_RESPAWN: 4,          // s after being eaten
  SHIELD_RESPAWN: 2.5,        // s a spider is out of play after being knocked off by the shield
  SCARED_FACTOR: 0.6,         // spider speed while honey is active (they flee)

  TURN_DOT: 0.25,
  REVERSE_DOT: 0.85,          // mid-strand U-turn only for a (nearly) opposite direction
  STRAIGHT_DOT: 0.64,         // auto-follow a bend up to ~50 degrees when no strand matches the input
  HIT_DIST: 20,
  PICKUP_DIST: 20,

  READY_TIME: 1.8,
  DYING_TIME: 1.6,
  LEVEL_DONE_TIME: 3.0,
  BEE_TIME: 5.0,

  SCORE_EDGE: 10,
  SCORE_BOOST: 50,
  SCORE_SPIDER: 200,
  SCORE_LIFE_BONUS: 100,      // per remaining life at level end
  // time bonus: T0 = (sum of strand lengths) / PLAYER_SPEED = fastest possible sweep.
  // full bonus while levelTime <= FULL * T0, then linear down to 0 at ZERO * T0
  TIME_BONUS_MAX: 1500,
  TIME_BONUS_FULL: 1.15,
  TIME_BONUS_ZERO: 3.5,

  // spider setups; the setup chosen in the menu (startDifficulty) applies to EVERY level
  SETUPS: {
    1: ['slow'],
    2: ['slow', 'slow'],
    3: ['fast'],
    4: ['slow', 'fast'],
    5: ['fast', 'fast']
  },
  LEVEL_SPEEDUP: 0.04,        // spider speed multiplier = 1 + LEVEL_SPEEDUP * levelIndex
  HIGHLIGHT_LEFT: 6,          // highlight the remaining strands when this few (or fewer) are left
  DIFF_NAMES: ['', '1 lassú pók', '2 lassú pók', '1 gyors pók', '1 lassú + 1 gyors pók', '2 gyors pók'],

  BOOST_FIRST: 6,             // s until the first boost of a level
  BOOST_INTERVAL: [7, 12],    // s between spawns (random in range)
  BOOST_TTL: 9,               // s a boost stays on the web
  BOOST_MAX: 2,               // max simultaneously on the web
  BOOSTS: {
    slow:   { name: 'Lassítás',   dur: 7, weight: 5, color: '#4aa3ff' },
    freeze: { name: 'Fagyasztás', dur: 4, weight: 4, color: '#9fe8ff' },
    speed:  { name: 'Gyorsítás',  dur: 7, weight: 5, color: '#ff8a3c' },
    honey:  { name: 'Mézcsepp',   dur: 6, weight: 3, color: '#ffc21a' },
    shield: { name: 'Pajzs',      dur: 0, weight: 3, color: '#7be07b' },
    double: { name: 'Dupla pont', dur: 10, weight: 3, color: '#d77bff' },
    life:   { name: '+1 élet',    dur: 0, weight: 1, color: '#ff5d7a' },
    skip:   { name: 'Szintugrás', dur: 0, weight: 1, color: '#ffffff' }  // never on the last level
  },
  MAX_LIVES: 7,

  STORAGE_KEY: 'mehmentes.v1'
};

MM.Events = (function () {
  var map = {};
  return {
    on: function (name, fn) { (map[name] = map[name] || []).push(fn); },
    emit: function (name, data) {
      var l = map[name]; if (!l) return;
      for (var i = 0; i < l.length; i++) { try { l[i](data || {}); } catch (e) { console.error(e); } }
    }
  };
})();

MM.rand = function (a, b) { return a + Math.random() * (b - a); };
MM.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

// ===== levels.js =====
// Méh-mentés — six procedurally generated spider-web layouts (deterministic).
var MM = window.MM = window.MM || {};

MM.Levels = (function () {
  var PLAY = (MM.CFG && MM.CFG.PLAY) || { x0: 30, y0: 80, x1: 930, y1: 700 };
  var CX = (PLAY.x0 + PLAY.x1) / 2, CY = (PLAY.y0 + PLAY.y1) / 2;
  var MAXLEN = 240;

  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function Builder() { this.nodes = []; this.edges = []; this.seen = {}; }
  Builder.prototype.node = function (x, y) {
    x = Math.round(x * 10) / 10; y = Math.round(y * 10) / 10;
    for (var i = 0; i < this.nodes.length; i++) {
      var n = this.nodes[i];
      if (Math.abs(n.x - x) < 0.6 && Math.abs(n.y - y) < 0.6) return i;
    }
    this.nodes.push({ x: x, y: y });
    return this.nodes.length - 1;
  };
  Builder.prototype.edge = function (a, b) {
    if (a === b || a < 0 || b < 0) return;
    var k = a < b ? a + '_' + b : b + '_' + a;
    if (this.seen[k]) return;
    this.seen[k] = 1;
    this.edges.push({ a: a, b: b });
  };
  Builder.prototype.len = function (e) {
    var p = this.nodes[e.a], q = this.nodes[e.b];
    return Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y));
  };
  // split edges longer than max into equal pieces
  Builder.prototype.splitLong = function (max) {
    var old = this.edges; this.edges = []; this.seen = {};
    for (var i = 0; i < old.length; i++) {
      var e = old[i], L = this.len(e);
      if (L <= max) { this.edge(e.a, e.b); continue; }
      var n = Math.ceil(L / max), p = this.nodes[e.a], q = this.nodes[e.b], prev = e.a;
      for (var k = 1; k < n; k++) {
        var t = k / n, m = this.node(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);
        this.edge(prev, m); prev = m;
      }
      this.edge(prev, e.b);
    }
  };

  function sp(c, e) { var s = c < 0 ? -1 : 1; return s * Math.pow(Math.abs(c), 2 / e); }
  function ellPt(cx, cy, rx, ry, ang, e) {
    return { x: cx + rx * sp(Math.cos(ang), e), y: cy + ry * sp(Math.sin(ang), e) };
  }

  // generic orb web. opts: cx,cy,rx,ry,spokes,rings[],exps[],a0,wobble,rand
  function orb(b, o) {
    var S = o.spokes, R = o.rings.length, rand = o.rand, w = o.wobble || 0;
    var hub = b.node(o.cx, o.cy), grid = [];
    var angs = [];
    for (var k = 0; k < S; k++) angs.push(o.a0 + k * 2 * Math.PI / S + (w ? (rand() - 0.5) * w * 0.9 : 0));
    for (var m = 0; m < R; m++) {
      var row = [];
      for (k = 0; k < S; k++) {
        var f = o.rings[m] * (1 + (w ? (rand() - 0.5) * w : 0));
        var p = ellPt(o.cx, o.cy, o.rx * f, o.ry * f, angs[k], o.exps[m]);
        row.push(b.node(Math.min(PLAY.x1 - 1, Math.max(PLAY.x0 + 1, p.x)), Math.min(PLAY.y1 - 1, Math.max(PLAY.y0 + 1, p.y))));
      }
      grid.push(row);
    }
    for (k = 0; k < S; k++) {
      b.edge(hub, grid[0][k]);
      for (m = 0; m < R; m++) {
        if (m > 0) b.edge(grid[m - 1][k], grid[m][k]);
        b.edge(grid[m][k], grid[m][(k + 1) % S]);
      }
    }
    return { hub: hub, grid: grid, angs: angs };
  }

  function dist(p, q) { return Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y)); }

  // ---------------------------------------------------------------- levels
  function level0() {
    var b = new Builder();
    var w = orb(b, { cx: CX, cy: CY, rx: 450, ry: 310, spokes: 8, rings: [0.3, 0.62, 1], exps: [2, 2.3, 3.2],
      a0: -Math.PI / 2, rand: rng(1) });
    b.splitLong(MAXLEN);
    // corner anchors: diag outer nodes at k = 1,3,5,7 (TR,BR,BL,TL)
    var corners = [[1, PLAY.x1 - 38, PLAY.y0 + 30], [3, PLAY.x1 - 38, PLAY.y1 - 30],
                   [5, PLAY.x0 + 38, PLAY.y1 - 30], [7, PLAY.x0 + 38, PLAY.y0 + 30]];
    corners.forEach(function (c) {
      var d = w.grid[2][c[0]], cn = b.node(c[1], c[2]);
      b.edge(cn, d);
      // neighbours of d along the outer ring
      var nb = [];
      b.edges.forEach(function (e) {
        if (e.a === d || e.b === d) {
          var o = e.a === d ? e.b : e.a;
          // outer-ring neighbours: not the spoke (inner) neighbour
          if (o !== w.grid[1][c[0]]) nb.push(o);
        }
      });
      nb.forEach(function (o) { b.edge(cn, o); });
    });
    return b;
  }

  function level1() {
    var b = new Builder();
    var nC = 6, nR = 3, R = 1, hexes = [];
    // flat-top hexes, unit R=1; col spacing 1.5, row spacing sqrt3, odd cols shifted
    var H = Math.sqrt(3);
    var minx = 0, maxx = 1.5 * (nC - 1) + 2, miny = 0, maxy = H * (nR + 0.5);
    var sx = (PLAY.x1 - PLAY.x0 - 40) / (maxx - minx), sy = (PLAY.y1 - PLAY.y0 - 40) / (maxy - miny);
    for (var c = 0; c < nC; c++) {
      for (var r = 0; r < nR; r++) {
        var hx = 1 + 1.5 * c, hy = H / 2 + H * r + (c % 2 ? H / 2 : 0), vs = [];
        for (var k = 0; k < 6; k++) {
          var a = k * Math.PI / 3;
          vs.push(b.node(PLAY.x0 + 20 + (hx + Math.cos(a)) * sx, PLAY.y0 + 20 + (hy + Math.sin(a)) * sy));
        }
        for (k = 0; k < 6; k++) b.edge(vs[k], vs[(k + 1) % 6]);
      }
    }
    return b;
  }

  function level2() {
    var b = new Builder(), n = 8, dx = (PLAY.x1 - PLAY.x0) / n, dy = (PLAY.y1 - PLAY.y0) / n, i, j;
    function P(i, j) { return b.node(PLAY.x0 + i * dx, PLAY.y0 + j * dy); }
    for (i = 0; i < n; i++) for (j = 0; j < n; j++) {
      if ((i + j) % 2 === 0) b.edge(P(i, j), P(i + 1, j + 1));
      else b.edge(P(i + 1, j), P(i, j + 1));
    }
    // frame
    for (i = 0; i < n; i += 2) {
      b.edge(P(i, 0), P(i + 2, 0)); b.edge(P(i, n), P(i + 2, n));
      b.edge(P(0, i), P(0, i + 2)); b.edge(P(n, i), P(n, i + 2));
    }
    return b;
  }

  function level3() {
    var b = new Builder();
    var hx = 84, hy = 126, x1 = PLAY.x1 - 6, y1 = PLAY.y1 - 6, K = 8;
    var hub = b.node(hx, hy);
    var radii = [240, 400, 560, 720, 880, 1040];
    var rad = [], ends = [], grid = [];
    var cornerAng = Math.atan2(y1 - hy, x1 - hx);
    var angs = [];
    for (var k = 0; k <= K; k++) angs.push(k * Math.PI / 2 / K);
    // replace nearest angle by the exact corner direction so a corner node exists
    var bi = 0, bd = 9;
    angs.forEach(function (a, i) { if (Math.abs(a - cornerAng) < bd) { bd = Math.abs(a - cornerAng); bi = i; } });
    angs[bi] = cornerAng;
    angs.forEach(function (a, k) {
      var ca = Math.cos(a), sa = Math.sin(a), tmax = 1e9;
      if (ca > 1e-6) tmax = Math.min(tmax, (x1 - hx) / ca);
      if (sa > 1e-6) tmax = Math.min(tmax, (y1 - hy) / sa);
      var row = [];
      radii.forEach(function (r) {
        if (r < tmax - 55) row.push(b.node(hx + ca * r, hy + sa * r)); else row.push(-1);
      });
      var end = b.node(hx + ca * tmax, hy + sa * tmax);
      ends.push(end); grid.push(row);
      var prev = hub;
      row.forEach(function (id) { if (id >= 0) { b.edge(prev, id); prev = id; } });
      b.edge(prev, end);
    });
    for (k = 0; k < K; k++) {
      for (var m = 0; m < radii.length; m++) {
        if (grid[k][m] >= 0 && grid[k + 1][m] >= 0) b.edge(grid[k][m], grid[k + 1][m]);
      }
      b.edge(ends[k], ends[k + 1]);
    }
    // corner anchor near TL
    var c = b.node(PLAY.x0 + 8, PLAY.y0 + 8);
    b.edge(c, hub);
    b.edge(c, grid[0][0]);
    b.edge(c, grid[K][0]);
    b.splitLong(MAXLEN);
    return b;
  }

  function level4() {
    var b = new Builder(), r = rng(4), wl, wr;
    var base = { cy: CY, rx: 205, ry: 305, spokes: 8, rings: [0.36, 0.68, 1], exps: [2, 2.4, 3.2], a0: 0, rand: r };
    function mk(cx) { var o = {}; for (var k in base) o[k] = base[k]; o.cx = cx; return orb(b, o); }
    wl = mk(PLAY.x0 + 210); wr = mk(PLAY.x1 - 210);
    // angles: k=0 -> 0deg (right), 1 -> 45 (down-right), 7 -> -45 (up-right); right web mirrored: 4 -> 180
    b.edge(wl.grid[2][0], wr.grid[2][4]);
    b.edge(wl.grid[2][1], wr.grid[2][3]);
    b.edge(wl.grid[2][7], wr.grid[2][5]);
    return b;
  }

  function level5() {
    var b = new Builder(), r = rng(3);
    var w = orb(b, { cx: CX + 4, cy: CY + 2, rx: 450, ry: 308, spokes: 11, rings: [0.28, 0.52, 0.76, 1],
      exps: [2, 2.3, 2.8, 3.6], a0: -Math.PI / 2, wobble: 0.1, rand: r });
    b.splitLong(MAXLEN);
    // bee: centroid of a cell in the upper part (between spokes 0 and 1, rings 2..3)
    var g = w.grid, ids = [g[2][0], g[2][1], g[3][0], g[3][1]], sx = 0, sy = 0;
    ids.forEach(function (i) { sx += b.nodes[i].x; sy += b.nodes[i].y; });
    b.bee = { x: Math.round(sx / 4 * 10) / 10, y: Math.round(sy / 4 * 10) / 10 };
    return b;
  }

  var NAMES = ['Kerti háló', 'Méhsejt', 'Gyémánt', 'Sarokháló', 'Ikerháló', 'A nagy háló'];
  var MAKERS = [level0, level1, level2, level3, level4, level5];

  function nearest(nodes, x, y, skip) {
    var best = -1, bd = 1e18;
    nodes.forEach(function (n, i) {
      if (skip && skip.indexOf(i) >= 0) return;
      var d = (n.x - x) * (n.x - x) + (n.y - y) * (n.y - y);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  function build(i) {
    var b = MAKERS[i]();
    var spiders = [];
    [[PLAY.x0, PLAY.y0], [PLAY.x1, PLAY.y0], [PLAY.x0, PLAY.y1], [PLAY.x1, PLAY.y1]].forEach(function (c) {
      spiders.push(nearest(b.nodes, c[0], c[1], spiders));
    });
    return {
      name: NAMES[i],
      nodes: b.nodes,
      edges: b.edges,
      playerStart: nearest(b.nodes, CX, CY),
      spiderStarts: spiders,
      bee: b.bee || null
    };
  }

  return { count: 6, build: build };
})();

// ===== audio.js =====
// Méh-mentés — audio: everything synthesised with WebAudio (no files, no libraries).
// Public API on MM.Audio (see ARCHITECTURE.md), plus pause()/resume()/toggleMusic()/toggleSfx().
var MM = window.MM = window.MM || {};

MM.Audio = (function () {
  var A = { musicOn: true, sfxOn: true };

  var ctx = null, master = null, comp = null, musicGain = null, sfxGain = null;
  var noiseBuf = null;
  var unlocked = false;

  // music state
  var wantTrack = null;      // last requested track name
  var playingName = null;    // track whose position `step` refers to
  var trk = null;            // per-track gain node (faded out on switch/stop)
  var timer = null;
  var paused = false;
  var step = 0;              // 8th-note step counter within the current track
  var nextTime = 0;

  var LOOKAHEAD = 0.13, TICK_MS = 25;
  var MUSIC_VOL = 0.55, SFX_VOL = 1.0;

  // ---------------------------------------------------------------- persistence
  function storeKey() {
    return ((MM.CFG && MM.CFG.STORAGE_KEY) || 'mehmentes.v1') + '.audio';
  }
  function load() {
    try {

      var e = level.edges[i], A = level.nodes[e.a], B = level.nodes[e.b];
      var dx = B.x - A.x, dy = B.y - A.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1e-9;
      e.len = len; e.ux = dx / len; e.uy = dy / len;
      level.adj[e.a].push({ node: e.b, edge: i });
      level.adj[e.b].push({ node: e.a, edge: i });
    }
    return level;
  };

  G.makeEntity = function (level, node) {
    var p = level.nodes[node];
    return { from: node, to: node, t: 0, x: p.x, y: p.y, dx: 0, dy: 0, moving: false, edge: -1, prev: -1 };
  };

  G.edgeBetween = function (level, a, b) {
    var l = level.adj[a];
    for (var i = 0; i < l.length; i++) if (l[i].node === b) return l[i].edge;
    return -1;
  };

  function place(level, ent) {
    var A = level.nodes[ent.from];
    if (ent.from === ent.to) { ent.x = A.x; ent.y = A.y; ent.moving = false; return; }
    ent.x = A.x + ent.dx * ent.t;
    ent.y = A.y + ent.dy * ent.t;
    ent.moving = true;
  }

  G.advance = function (level, ent, dist, chooseNext, onTravel) {
    var guard = 0;
    while (guard++ < 64) {
      if (ent.from === ent.to) {
        var nxt = chooseNext ? chooseNext(ent, ent.from, ent.prev) : -1;
        if (nxt === undefined || nxt === null || nxt < 0) break;
        var ei = G.edgeBetween(level, ent.from, nxt);
        if (ei < 0) break;
        var ed = level.edges[ei], sgn = (ed.a === ent.from) ? 1 : -1;
        ent.to = nxt; ent.t = 0; ent.edge = ei;
        ent.dx = ed.ux * sgn; ent.dy = ed.uy * sgn;
      }
      if (dist <= 0) break;
      var e = level.edges[ent.edge];
      var rem = e.len - ent.t;
      var step = dist < rem ? dist : rem;
      if (step > 0 && onTravel) {
        if (ent.from === e.a) onTravel(ent.edge, ent.t, ent.t + step);
        else onTravel(ent.edge, e.len - ent.t, e.len - ent.t - step);
      }
      ent.t += step; dist -= step;
      if (ent.t >= e.len - 1e-9) {
        ent.prev = ent.from; ent.from = ent.to; ent.t = 0;
      } else break;
    }
    place(level, ent);
  };

  G.reverse = function (level, ent) {
    if (ent.from === ent.to) return;
    var e = level.edges[ent.edge], f = ent.from;
    ent.from = ent.to; ent.to = f;
    ent.t = e.len - ent.t;
    ent.dx = -ent.dx; ent.dy = -ent.dy;
    place(level, ent);
  };

  G.distancesFrom = function (level, node) {
    var n = level.nodes.length, d = [], done = [], i;
    for (i = 0; i < n; i++) { d.push(Infinity); done.push(false); }
    d[node] = 0;
    for (var k = 0; k < n; k++) {
      var u = -1, best = Infinity;
      for (i = 0; i < n; i++) if (!done[i] && d[i] < best) { best = d[i]; u = i; }
      if (u < 0) break;
      done[u] = true;
      var l = level.adj[u];
      for (i = 0; i < l.length; i++) {
        var nd = best + level.edges[l[i].edge].len;
        if (nd < d[l[i].node]) d[l[i].node] = nd;
      }
    }
    return d;
  };

  G.nearestNode = function (level, ent) {
    return ent.from === ent.to ? ent.from : ent.to;
  };
})();

// Méh-mentés — keyboard input
(function () {
  var Input = MM.Input = { desired: { x: 0, y: 0 } };
  var held = {}, listeners = [];
  var DIRS = {
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    Numpad4: [-1, 0], Numpad6: [1, 0], Numpad8: [0, -1], Numpad2: [0, 1],
    Digit7: [-1, -1], Numpad7: [-1, -1], Digit9: [1, -1], Numpad9: [1, -1],
    Digit1: [-1, 1], Numpad1: [-1, 1], Digit3: [1, 1], Numpad3: [1, 1]
  };
  var DIGITS = { '1': 'Digit1', '3': 'Digit3', '7': 'Digit7', '9': 'Digit9' };
  var KEYMAP = { a: 'KeyA', d: 'KeyD', w: 'KeyW', s: 'KeyS', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
    ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ' ': 'Space', Enter: 'Enter', p: 'KeyP', m: 'KeyM', Escape: 'Escape' };
  for (var dk in DIGITS) KEYMAP[dk] = DIGITS[dk];

  function codeOf(e) {
    if (e.code) return e.code;
    var k = e.key; if (k && k.length === 1) k = k.toLowerCase();
    return KEYMAP[k] || k || '';
  }

  function recompute() {
    var x = 0, y = 0;
    for (var c in held) if (held[c]) { x += DIRS[c][0]; y += DIRS[c][1]; }
    var l = Math.sqrt(x * x + y * y);
    if (l > 0) { Input.desired = { x: x / l, y: y / l }; }   // else keep last value
  }

  // ----- pointer (mouse / touch) steering -----
  // pointer: target in logical coordinates; steer = pointer currently controls `desired`
  var pointer = Input.pointer = { down: false, pending: false, steer: false, x: 0, y: 0 };
  var MIN_DIST = 12;

  // Called every frame by the game (while playing) with the player's logical position.
  Input.update = function (px, py) {
    if (!pointer.steer || !(pointer.down || pointer.pending)) return;
    pointer.pending = false;
    var dx = pointer.x - px, dy = pointer.y - py, l = Math.sqrt(dx * dx + dy * dy);
    if (l <= MIN_DIST) return;
    Input.desired = { x: dx / l, y: dy / l };
  };

  // ----- stage: the game's own coordinate frame -----
  // In touch mode on a portrait viewport the whole stage (canvas + touch UI) is laid out as a landscape box of
  // size (innerHeight x innerWidth) and rotated 90deg clockwise around its top-left corner, then shifted right by
  // innerWidth: stage (sx, sy) -> client (iw - sy, sx). The top of the game ends up on the right screen edge.
  // Everything that reads pointer coordinates goes through Stage.toStage / Stage.canvasRect.
  var Stage = MM.Stage = { rotated: false, iw: 0, ih: 0, w: 0, h: 0, el: null };
  Stage.measure = function () {
    var iw = (typeof window !== 'undefined' && window.innerWidth) || MM.CFG.W, ih = (typeof window !== 'undefined' && window.innerHeight) || MM.CFG.H;
    var rot = !!(Input.touchMode && ih > iw);
    Stage.iw = iw; Stage.ih = ih; Stage.rotated = rot;
    Stage.w = rot ? ih : iw; Stage.h = rot ? iw : ih;
    if (MM.Touch) MM.Touch.rotated = rot;
    if (!Stage.el && typeof document !== 'undefined') Stage.el = document.getElementById('mm-stage');
    var st = Stage.el && Stage.el.style;
    if (st) {
      if (rot) {
        st.width = Stage.w + 'px'; st.height = Stage.h + 'px';
        st.transformOrigin = '0 0'; st.transform = 'translate(' + iw + 'px,0) rotate(90deg)';
      } else {
        st.width = '100%'; st.height = '100%'; st.transformOrigin = ''; st.transform = 'none';
      }
    }
    return rot;
  };
  // client (viewport) coordinates -> stage coordinates
  Stage.toStage = function (cx, cy) {
    return Stage.rotated ? { x: cy, y: Stage.iw - cx } : { x: cx, y: cy };
  };
  // the canvas rectangle in stage coordinates (layout based: unaffected by the CSS transform)
  Stage.canvasRect = function (canvas) {
    if (canvas && canvas.offsetWidth) return { left: canvas.offsetLeft, top: canvas.offsetTop, width: canvas.offsetWidth, height: canvas.offsetHeight };
    var r = canvas && canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: MM.CFG.W, height: MM.CFG.H };
    return { left: r.left, top: r.top, width: r.width, height: r.height };
  };

  function toLogical(canvas, e) {
    var r = Stage.canvasRect(canvas), s = Stage.toStage(e.clientX, e.clientY);
    var w = r.width || MM.CFG.W, h = r.height || MM.CFG.H;
    return { x: (s.x - r.left) * MM.CFG.W / w, y: (s.y - r.top) * MM.CFG.H / h };
  }
  function setTarget(canvas, e) {
    var p = toLogical(canvas, e);
    pointer.x = p.x; pointer.y = p.y;
  }

  // Touch mode flag (set by touch.js when a touch pointer / coarse pointer is detected).
  Input.touchMode = false;
  Input.setTouchMode = function (on) { Input.touchMode = !!on; };

  // Taps / clicks on the canvas in logical coordinates (menu buttons, overlays). fn(x, y, event)
  var tapListeners = [];
  Input.onTap = function (fn) { tapListeners.push(fn); };

  // Set the desired direction from another controller (touch pad). Acts like a key press:
  // it takes over from pointer steering. Zero vectors are ignored (keeps the last value).
  Input.setDesired = function (x, y, source) {
    var l = Math.sqrt(x * x + y * y);
    if (!(l > 0)) return;
    Input.desired = { x: x / l, y: y / l };
    pointer.steer = false; pointer.pending = false;
  };

  Input.initPointer = function (canvas) {
    if (!canvas || !canvas.addEventListener) return;
    if (canvas.style) canvas.style.touchAction = 'none';
    pointer.id = null;
    canvas.addEventListener('pointerdown', function (e) {
      if (e.preventDefault) e.preventDefault();
      var lp = toLogical(canvas, e);
      for (var i = 0; i < tapListeners.length; i++) { try { tapListeners[i](lp.x, lp.y, e); } catch (err) { console.error(err); } }
      if (!MM.Game || MM.Game.state !== 'playing') return;
      pointer.x = lp.x; pointer.y = lp.y;
      pointer.id = e.pointerId === undefined ? null : e.pointerId;
      pointer.down = true; pointer.pending = true; pointer.steer = true;
      try { if (canvas.setPointerCapture && e.pointerId !== undefined) canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    function mine(e) { return pointer.id === null || e.pointerId === undefined || e.pointerId === pointer.id; }
    canvas.addEventListener('pointermove', function (e) { if (pointer.down && mine(e)) setTarget(canvas, e); });
    function up(e) { if (mine(e)) { pointer.down = false; pointer.id = null; } }
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('lostpointercapture', up);
  };

  Input.clearDesired = function () { Input.desired = { x: 0, y: 0 }; pointer.pending = false; pointer.steer = false; };
  Input.onKey = function (fn) { listeners.push(fn); };

  function fire(code) {
    for (var i = 0; i < listeners.length; i++) { try { listeners[i](code); } catch (err) { console.error(err); } }
  }

  Input.init = function (canvas) {
    Input.initPointer(canvas);
    window.addEventListener('keydown', function (e) {
      var code = codeOf(e);
      if (DIRS[code] || code === 'Space' || code === 'Enter') { if (e.preventDefault) e.preventDefault(); }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (DIRS[code]) { held[code] = true; pointer.steer = false; pointer.pending = false; recompute(); }
      if (!e.repeat) fire(code);
    });
    window.addEventListener('keyup', function (e) {
      var code = codeOf(e);
      if (DIRS[code]) { held[code] = false; recompute(); }
    });
    window.addEventListener('blur', function () { held = {}; pointer.down = false; });
    window.addEventListener('contextmenu', function (e) { if (Input.touchMode && e.preventDefault) e.preventDefault(); });
  };
})();

// ===== game.js =====
// Méh-mentés — game state machine, player, rules
(function () {
  var CFG = MM.CFG, G = MM.Graph, EV = MM.Events;

  function newFx() { return { slow: 0, freeze: 0, speed: 0, honey: 0, double: 0, shield: false }; }

  var Game = MM.Game = {
    state: 'menu', stateTime: 0, startDifficulty: 1, levelIndex: 0,
    level: null, edges: [], doneCount: 0,
    player: null, spiders: [], boosts: [], fx: newFx(),
    score: 0, lives: CFG.LIVES, hiScore: 0, levelTime: 0,
    lastBonus: { time: 0, lives: 0, skipped: false }
  };

  // ---------- persistence ----------
  function readStore() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(CFG.STORAGE_KEY);
      var o = raw ? JSON.parse(raw) : null;
      return (o && typeof o === 'object') ? o : {};
    } catch (e) { return {}; }
  }
  function saveHi() {
    try {
      var o = readStore(); o.hiScore = Game.hiScore;
      window.localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify(o));
    } catch (e) { /* ignore */ }
  }

  function setState(s) {
    Game.state = s; Game.stateTime = 0;
    if (s === 'ready' && MM.Input) MM.Input.clearDesired();
  }

  // ---------- scoring ----------
  function bump(points) {
    Game.score += points;
    if (Game.score > Game.hiScore) { Game.hiScore = Game.score; saveHi(); }
  }
  Game.addScore = function (points, x, y) {
    if (Game.fx.double > 0) points *= 2;
    bump(points);
    EV.emit('score', { points: points, x: x, y: y });
    return points;
  };

  // ---------- spiders helpers ----------
  Game.setSetup = function () {
    var d = MM.clamp(Math.round(Game.startDifficulty || 1), 1, 5);
    return { kinds: CFG.SETUPS[d].slice(), mult: 1 + CFG.LEVEL_SPEEDUP * Game.levelIndex };
  };
  Game.spiderSpeed = function (s) {
    if (Game.fx.freeze > 0) return 0;
    return s.baseSpeed * Game.setSetup().mult * (Game.fx.slow > 0 ? CFG.SLOW_FACTOR : 1);
  };

  // ---------- level handling ----------
  function loadLevel(i) {
    Game.levelIndex = i;
    Game.level = G.prepare(MM.Levels.build(i));
    Game.edges = [];
    for (var k = 0; k < Game.level.edges.length; k++) Game.edges.push({ covA: 0, covB: 0, done: false });
    Game.doneCount = 0;
    Game.levelTime = 0;
    var p = G.makeEntity(Game.level, Game.level.playerStart);
    p.speed = CFG.PLAYER_SPEED; p.angle = 0; p.mouth = 0;
    Game.player = p;
    Game.spiders = []; Game.boosts = []; Game.fx = newFx();
  }

  function startLevel(i) {
    loadLevel(i);
    MM.Spiders.spawn(Game);
    MM.Boosts.reset(Game);
    setState('ready');
    EV.emit('levelStart', { index: i });
  }

  function resetAfterDeath() {
    var p = Game.player, n = Game.level.playerStart, np = Game.level.nodes[n];
    p.from = n; p.to = n; p.t = 0; p.x = np.x; p.y = np.y; p.dx = 0; p.dy = 0; p.moving = false; p.edge = -1; p.prev = -1;
    MM.Spiders.resetPositions(Game);
    Game.boosts = [];
    MM.Boosts.reset(Game);
    setState('ready');
  }

  Game.init = function () {
    Game.hiScore = Number(readStore().hiScore) || 0;
    Game.startDifficulty = 1; Game.score = 0; Game.lives = CFG.LIVES;
    if (MM.Levels) loadLevel(0);   // backdrop for the menu
    setState('menu');
  };

  Game.toMenu = function () {
    if (MM.Levels) loadLevel(0);
    setState('menu');
  };

  Game.newGame = function (d) {
    Game.startDifficulty = MM.clamp(Math.round(d || 1), 1, 5);
    Game.score = 0; Game.lives = CFG.LIVES;
    startLevel(0);
  };

  Game.togglePause = function () {
    if (Game.state === 'playing') setState('paused');
    else if (Game.state === 'paused') setState('playing');
  };

  Game.timeBonusNow = function () {
    if (!Game.level) return 0;
    var sum = 0, es = Game.level.edges;
    for (var i = 0; i < es.length; i++) sum += es[i].len || 0;
    var t0 = sum / CFG.PLAYER_SPEED, t = Game.levelTime;
    var full = CFG.TIME_BONUS_FULL * t0, zero = CFG.TIME_BONUS_ZERO * t0;
    if (t <= full) return CFG.TIME_BONUS_MAX;
    if (t >= zero) return 0;
    return Math.max(0, Math.round(CFG.TIME_BONUS_MAX * (zero - t) / (zero - full)));
  };

  Game.completeLevel = function (skipped) {
    if (Game.state === 'levelDone') return;
    var i, timeB = 0;
    if (skipped) {
      for (i = 0; i < Game.edges.length; i++) {
        var e = Game.edges[i];
        if (!e.done) { e.done = true; e.covA = Game.level.edges[i].len; e.covB = Game.level.edges[i].len; }
      }
      Game.doneCount = Game.edges.length;
    } else {
      timeB = Game.timeBonusNow();
    }
    var lifeB = Game.lives * CFG.SCORE_LIFE_BONUS;
    Game.lastBonus = { time: timeB, lives: lifeB, skipped: !!skipped };
    bump(timeB + lifeB);
    setState('levelDone');
    EV.emit('levelDone', { index: Game.levelIndex, skipped: !!skipped });
  };

  // ---------- player ----------
  // Pure chooser (also used by test/turn_check.js).
  // node: node reached/rested at; prev: node we came from (-1 if resting);
  // desired: {x,y}; travelDir: {x,y} of the strand just travelled, or null when resting.
  function chooseFor(node, prev, desired, travelDir, level) {
    level = level || Game.level;
    var l = level.adj[node], i, e, s, dot;
    var best = -1, bestDot = -2, back = -1, backDot = -2, follow = -1, followDot = -2;
    var d = desired || { x: 0, y: 0 };
    var hasD = !!(d.x || d.y);
    var resting = !travelDir || prev < 0;
    for (i = 0; i < l.length; i++) {
      e = level.edges[l[i].edge]; s = (e.a === node) ? 1 : -1;
      var ux = e.ux * s, uy = e.uy * s;
      dot = hasD ? d.x * ux + d.y * uy : -2;
      if (!resting && l[i].node === prev) { back = l[i].node; backDot = dot; continue; }
      if (dot > bestDot) { bestDot = dot; best = l[i].node; }
      if (!resting) {
        var fd = travelDir.x * ux + travelDir.y * uy;
        if (fd > followDot) { followDot = fd; follow = l[i].node; }
      }
    }
    if (hasD) {
      if (back >= 0) {
        if (backDot >= CFG.REVERSE_DOT && backDot >= bestDot) return back;
        if (backDot >= CFG.TURN_DOT && backDot > bestDot + 0.3) return back;
      }
      if (best >= 0 && bestDot >= CFG.TURN_DOT) return best;
    }
    if (!resting && follow >= 0 && followDot >= CFG.STRAIGHT_DOT) return follow;
    return -1;
  }
  Game._chooseFor = chooseFor;

  var restFlag = false;
  function chooseNext(ent, node, prev) {
    var resting = restFlag; restFlag = false;
    var d = MM.Input ? MM.Input.desired : { x: 0, y: 0 };
    var td = (!resting && ent.prev >= 0 && ent.edge >= 0) ? { x: ent.dx, y: ent.dy } : null;
    return chooseFor(node, resting ? -1 : prev, d, td);
  }

  function onTravel(ei, s0, s1) {
    var st = Game.edges[ei];
    if (st.done) return;
    var len = Game.level.edges[ei].len;
    // a piece only extends coverage when it is contiguous with the already coloured part
    // from the end it started at (retracing a coloured part adds nothing)
    if (s1 >= s0) { if (s0 <= st.covA + 1e-4 && s1 > st.covA) st.covA = s1; }               // a -> b
    else if (s0 >= len - st.covB - 1e-4) { var c = len - s1; if (c > st.covB) st.covB = c; } // b -> a
    if (st.covA > len) st.covA = len;
    if (st.covB > len) st.covB = len;
    if (st.covA + st.covB >= len - 6) {   // small tolerance so a sliver never stays uncoloured
      st.covA = len; st.covB = len; st.done = true;
      Game.doneCount++;
      EV.emit('edgeDone', { edge: ei });
      Game.addScore(CFG.SCORE_EDGE, Game.player.x, Game.player.y);
    }
  }

  function movePlayer(dt) {
    var p = Game.player;
    if (MM.Input && MM.Input.update) MM.Input.update(p.x, p.y);
    var d = MM.Input ? MM.Input.desired : { x: 0, y: 0 };
    restFlag = (p.from === p.to);
    if (p.from !== p.to && (d.x || d.y) && d.x * p.dx + d.y * p.dy <= -CFG.REVERSE_DOT) G.reverse(Game.level, p);
    var spd = p.speed * (Game.fx.speed > 0 ? CFG.SPEED_FACTOR : 1);
    G.advance(Game.level, p, spd * dt, chooseNext, onTravel);
    if (p.moving) {
      p.angle = Math.atan2(p.dy, p.dx);
      p.mouth = (p.mouth + dt * 3) % 1;
    }
  }

  // ---------- collisions ----------
  function collisions() {
    var p = Game.player, fx = Game.fx;
    for (var i = 0; i < Game.spiders.length; i++) {
      var s = Game.spiders[i];
      if (s.mode !== 'chase') continue;
      var dx = s.x - p.x, dy = s.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) >= CFG.HIT_DIST) continue;
      if (fx.honey > 0) {
        s.mode = 'eaten'; s.respawn = CFG.SPIDER_RESPAWN;
        EV.emit('spiderEaten', { x: s.x, y: s.y, kind: s.kind });
        Game.addScore(CFG.SCORE_SPIDER, s.x, s.y);
      } else if (fx.shield) {
        fx.shield = false;
        // knock the spider off the web: out of play (falls off the screen) until it respawns, no score
        var kl = Math.sqrt(dx * dx + dy * dy), kx = 0, ky = -1;
        if (kl > 1e-3) { kx = dx / kl; ky = dy / kl; }
        s.mode = 'eaten'; s.respawn = CFG.SHIELD_RESPAWN;
        EV.emit('shieldBreak', { x: p.x, y: p.y, kind: s.kind, dx: kx, dy: ky });
      } else {
        EV.emit('hit', { x: p.x, y: p.y });
        setState('dying');
        return;
      }
    }
  }

  // ---------- main update ----------
  Game.update = function (dt) {
    Game.stateTime += dt;
    var st = Game.state;
    if (st === 'ready') {
      if (Game.stateTime >= CFG.READY_TIME) setState('playing');
    } else if (st === 'playing') {
      Game.levelTime += dt;
      movePlayer(dt);
      MM.Spiders.update(Game, dt);
      MM.Boosts.update(Game, dt);
      collisions();
      if (Game.state === 'playing' && Game.doneCount >= Game.edges.length) Game.completeLevel(false);
    } else if (st === 'dying') {
      if (Game.stateTime >= CFG.DYING_TIME) {
        Game.lives--;
        if (Game.lives <= 0) {
          Game.lives = 0; saveHi(); setState('gameOver'); EV.emit('gameOver', {});
        } else resetAfterDeath();
      }
    } else if (st === 'levelDone') {
      if (Game.stateTime >= CFG.LEVEL_DONE_TIME) {
        if (Game.levelIndex + 1 < MM.Levels.count) startLevel(Game.levelIndex + 1);
        else { setState('beeRescue'); EV.emit('beeFree', {}); }
      }
    } else if (st === 'beeRescue') {
      if (Game.stateTime >= CFG.BEE_TIME) { saveHi(); setState('win'); EV.emit('win', {}); }
    }
  };
})();

// ===== spiders.js =====
// Méh-mentés — spider spawn + AI
(function () {
  var CFG = MM.CFG, G = MM.Graph;

  var REVERSE_CHECK = 0.4;   // s between mid-edge reverse checks per spider
  var NEAR_TIE = 60;         // px: "similar distance" window for avoiding other spiders' targets
  var HOME_SAFE = 150;       // px: respawn at home only if the player is farther than this

  function placeAt(game, s, node) {
    var p = game.level.nodes[node];
    s.from = s.to = node; s.t = 0; s.x = p.x; s.y = p.y; s.dx = 0; s.dy = 0;
    s.moving = false; s.edge = -1; s.prev = -1;
  }

  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  // ---- per-update context (module level so chooseNext needs no per-call closures) ----
  var ctx = { game: null, level: null, cache: null, spider: null, flee: false, target: 0 };

  function distsTo(node) {
    var c = ctx.cache;
    return c[node] || (c[node] = G.distancesFrom(ctx.level, node));
  }

  // node beyond the player's destination in the direction of travel (or the same target)
  function aheadTarget(player, level) {
    var to = G.nearestNode(level, player);
    if (player.from === player.to) return to;
    var l = level.adj[to], best = -1, bestDot = -2;
    for (var i = 0; i < l.length; i++) {
      if (l[i].node === player.from && l.length > 1) continue;
      var e = level.edges[l[i].edge], sg = (e.a === to) ? 1 : -1;
      var dot = e.ux * sg * player.dx + e.uy * sg * player.dy;
      if (dot > bestDot) { bestDot = dot; best = l[i].node; }
    }
    return best >= 0 ? best : to;
  }

  function claimedByOther(game, self, node) {
    for (var i = 0; i < game.spiders.length; i++) {
      var o = game.spiders[i];
      if (o === self || o.mode !== 'chase') continue;
      if (o.from !== o.to && o.to === node) return true;
    }
    return false;
  }

  function chooseNext(s, node, came) {
    var level = ctx.level, adj = level.adj[node], i, cand = [];
    for (i = 0; i < adj.length; i++) {
      if (adj[i].node === came && adj.length > 1) continue;
      cand.push(adj[i].node);
    }
    if (!cand.length) return -1;
    if (cand.length === 1) return cand[0];

    if (!ctx.flee && Math.random() < CFG.SPIDER_RANDOM[s.kind]) {
      return cand[Math.floor(Math.random() * cand.length)];
    }

    var d = distsTo(ctx.target), edges = level.edges;
    // cost of going to neighbour n = edge length + distance from n to the target
    var scored = [];
    for (i = 0; i < cand.length; i++) {
      var n = cand[i], el = edges[G.edgeBetween(level, node, n)].len;
      scored.push({ n: n, c: ctx.flee ? -(d[n]) : el + d[n] });
    }
    scored.sort(function (a, b) { return a.c - b.c; });
    if (ctx.flee) return scored[0].n;
    var best = scored[0];
    if (claimedByOther(ctx.game, s, best.n)) {
      for (i = 1; i < scored.length; i++) {
        if (scored[i].c - best.c > NEAR_TIE) break;
        if (!claimedByOther(ctx.game, s, scored[i].n)) return scored[i].n;
      }
    }
    return best.n;
  }

  // Mid-edge reversal: is the player on this spider's edge, behind it?
  function playerBehind(game, s) {
    var p = game.player, level = game.level;
    if (s.from === s.to) return false;
    var e = level.edges[s.edge], sg = (s.from === e.a) ? 1 : -1;
    var sPos = (s.from === e.a) ? s.t : e.len - s.t;   // measured from a
    var pPos;
    if (p.from === p.to) {
      if (p.from === e.a) pPos = 0; else if (p.from === e.b) pPos = e.len; else return false;
    } else if (p.edge === s.edge) {
      pPos = (p.from === e.a) ? p.t : e.len - p.t;
    } else return false;
    return (pPos - sPos) * sg < -1;
  }

  MM.Spiders = {
    spawn: function (game) {
      var setup = game.setSetup(), starts = game.level.spiderStarts.slice(), i, j, t;
      for (i = starts.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = starts[i]; starts[i] = starts[j]; starts[j] = t; }
      game.spiders = [];
      for (i = 0; i < setup.kinds.length; i++) {
        var home = starts[i % starts.length];
        var s = G.makeEntity(game.level, home);
        s.kind = setup.kinds[i]; s.baseSpeed = CFG.SPIDER_SPEED[s.kind]; s.home = home;
        s.mode = 'chase'; s.respawn = 0; s.legPhase = 0; s.revTimer = Math.random() * REVERSE_CHECK;
        game.spiders.push(s);
      }
    },

    resetPositions: function (game) {
      for (var i = 0; i < game.spiders.length; i++) {
        var s = game.spiders[i];
        placeAt(game, s, s.home); s.mode = 'chase'; s.respawn = 0; s.revTimer = Math.random() * REVERSE_CHECK;
      }
    },

    update: function (game, dt) {
      var level = game.level, player = game.player, spiders = game.spiders, i, s;
      if (!level || !player) return;
      ctx.game = game; ctx.level = level; ctx.cache = {};
      var flee = game.fx.honey > 0;
      ctx.flee = flee;
      var playerNode = G.nearestNode(level, player);

      for (i = 0; i < spiders.length; i++) {
        s = spiders[i];

        if (s.mode === 'eaten') {
          s.respawn -= dt;
          if (s.respawn <= 0) {
            var node = s.home, pn = level.nodes[node];
            if (dist2(pn.x, pn.y, player.x, player.y) < HOME_SAFE) {
              var starts = level.spiderStarts, far = -1, bd = -1;
              for (var k = 0; k < starts.length; k++) {
                var q = level.nodes[starts[k]], dd = dist2(q.x, q.y, player.x, player.y);
                if (dd > bd) { bd = dd; far = starts[k]; }
              }
              if (far >= 0) node = far;
            }
            placeAt(game, s, node); s.mode = 'chase'; s.respawn = 0;
          }
          continue;
        }
        if (s.mode !== 'chase') continue;

        var spd = MM.Game.spiderSpeed(s);
        if (spd <= 0) continue;
        if (flee) spd *= CFG.SCARED_FACTOR;

        // target selection (second spider pincers when the player is moving)
        ctx.spider = s;
        ctx.target = (!flee && i === 1 && spiders.length > 1) ? aheadTarget(player, level) : playerNode;

        // occasional mid-edge reversal toward a player behind us (fast spiders only)
        s.revTimer = (s.revTimer || 0) - dt;
        if (s.revTimer <= 0) {
          s.revTimer = REVERSE_CHECK;
          if (!flee && s.kind === 'fast' && playerBehind(game, s)) G.reverse(level, s);
        }

        var before = s.legPhase;
        var step = spd * dt;
        G.advance(level, s, step, chooseNext, null);
        s.legPhase = before + step;
      }
    }
  };
})();

// ===== boosts.js =====
// Méh-mentés — boost spawn, pickup, effects
(function () {
  var CFG = MM.CFG, EV = MM.Events;
  var TIMED = ['slow', 'freeze', 'speed', 'honey', 'double'];
  var MIN_PLAYER = 140, MIN_SPIDER = 90;

  function nextInterval() { return MM.rand(CFG.BOOST_INTERVAL[0], CFG.BOOST_INTERVAL[1]); }

  function ensureFx(game) {
    if (!game.fx) game.fx = {};
    var fx = game.fx;
    for (var i = 0; i < TIMED.length; i++) fx[TIMED[i]] = 0;
    fx.shield = false;
  }

  function dist(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function pickNode(game) {
    var nodes = game.level.nodes, ok = [], i, j;
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (dist(n.x, n.y, game.player.x, game.player.y) < MIN_PLAYER) continue;
      var bad = false;
      for (j = 0; j < game.spiders.length && !bad; j++) {
        if (dist(n.x, n.y, game.spiders[j].x, game.spiders[j].y) < MIN_SPIDER) bad = true;
      }
      for (j = 0; j < game.boosts.length && !bad; j++) {
        if (game.boosts[j].node === i) bad = true;
      }
      if (!bad) ok.push(i);
    }
    return ok.length ? ok[Math.floor(Math.random() * ok.length)] : -1;
  }

  function pickType(game) {
    var types = [], weights = [], total = 0, k, j;
    var lastLevel = game.levelIndex === MM.Levels.count - 1;
    var doneFrac = game.edges.length ? game.doneCount / game.edges.length : 0;
    for (k in CFG.BOOSTS) {
      if (!Object.prototype.hasOwnProperty.call(CFG.BOOSTS, k)) continue;
      if (k === 'skip' && (lastLevel || doneFrac > 0.7)) continue;
      if (k === 'life' && game.lives >= CFG.MAX_LIVES) continue;
      if (k === 'shield' && game.fx.shield) continue;
      types.push(k); weights.push(CFG.BOOSTS[k].weight);
    }
    // avoid duplicates of types already on the web (unless that leaves nothing)
    var fresh = [], fw = [];
    for (j = 0; j < types.length; j++) {
      var onWeb = false;
      for (var b = 0; b < game.boosts.length; b++) if (game.boosts[b].type === types[j]) onWeb = true;
      if (!onWeb) { fresh.push(types[j]); fw.push(weights[j]); }
    }
    if (fresh.length) { types = fresh; weights = fw; }
    if (!types.length) return null;
    for (j = 0; j < weights.length; j++) total += weights[j];
    var r = Math.random() * total;
    for (j = 0; j < types.length; j++) {
      r -= weights[j];
      if (r < 0) return types[j];
    }
    return types[types.length - 1];
  }

  function spawn(game) {
    var node = pickNode(game);
    if (node < 0) return false;
    var type = pickType(game);
    if (!type) return false;
    var p = game.level.nodes[node];
    var boost = { type: type, x: p.x, y: p.y, node: node, ttl: CFG.BOOST_TTL, age: 0 };
    game.boosts.push(boost);
    EV.emit('boostSpawn', { boost: boost });
    return true;
  }

  MM.Boosts = {
    reset: function (game) {
      game.boosts = [];
      ensureFx(game);
      game.boostTimer = CFG.BOOST_FIRST;
    },

    update: function (game, dt) {
      var fx = game.fx, i;
      for (i = 0; i < TIMED.length; i++) {
        var k = TIMED[i];
        if (fx[k] > 0) { fx[k] -= dt; if (fx[k] < 0) fx[k] = 0; }
      }

      // age + expire
      var keep = [];
      for (i = 0; i < game.boosts.length; i++) {
        var b = game.boosts[i];
        b.age += dt; b.ttl -= dt;
        if (b.ttl <= 0) { b.ttl = 0; EV.emit('boostExpire', { boost: b }); }
        else keep.push(b);
      }
      game.boosts = keep;

      // spawn
      if (game.boostTimer === undefined) game.boostTimer = CFG.BOOST_FIRST;
      game.boostTimer -= dt;
      if (game.boostTimer <= 0) {
        if (game.boosts.length < CFG.BOOST_MAX) {
          game.boostTimer = spawn(game) ? nextInterval() : 1;   // no valid spot: retry soon
        } else {
          game.boostTimer = 1;   // web full: check again shortly
        }
      }

      // pickup (snapshot: completeLevel may clear game.boosts)
      var list = game.boosts.slice(), p = game.player;
      for (i = 0; i < list.length; i++) {
        var bo = list[i];
        if (dist(bo.x, bo.y, p.x, p.y) >= CFG.PICKUP_DIST) continue;
        var idx = game.boosts.indexOf(bo);
        if (idx < 0) continue;
        game.boosts.splice(idx, 1);
        MM.Boosts.apply(game, bo.type);
        game.addScore(CFG.SCORE_BOOST, bo.x, bo.y);
        EV.emit('boostPickup', { type: bo.type, x: bo.x, y: bo.y });
        if (game.state !== 'playing') break;   // e.g. skip finished the level
      }
    },

    apply: function (game, type) {
      var def = CFG.BOOSTS[type];
      if (!def) return;
      if (TIMED.indexOf(type) >= 0) game.fx[type] = def.dur;
      else if (type === 'shield') game.fx.shield = true;
      else if (type === 'life') game.lives = Math.min(CFG.MAX_LIVES, game.lives + 1);
      else if (type === 'skip') game.completeLevel(true);
    }
  };
})();

  // ------------------------------------------------------------------ untouched web (cached)
  function buildWeb(level) {
    var cv = mk(W * S, H * S), g = cv.getContext('2d');

    path(); g.strokeStyle = 'rgba(30,45,75,0.55)'; g.lineWidth = 5; g.stroke();

    for (i = 0; i < E.length; i++) {

  // ------------------------------------------------------------------ particles

  function updateParticles(dt) {
    var j = 0, i, p;
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; p.life -= dt;
      if (p.life <= 0) continue;
      p.vy += p.g * dt;
      if (p.drag) { var d = Math.max(0, 1 - p.drag * dt); p.vx *= d; if (p.type !== 'confetti') p.vy *= d; }
      if (p.type === 'confetti') { p.sway += dt * 3; p.x += Math.sin(p.sway) * 30 * dt; }

    for (i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; if (texts[i].life <= 0) texts.splice(i, 1); }
    for (i = labels.length - 1; i >= 0; i--) { labels[i].life -= dt; if (labels[i].life <= 0) labels.splice(i, 1); }

  // ------------------------------------------------------------------ web colouring
  function hueAt(th, x, y) {
    return th.hue + th.span * ((x - 30) / 900 * 0.65 + (y - 80) / 620 * 0.35) + T * 22;
  }
  var NB = 24, buckets = [];
  for (var bi = 0; bi < NB; bi++) buckets.push([]);
  // adds a coloured segment, split in short pieces, to hue buckets (batched strokes are much cheaper
  // than one gradient stroke per edge)
  function addSeg(th, x0, y0, x1, y1) {
    var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.5) return;
    var n = Math.max(1, Math.ceil(len / 34)), i;
    for (i = 0; i < n; i++) {
      var ax = x0 + dx * i / n, ay = y0 + dy * i / n, bx = x0 + dx * (i + 1) / n, by = y0 + dy * (i + 1) / n;
      var h = hueAt(th, (ax + bx) / 2, (ay + by) / 2);
      var k = Math.floor((((h % 360) + 360) % 360) / (360 / NB)) % NB;
      var arr = buckets[k]; arr.push(ax, ay, bx, by);
    }
  }
  function flushBuckets(g, boost) {
    for (var k = 0; k < NB; k++) {

      g.beginPath();
      for (var i = 0; i < arr.length; i += 4) { g.moveTo(arr[i], arr[i + 1]); g.lineTo(arr[i + 2], arr[i + 3]); }
      g.strokeStyle = hsl((k + 0.5) * (360 / NB), 96, 56);

      g.globalAlpha = 1; g.lineWidth = 6 + boost * 0.3; g.stroke();

  function drawColoured(g, game, th) {
    var L = game.level, E = L.edges, N = L.nodes, st = game.edges || [], i, n = E.length;
    var any = false;
    if (nodeFlag.length !== N.length) nodeFlag = new Array(N.length);
    for (i = 0; i < N.length; i++) nodeFlag[i] = 0;
    g.lineCap = 'round';

    // pass 1: coloured strokes

      if (s.done) { ca = e.len; cb = 0; }
      if (ca > 0.2) {

        if (s.done) nodeFlag[e.b] = 1;
      }
      if (cb > 0.2) {

        addSeg(th, B.x, B.y, B.x - e.ux * cb, B.y - e.uy * cb);
      }

    // pass 2: highlight on top (one batched path)
    g.beginPath();
    for (i = 0; i < n && i < st.length; i++) {

    else if (code === 'ArrowRight' || code === 'KeyD') next = selected + 1;
    else if (code === 'Enter' || code === 'Space') {
      MM.Events.emit('menuSelect', {});
      MM.Game.newGame(selected);
      return;
    } else return;

    next = clamp(next, 1, 5);
    if (next !== selected) {
      selected = next;
      MM.Events.emit('menuMove', {});
    }
    g.startDifficulty = selected;
  }

  function onKey(code) {
    var g = MM.Game;
    if (!g) return;

    // sound toggles work in every state
    if (code === 'KeyM') { if (MM.Audio) MM.Audio.toggleMusic(); return; }
    if (code === 'KeyN') { if (MM.Audio) MM.Audio.toggleSfx(); return; }

    if (g.state === 'menu') { menuKey(code, g); return; }

    if (g.state === 'win' || g.state === 'gameOver') {
      if ((code === 'Enter' || code === 'Space') && num(g.stateTime) > 1) g.toMenu();
      return;
    }

    if (code === 'KeyP' || code === 'Escape') g.togglePause();
  }

  // ---------- taps / clicks (logical coordinates) ----------

  function changeDifficulty(next, g) {
    next = clamp(next, 1, 5);
    if (next !== selected) {
      selected = next;
      MM.Events.emit('menuMove', {});
    }
    g.startDifficulty = selected;
  }

  function onTap(x, y) {
    var g = MM.Game;
    if (!g) return;
    if (g.state === 'menu') {
      // difficulty row: left half = previous, right half = next (generous boxes)
      if (y >= 200 && y <= 268 && x >= W / 2 - 260 && x <= W / 2 + 260) {
        changeDifficulty(selected + (x < W / 2 ? -1 : 1), g);
        return;
      }
      // the 5 dots
      if (y >= 288 && y <= 334) {
        for (var i = 1; i <= 5; i++) {
          if (Math.abs(x - (W / 2 + (i - 3) * 32)) <= 16) { changeDifficulty(i, g); return; }
        }
        return;
      }
      // start button
      if (Math.abs(x - W / 2) <= START_W / 2 + 10 && Math.abs(y - START_Y) <= START_H / 2 + 14) {
        MM.Events.emit('menuSelect', {});
        g.startDifficulty = selected;
        g.newGame(selected);
      }
      return;
    }
    if (g.state === 'win' || g.state === 'gameOver') {
      if (num(g.stateTime) > 1) g.toMenu();
      return;
    }
    if (g.state === 'paused') g.togglePause();
  }

  // ---------- public API ----------

  MM.UI = {
    init: function () {
      if (inited) return;
      inited = true;
      MM.Input.onKey(onKey);
      if (MM.Input.onTap) MM.Input.onTap(onTap);
    },

    draw: function (ctx, g, dt) {
      if (!g) return;
      if (isFinite(dt) && dt > 0 && dt < 1) T += dt;

      ctx.save();
      try {
        var st = g.state;
        if (st === 'menu') { drawMenu(ctx, g); return; }

        drawHUD(ctx, g);
        if (st === 'ready') drawReady(ctx, g);
        else if (st === 'paused') drawPaused(ctx);
        else if (st === 'dying') drawDying(ctx, g);
        else if (st === 'levelDone') drawLevelDone(ctx, g);
        else if (st === 'beeRescue') drawBeeRescue(ctx, g);
        else if (st === 'win') drawWin(ctx, g);
        else if (st === 'gameOver') drawGameOver(ctx, g);
      } finally {
        ctx.restore();
      }
    }
  };
})();

      // buttons: row at the top right, just below the HUD strip
      var k = r.height / CFG.H;
      place(btnBox, Math.max(0, r.right - 8 - 224), r.top + (CFG.HUD_H + 4) * k, 224, 48);
    }
    if (inAppBanner) {   // bottom edge of the canvas, never over the side bars (pad / buttons)
      inAppBanner.style.left = (r.left + 4) + 'px'; inAppBanner.style.width = Math.max(120, r.width - 8) + 'px';
      inAppBanner.style.bottom = Math.max(0, ih - r.bottom + 4) + 'px';
    }
    disc.style.width = disc.style.height = D + 'px';
    knob.style.width = knob.style.height = KD + 'px';
    zoneRect = { left: zl, top: zt, width: zw, height: zh };
    paintPad();
  };

  // Called every frame by main.js (cheap): syncs button state and the portrait pause.
  Touch.update = function () {
    if (!root || !Touch.active) return;
    var g = MM.Game, st = g ? g.state : 'menu';
    var A = MM.Audio || {};
    Touch.inApp = detectInApp();
    var showTip = Touch.inApp && !inAppDismissed && st === 'menu';
    if (inAppBanner) inAppBanner.style.display = showTip ? 'flex' : 'none';
    var s = [st === 'paused' ? 'p' : 'r', (st === 'playing' || st === 'paused') ? 1 : 0, A.musicOn ? 1 : 0, A.sfxOn ? 1 : 0].join();
    if (s === cache.s) return;
    cache.s = s;
    btn.pause.innerHTML = st === 'paused' ? ICON.play : ICON.pause;
    btn.pause.classList.toggle('dim', !(st === 'playing' || st === 'paused'));
    btn.music.classList.toggle('off', !A.musicOn);
    btn.sound.classList.toggle('off', !A.sfxOn);
  };

  Touch.setActive = function (on) {
    on = !!on;
    if (Touch.active === on || !root) return;
    Touch.active = on;
    if (MM.Input && MM.Input.setTouchMode) MM.Input.setTouchMode(on);
    root.style.display = on ? 'block' : 'none';
    cache.s = null;
    if (MM.resize) MM.resize(); else Touch.layout();   // the stage may need to rotate / un-rotate
    Touch.update();
  };

  Touch.setSide = function (side) {
    Touch.padSide = side === 'right' ? 'right' : 'left';
    storeSet(Touch.padSide);
    if (pad.active) { pad.active = false; pad.id = null; zone.classList.remove('active'); }
    Touch.layout();
  };

  Touch.init = function (cv) {
    if (root || typeof document === 'undefined' || !document.body) return;
    canvas = cv;
    root = el('div', '', document.getElementById('mm-stage') || document.body);
    root.id = 'mm-touch';
    root.style.display = 'none';

    zone = el('div', '', root); zone.id = 'mm-pad';
    disc = el('div', '', zone); disc.id = 'mm-pad-disc';
    knob = el('div', '', zone); knob.id = 'mm-pad-knob';
    swapBtn = makeButton('swap', ICON.swap, 'Irányító folt áthelyezése', zone, function () {
      Touch.setSide(Touch.padSide === 'left' ? 'right' : 'left');
    });
    swapBtn.className += ' small';

    btnBox = el('div', '', root); btnBox.id = 'mm-btns';
    makeButton('pause', ICON.pause, 'Szünet', btnBox, function () { if (MM.Game) MM.Game.togglePause(); });
    makeButton('music', ICON.music, 'Zene', btnBox, function () { if (MM.Audio && MM.Audio.toggleMusic) MM.Audio.toggleMusic(); });
    makeButton('sound', ICON.sound, 'Hangok', btnBox, function () { if (MM.Audio && MM.Audio.toggleSfx) MM.Audio.toggleSfx(); });
    makeButton('full', ICON.full, 'Teljes képernyő', btnBox, toggleFullscreen);
    if (!fsFn()) btn.full.style.display = 'none';

    hint = el('div', '', root);
    hint.id = 'mm-hint';
    hint.innerHTML = '<svg class="phone" viewBox="0 0 80 120" width="26" height="39" aria-hidden="true">' +
      '<rect x="8" y="4" width="64" height="112" rx="12" fill="#fff" stroke="#1d2b4a" stroke-width="5"/>' +
      '<rect x="16" y="18" width="48" height="80" rx="4" fill="#ffd21f"/><circle cx="40" cy="107" r="4" fill="#1d2b4a"/></svg>' +
      '<span class="txt">Fordítsd el a telefont</span>';

    inAppBanner = el('div', '', root);
    inAppBanner.id = 'mm-inapp';
    inAppBanner.style.display = 'none';
    el('span', 'txt', inAppBanner, 'Nagyobb képhez nyisd meg külső böngészőben: ⋯ menü → Megnyitás külső böngészőben');
    var xb = el('div', 'x', inAppBanner, '×');
    xb.id = 'mm-inapp-x';
    xb.setAttribute('role', 'button'); xb.setAttribute('aria-label', 'Bezárás');
    xb.addEventListener('pointerdown', function (e) { if (e.preventDefault) e.preventDefault(); if (e.stopPropagation) e.stopPropagation(); });
    xb.addEventListener('pointerup', function (e) {
      if (e.preventDefault) e.preventDefault();
      inAppDismissed = true;
      try { window.sessionStorage.setItem('mehmentes.inapp', '1'); } catch (err) { /* ignore */ }
      cache.s = null; Touch.update();
    });
    Touch.inApp = detectInApp();

    initPad();
    if (storeGet() === 'right') Touch.padSide = 'right';

    // touch mode detection
    function seen(e) { if (e.pointerType === 'touch') Touch.setActive(true); }
    window.addEventListener('pointerdown', seen, true);
    window.addEventListener('pointermove', seen, true);
    try { if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) Touch.setActive(true); } catch (e) { /* ignore */ }

    document.addEventListener('contextmenu', function (e) { if (Touch.active && e.preventDefault) e.preventDefault(); });
    document.addEventListener('fullscreenchange', function () { setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 50); });
    document.addEventListener('webkitfullscreenchange', function () { setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 50); });
    Touch.layout();
  };
})();

// ===== main.js =====
// Méh-mentés — canvas setup, scaling, main loop, audio wiring
(function () {
  var CFG = MM.CFG, EV = MM.Events;
  var canvas = document.getElementById('game');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  function resize() {
    var S = MM.Stage;
    S.measure();   // decides forced landscape (rotated stage) and sizes the stage element
    var iw = S.w, ih = S.h;
    // fallback for browsers without dvh: size the body to the real visible height
    if (document.body && document.body.style) document.body.style.height = (window.innerHeight || ih) + 'px';
    var k = Math.min(iw / CFG.W, ih / CFG.H);
    var dpr = window.devicePixelRatio || 1;
    var cw = Math.floor(CFG.W * k), ch = Math.floor(CFG.H * k);
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.width = Math.max(1, Math.round(cw * dpr)); canvas.height = Math.max(1, Math.round(ch * dpr));
    if (MM.Touch && MM.Touch.layout) MM.Touch.layout();
  }
  MM.resize = resize;
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { resize(); setTimeout(resize, 200); setTimeout(resize, 600); });
  try { if (window.visualViewport) window.visualViewport.addEventListener('resize', resize); } catch (e) { /* ignore */ }
  resize();

  // ----- audio wiring -----
  function sfx(name) { return function () { if (MM.Audio) MM.Audio.sfx(name); }; }
  EV.on('edgeDone', sfx('edge'));
  EV.on('boostPickup', function (d) { if (MM.Audio) MM.Audio.sfx(d && d.type === 'freeze' ? 'freeze' : 'boost'); });
  EV.on('hit', sfx('hit'));
  EV.on('shieldBreak', sfx('shield'));
  EV.on('spiderEaten', sfx('eat'));
  EV.on('levelDone', sfx('levelDone'));
  EV.on('beeFree', sfx('bee'));
  EV.on('menuMove', sfx('menuMove'));
  EV.on('menuSelect', sfx('menuSelect'));
  EV.on('levelStart', function () {
    if (MM.Audio) { MM.Audio.playMusic('game'); MM.Audio.sfx('ready'); }
  });
  EV.on('win', function () { if (MM.Audio) { MM.Audio.playMusic('win'); } });
  EV.on('gameOver', function () { if (MM.Audio) { MM.Audio.stopMusic(); MM.Audio.sfx('gameOver'); } });

  // Audio must be unlocked inside a user gesture; iOS only accepts touchend / click, so listen to all
  // of them until the context is really running.
  var UNLOCK_EVENTS = ['keydown', 'pointerdown', 'pointerup', 'touchend', 'click'], unlockTries = 0;
  function unlock() {
    if (MM.Audio) MM.Audio.unlock();
    if (++unlockTries >= 3) for (var i = 0; i < UNLOCK_EVENTS.length; i++) window.removeEventListener(UNLOCK_EVENTS[i], unlock, true);
  }
  for (var ui = 0; ui < UNLOCK_EVENTS.length; ui++) window.addEventListener(UNLOCK_EVENTS[ui], unlock, true);
  window.addEventListener('pointerdown', function () { try { canvas.focus(); } catch (e) {} });

  // ----- init -----
  MM.Input.init(canvas);
  MM.Game.init();
  MM.Render.init(canvas, ctx);
  MM.UI.init();
  if (MM.Touch) MM.Touch.init(canvas);
  resize();
  if (MM.Audio) MM.Audio.playMusic('menu');

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && MM.Game.state === 'playing') MM.Game.togglePause();
    last = 0;
  });

  // ----- loop -----
  var last = 0, prevState = MM.Game.state;
  function frame(ts) {
    window.requestAnimationFrame(frame);
    var dt = last ? (ts - last) / 1000 : 0;
    last = ts;
    if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;

    MM.Game.update(dt);
    if (MM.Touch && MM.Touch.update) MM.Touch.update();
    if (MM.Game.state !== prevState) {
      prevState = MM.Game.state;
      if (prevState === 'menu' && MM.Audio) MM.Audio.playMusic('menu');
    }

    ctx.setTransform(canvas.width / CFG.W, 0, 0, canvas.height / CFG.H, 0, 0);
    ctx.clearRect(0, 0, CFG.W, CFG.H);
    MM.Render.draw(MM.Game, dt);
    MM.UI.draw(ctx, MM.Game, dt);
  }
  window.requestAnimationFrame(frame);
})();

</script>
